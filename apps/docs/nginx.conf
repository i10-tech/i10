server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro emits directory-style routes. Without the trailing-slash try, a
    # request for /guides/sending 404s while /guides/sending/ works — which
    # reads as a broken doc rather than a server config.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Content-addressed assets. Everything else stays revalidating, because a
    # cached-forever HTML page is a doc that never updates.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Agent surfaces ship built in — markdown twins, llms.txt and llms-full.txt.
    # They must be served as text, not downloaded as attachments.
    location ~ \.(md|txt)$ {
        default_type text/plain; charset=utf-8;
    }

    error_page 404 /404.html;
}
