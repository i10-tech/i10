apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: i10-platform-db
  namespace: i10-prod
spec:
  project: i10
  source:
    repoURL: git@github.com:i10-tech/i10.git
    targetRevision: main
    path: infra/k8s/i10/platform-db
  destination:
    server: https://kubernetes.default.svc
    namespace: i10-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # ⚠ WITHOUT ServerSideDiff THIS APP CAN NEVER REACH Synced.
      #
      # Every remaining difference is an additive default INSIDE A LIST:
      # `Service.spec.ports` gains `protocol: TCP`, a pod `volumes` entry gains
      # `configMap.defaultMode: 420`, `volumeClaimTemplates` gains apiVersion /
      # kind / volumeMode, and a CNPG `Cluster.spec.plugins` entry gains
      # `enabled: true`. Structured merge reconciles those by key; Argo's
      # CLIENT-side differ treats a list as one atomic value and reports the
      # whole list as changed.
      #
      # The sync therefore succeeds (`serverside-applied`, `all tasks run`) and
      # the app stays OutOfSync, so Argo backs off — measured at 2s, 6s, 18s,
      # 54s, then capping near 5 minutes. Not a hot loop, but OutOfSync stops
      # distinguishing real drift from normal, which is the status worth
      # alerting on.
      #
      # ⚠ THIS OPTION IS A NO-OP ON ITS OWN. The controller gates it behind
      # `controller.diff.server.side: "true"` in argocd-cmd-params-cm, which
      # defaults to false and lives in the PSL repo. With the option set here
      # and the flag off, nothing changes and nothing says why.
      #
      # Tried first and REJECTED: ignoreDifferences with managedFieldsManagers.
      # It matches nothing, because `manager` (CNPG) and `k3s` own no fields in
      # spec at all — the defaults come from a mutating webhook and end up
      # unowned. Verified by reading managedFields directly.
      - ServerSideDiff=true
