apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: i10-stalwart
  namespace: i10-prod
spec:
  project: i10
  source:
    repoURL: git@github.com:i10-tech/i10.git
    targetRevision: main
    path: infra/k8s/i10/stalwart
  destination:
    server: https://kubernetes.default.svc
    namespace: i10-prod
  syncPolicy:
    # ⚠ AUTOMATED, AND THAT IS WHAT MAKES A COMMIT A DEPLOY. The Build
    # workflow's deploy job writes each freshly built image's digest into this
    # path and pushes to main; without automation that push would publish a
    # description of production that production was not obeying.
    #
    # It was deliberately OFF until 2026-09-02, because the images did not
    # exist yet and an automated sync would have sat red on ImagePullBackOff.
    # The instruction left here was to turn automation on in the same commit
    # that first pins a digest, which is this one.
    #
    # selfHeal is the half worth knowing before debugging on the box: a
    # hand-applied change to anything under this path is reverted within about
    # 35 seconds. To test a fix live, remove `automated` first — and put it back.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
