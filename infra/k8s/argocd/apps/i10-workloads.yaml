apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: i10-workloads
  namespace: i10-prod
spec:
  project: i10
  source:
    repoURL: git@github.com:i10-tech/i10.git
    targetRevision: main
    path: infra/k8s/i10/workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: i10-prod
  syncPolicy:
    # ⚠ AUTOMATED, AND THAT IS WHAT MAKES A COMMIT A DEPLOY. The Build
    # workflow's deploy job writes each freshly built image's digest into this
    # path and pushes to main; without automation that push would publish a
    # description of production that production was not obeying.
    #
    # It was deliberately OFF until 2026-09-02, because the images did not
    # exist yet and an automated sync would have sat red on ImagePullBackOff.
    # The instruction left here was to turn automation on in the same commit
    # that first pins a digest, which is this one.
    #
    # selfHeal is the half worth knowing before debugging on the box: a
    # hand-applied change to anything under this path is reverted within about
    # 35 seconds. To test a fix live, remove `automated` first — and put it back.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # ⚠ KEDA OWNS THE WORKER'S REPLICA COUNT, SO ARGO MUST NOT. `selfHeal` reverts
  # anything under this path within about 35 seconds — including the replica
  # count an autoscaler just changed. Without this the two fight every scaling
  # event: KEDA scales to three, Argo puts it back to what the manifest says,
  # KEDA scales up again, and the log fills with a rollout that never settles.
  #
  # The Deployment therefore declares no `replicas` at all; this stops the
  # absence being re-applied as a reset to one.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: i10-worker
      jsonPointers:
        - /spec/replicas
