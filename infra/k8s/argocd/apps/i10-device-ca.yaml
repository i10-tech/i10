# The device CA: step-ca, its webhook relay, the hooks transport CA, and the
# ca.i10.tech route (#383 PR 3). See infra/k8s/i10/device-ca/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: i10-device-ca
  namespace: i10-prod
spec:
  project: i10
  source:
    repoURL: git@github.com:i10-tech/i10.git
    targetRevision: main
    path: infra/k8s/i10/device-ca
  destination:
    server: https://kubernetes.default.svc
    namespace: i10-prod
  syncPolicy:
    # ⚠ AUTOMATED, MATCHING EVERY OTHER APP HERE, AND SAFE IN ANY ORDER. The
    # pod cannot start until the Doppler Secrets (i10-doppler-secrets) and its
    # relay certificate exist: the kubelet waits on the missing Secrets and
    # nothing serves. The step-ca image is pinned by digest, and the relay's
    # i10-authd pin is rewritten by the Build workflow like Stalwart's.
    #
    # ⚠ selfHeal reverts a hand edit under this path within about 35 seconds.
    # To test a fix live, remove `automated` first, and put it back.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
