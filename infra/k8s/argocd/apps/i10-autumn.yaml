# Autumn — entitlements, self-hosted.
#
# ⚠ NOT IN `workloads`, BECAUSE ITS IMAGE IS NOT BUILT BY build.yml. Everything
# in workloads/ is pinned to a digest by the deploy job on every merge; Autumn's
# image comes from a manual, separately-pinned upstream build, and having the
# deploy job scan a directory it must never rewrite is the kind of adjacency
# that goes wrong quietly. Its own Application keeps the two lifecycles apart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: i10-autumn
  namespace: i10-prod
spec:
  project: i10
  source:
    repoURL: git@github.com:i10-tech/i10.git
    targetRevision: main
    path: infra/k8s/i10/autumn
  destination:
    server: https://kubernetes.default.svc
    namespace: i10-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ⚠ WITHOUT THIS A SYNC THAT LOSES A RACE STAYS FAILED UNTIL SOMEBODY LOOKS.
    # Argo does not retry a failed sync on its own; it records the failure and
    # waits. Most of what fails here is transient and self-clearing — the image
    # pull while ghcr is slow, the webhook that is not up yet, the ServerSide
    # apply that collides with a concurrent one — and every one of them leaves
    # the app OutOfSync indefinitely, which reads identically to a genuine
    # config error. Five attempts over roughly five minutes covers the transient
    # class without papering over the real one.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
      # See i10-redis.yaml for why this is required rather than optional — the
      # short version is that without it every additive default inside a list
      # keeps the app permanently OutOfSync.
      - ServerSideDiff=true
