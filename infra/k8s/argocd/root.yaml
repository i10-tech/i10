# i10's app-of-apps root.
#
# This is the ONLY Application applied by hand. Everything else is a file in
# argocd/apps/, so adding a component is a commit rather than a kubectl apply.
#
#   kubectl apply -f infra/k8s/argocd/root.yaml
#
# ⚠ THIS APPLICATION LIVES IN i10-prod, NOT argocd. So do all its children.
#
# That is not a style choice. An app-of-apps root creates its child Application
# objects somewhere, and `argocd` does not match the `i10-*` destination the
# i10 AppProject allows — so a root in `argocd` is rejected by the very
# boundary that makes i10 extractable. Argo's apps-in-any-namespace feature is
# the way through, and it is the only one where the boundary actually holds:
# Argo refuses to let an Application outside `argocd` claim a project that does
# not list its namespace in `sourceNamespaces`. i10 therefore cannot widen its
# own trust boundary by committing to its own repo.
#
# ⚠ IT DEPENDS ON TWO PLATFORM SETTINGS, BOTH IN THE PSL REPO:
#     argocd-cmd-params-cm   application.namespaces: i10-prod
#     AppProject i10         sourceNamespaces: [i10-prod]
# With only one of the two, Applications here are SILENTLY IGNORED — no error,
# no event, they simply never reconcile. The application controller and server
# must be restarted after the ConfigMap changes.
#
# ⚠ THE AppProject IS NOT DEFINED HERE. `i10` is declared in the PSL repo's
# platform project, alongside `psl` and `platform`, because an AppProject is a
# cluster-scoped trust boundary. i10 can deploy into i10-* and nowhere else,
# and it cannot grant itself more by editing this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: i10-root
  namespace: i10-prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: i10
  source:
    repoURL: git@github.com:i10-tech/i10.git
    targetRevision: main
    path: infra/k8s/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    # Where the CHILD Application objects are created — not where the workloads
    # land. Each child names its own destination.
    namespace: i10-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRDs can exceed kubectl's 262144-byte last-applied-configuration
      # annotation limit. Server-side apply has no such limit, and the error
      # without it names the annotation rather than the resource that broke.
      - ServerSideApply=true
