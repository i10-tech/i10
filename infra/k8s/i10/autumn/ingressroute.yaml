# Autumn's two web surfaces.
#
# ⚠ THE API IS PUBLIC BECAUSE OAUTH AND WEBHOOKS NEED IT TO BE, NOT BECAUSE
# CUSTOMERS CALL IT. i10 reaches Autumn over the cluster network — that is what
# `AUTUMN_URL` points at, and it never leaves the node. What needs a public name
# is the dashboard's sign-in: better-auth's Google callback and its email OTP
# links are absolute URLs the browser must reach.
#
# ⚠ WHICH MEANS THE API IS EXPOSED TO THE INTERNET AND ITS ONLY DOOR IS THE
# SECRET KEY. Autumn's `/v1` surface authenticates with `am_sk_…` and nothing
# else — no IP allowlist, no mTLS. Treat that key the way the SES credentials
# are treated. If this ever needs narrowing, the answer is a Traefik middleware
# restricting `/v1` to the cluster CIDR and leaving `/api/auth` public, not
# taking the whole host private.
#
# No Certificate here: `i10-tech-wildcard` in workloads/ already covers
# `*.i10.tech`, and a second certificate for the same name would race the first
# for the same ACME order.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-autumn
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`autumn.i10.tech`)
      kind: Rule
      services:
        - name: i10-autumn
          port: 80
  tls:
    secretName: i10-tech-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-autumn-dashboard
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`billing.i10.tech`)
      kind: Rule
      services:
        - name: i10-autumn-dashboard
          port: 80
  tls:
    secretName: i10-tech-tls
