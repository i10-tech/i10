# Autumn, self-hosted.
#
# ⚠ WE BUILD THE IMAGE OURSELVES — upstream publishes none. `docker/Dockerfile`
# in useautumn/autumn is built by their own deploy platform and never pushed to
# a public registry, so .github/workflows/autumn-image.yml builds it from a
# PINNED upstream commit into ghcr.io/i10-tech/autumn. Pinning is not caution:
# Autumn ships schema migrations, and tracking `main` would mean an upstream
# merge can migrate our entitlement database without anyone deciding to.
#
# ⚠ THREE COMMANDS, ONE IMAGE — exactly like i10-api and i10-worker. Their
# Dockerfile documents the split:
#
#   server  -> bun start           the HTTP API i10 calls (:8080)
#   workers -> bun src/workers.ts  drains the usage-event queue
#   cron    -> bun src/cron.ts     resets balances at the billing period boundary
#
# ⚠ ALL THREE ARE REQUIRED, AND THE TWO QUIET ONES FAIL SILENTLY. `batch_track`
# answers 202 the moment it has enqueued, so with no workers running every usage
# event is accepted and never applied — balances simply never move, and our
# reconciler would read a deficit for every tenant and top it up forever. With
# no cron, balances never reset at the period boundary, so a monthly allowance
# is really a lifetime one. Neither produces an error anywhere.
#
# ⚠ THE REST OF THE CONFIGURATION IS THE `i10-autumn` SECRET, FROM DOPPLER
# `prod_autumn`. Three of those keys are not what their names suggest, and each
# cost hours to find:
#
#   CACHE_V2_DRAGONFLY_URL           The Redis Autumn actually uses. Unset, it
#                                    builds its client with an empty URL, ioredis
#                                    falls back to 127.0.0.1:6379, and the pod
#                                    logs `[Redis] Connection error: ECONNREFUSED
#                                    127.0.0.1:6379` forever while reporting
#                                    itself merely "degraded".
#
#   REDIS_URL                        Read by NOTHING in the pinned revision,
#                                    despite being in their own .env.example.
#                                    Setting it looks like configuring Redis and
#                                    configures nothing.
#
#   MISC_CACHE_DRAGONFLY_PUBLIC_URL  A SECOND, separate cache. Cron refuses to
#                                    start without it. Same address here, but it
#                                    is not an alias — nothing derives one from
#                                    the other.
#
#   CLIENT_URL                       https://billing.i10.tech, and it only takes
#                                    effect because infra/autumn/server.Dockerfile
#                                    patches it into two hard-coded origin
#                                    allowlists. On the stock image, production
#                                    ignores it and the dashboard cannot sign
#                                    anyone in.
---
apiVersion: v1
kind: Service
metadata:
  name: i10-autumn
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-autumn-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # After the database (wave 0) and the migration (wave 1).
    argocd.argoproj.io/sync-wave: "2"
  name: i10-autumn-server
  namespace: i10-prod
spec:
  replicas: 1
  # ⚠ `Recreate`, AND IT IS A MEMORY DECISION, NOT AN AVAILABILITY ONE. Rolling
  # would start the replacement before stopping the old one, and this pod holds
  # 1315 MiB — two at once is 2.6 GiB against roughly 1 GiB of slack. The
  # scheduler would allow it, because it places pods on REQUESTS (640Mi) and
  # never on what they actually use; what stops it is the kernel OOM killer,
  # which does not know Postgres matters more than a surge replica.
  #
  # The cost is a few seconds where `/billing/checkout` and `ensureCustomer`
  # fail. Both are recoverable: grants land in core.subscriptions from the
  # webhook regardless, and the reconciler repairs a missed customer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-autumn-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-autumn-server
    spec:
      containers:
        - name: server
          image: ghcr.io/i10-tech/autumn:latest
          imagePullPolicy: Always
          command: ["bun", "start"]
          workingDir: /app/server
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: i10-autumn }
          env:
            # ⚠ FOUR IS THE UPSTREAM DEFAULT AND IT OOM-KILLS THIS POD. The
            # server runs under `node:cluster` and forks `SERVER_FORK_COUNT`
            # copies of itself — four, unset — each a full instance of a heavy
            # application. Worse, the crash is unreadable: a forked worker is
            # SIGKILLed by the cgroup, the primary sees the death and exits 1,
            # and the container reports `Error` rather than `OOMKilled` with the
            # log simply stopping mid-boot. It looks like a silent startup bug.
            #
            # One fork is right here regardless of memory: this instance serves
            # our own API and a dashboard nobody is logged into.
            - name: SERVER_FORK_COUNT
              value: "1"
            # ⚠ THE ROLE THAT OWNS THE `autumn` DATABASE. Autumn migrates its
            # own schema, so unlike i10_api this one is deliberately an owner.
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: i10-autumn-db-role, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: i10-autumn-db-role, key: password }
            # ⚠ THROUGH THE POOLER, LIKE EVERYTHING ELSE THAT SERVES REQUESTS.
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/autumn
            # ⚠ SET, BUT NOTHING READS IT IN THE PINNED REVISION. It is in their
            # `.env.example` under REQUIRED and appears nowhere else in the
            # source — vestigial rather than load-bearing. Pointed at the
            # primary anyway, so that if a future revision starts using it for
            # what the name suggests, it already has a non-pooled connection.
            - name: CRITICAL_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-rw.i10-prod.svc.cluster.local:5432/autumn
          resources:
            # ⚠ MEASURED, NOT GUESSED. Primary plus one fork settles at
            # 1315 MiB and stays flat; 640Mi and 1Gi both OOM-killed it. Roughly
            # 40% of that is JS heap — the rest is Autumn's module graph, which
            # is why capping the heap (`--smol`, BUN_JSC_forceRAMSize) changed
            # nothing measurable.
            requests: { cpu: 100m, memory: 640Mi }
            limits: { memory: 1600Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # After the database (wave 0) and the migration (wave 1).
    argocd.argoproj.io/sync-wave: "2"
  name: i10-autumn-workers
  namespace: i10-prod
spec:
  replicas: 1
  # One worker at a time: a second would double-drain the same queue while the
  # old one is still applying deductions, and a deduction applied twice is a
  # customer billed twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-autumn-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-autumn-workers
    spec:
      containers:
        - name: workers
          image: ghcr.io/i10-tech/autumn:latest
          imagePullPolicy: Always
          command: ["bun", "src/workers.ts"]
          # ⚠ ONE PROCESS, AND IT ONLY WORKS BECAUSE OUR IMAGE PATCHES THE
          # CONSTANT. Upstream hard-codes four with no environment variable;
          # infra/autumn/server.Dockerfile replaces that line with a read of
          # AUTUMN_WORKER_PROCESSES. Measured: four processes hold 1875 MiB,
          # one holds 630 MiB, and the work is a trickle of usage events.
          #
          # ⚠ RAISING THIS IS A MEMORY DECISION, NOT A THROUGHPUT ONE — each
          # extra process is another ~470 MiB of identical module graph, and
          # this box has about 1 GiB of slack once everything is running.
          workingDir: /app/server
          envFrom:
            - secretRef: { name: i10-autumn }
          env:
            - name: AUTUMN_WORKER_PROCESSES
              value: "1"
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: i10-autumn-db-role, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: i10-autumn-db-role, key: password }
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/autumn
            - name: CRITICAL_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-rw.i10-prod.svc.cluster.local:5432/autumn
          resources:
            requests: { cpu: 50m, memory: 320Mi }
            # Measured at 630 MiB with one process.
            limits: { memory: 896Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # After the database (wave 0) and the migration (wave 1).
    argocd.argoproj.io/sync-wave: "2"
  name: i10-autumn-cron
  namespace: i10-prod
spec:
  replicas: 1
  # ⚠ EXACTLY ONE, AND NOT A CronJob. `src/cron.ts` is a long-running scheduler
  # rather than a one-shot, so it is a Deployment — but two copies would run
  # every period reset twice, and a balance reset twice is an allowance granted
  # twice. Recreate keeps a rollout from briefly having two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-autumn-cron
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-autumn-cron
    spec:
      containers:
        - name: cron
          image: ghcr.io/i10-tech/autumn:latest
          imagePullPolicy: Always
          command: ["bun", "src/cron.ts"]
          workingDir: /app/server
          envFrom:
            - secretRef: { name: i10-autumn }
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: i10-autumn-db-role, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: i10-autumn-db-role, key: password }
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/autumn
            - name: CRITICAL_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-rw.i10-prod.svc.cluster.local:5432/autumn
          resources:
            # Measured at 411 MiB, which is 80% of the 512Mi it was first
            # given — too close to a limit for something whose failure mode is
            # "balances silently never reset".
            requests: { cpu: 25m, memory: 256Mi }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
