# Autumn's dashboard.
#
# ⚠ A SEPARATE IMAGE, BECAUSE UPSTREAM'S DOCKERFILE DOES NOT BUILD IT. Their
# `docker/Dockerfile` is explicitly "server + workers + cron + leaf"; the
# dashboard is a Vite SPA under `vite/` that their deploy platform builds and
# hosts separately. Ours is built by the same workflow from the same pinned
# commit — see .github/workflows/autumn-image.yml and infra/autumn/dashboard.Dockerfile.
#
# ⚠ AND IT IS NEEDED EXACTLY ONCE, THEN RARELY. Creating the organisation and
# minting the `am_sk_…` secret key happens through this UI — there is no CLI
# path to a first org. After that the catalogue is version-controlled in
# infra/autumn/autumn.config.ts and pushed with `atmn`, so day-to-day nobody
# should need to open it. It stays deployed because "rarely" is not "never":
# inspecting a customer's balances during an incident is what it is for.
#
# It is a static SPA behind Traefik — 64Mi is genuinely enough, and it is worth
# being strict about on a box this size.
---
apiVersion: v1
kind: Service
metadata:
  name: i10-autumn-dashboard
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-autumn-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-autumn-dashboard
  namespace: i10-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-autumn-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-autumn-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/i10-tech/autumn-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # ⚠ NO envFrom. A Vite build bakes `VITE_*` values into the bundle at
          # BUILD time, so setting them here would do nothing at all — and
          # mounting the Autumn config secret into a container that serves
          # public JavaScript is how a secret ends up in a bundle. The two URLs
          # it needs are build arguments in the Dockerfile instead.
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
