# The SQS-compatible queue Autumn cannot run without.
#
# ⚠ THIS IS NOT AN OPTIONAL COMPONENT, AND ITS ABSENCE IS NOT AN ERROR YOU WILL
# SEE. `addTaskToQueue` has exactly one backend in this revision — SQS — and 53
# call sites reach it, including `balances/track` and `updateBalanceV2`. With no
# queue, `batch_track` still answers 202, the usage event is never applied, and
# every balance silently stays where it was. The only loud failure is
# `atmn push`, which dies on "No queue configured. Set SQS_QUEUE_URL_V2" while
# creating a priced plan.
#
# ⚠ WHY NOT OUR OWN REDIS QUEUE. Their `addTaskToQueue` docstring still says
# "auto-detects SQS or BullMQ" and `bullmq` is still in server/package.json —
# both are vestigial. The only surviving references are two COMMENTS, one of
# which reads "will need to be refactored when migrating action handlers to
# SQS". The implementation went the other way. Using Redis would mean writing
# the producer branch, the consumer poller, and FIFO/dedup/delay/message-group
# semantics for 53 call sites, then re-verifying all of it on every upstream
# bump — in the path where a mistake is a wrong bill. Ours is groupmq rather
# than BullMQ besides, so it would be a third queue library on that Redis.
#
# ⚠ ELASTICMQ IS THE PATH UPSTREAM ALREADY BUILT FOR. `initSqs.ts` has
# `extractLocalEndpoint()`, which points the AWS SDK at a custom endpoint
# whenever the queue URL's host is not `amazonaws.com` — and its own comment
# names ElasticMQ. Nothing here is patched; it is configuration.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: i10-elasticmq
  namespace: i10-prod
  annotations:
    # Wave 0, with the database: everything in wave 2 connects to it.
    argocd.argoproj.io/sync-wave: "0"
data:
  # ⚠ THE QUEUE MUST BE DECLARED HERE. Autumn only ever calls SendMessage and
  # ReceiveMessage — it never calls CreateQueue — so a queue that is not in this
  # file does not exist, and every send fails against it.
  elasticmq.conf: |
    include classpath("application.conf")

    node-address {
      protocol = http
      host = i10-elasticmq.i10-prod.svc.cluster.local
      port = 9324
      context-path = ""
    }

    rest-sqs {
      enabled = true
      bind-port = 9324
      bind-hostname = "0.0.0.0"
      sqs-limits = strict
    }

    # ⚠ FIFO, BECAUSE BALANCE DELTAS ARE ORDER-SENSITIVE. Autumn sets
    # MessageGroupId and MessageDeduplicationId on every send to a URL ending
    # `.fifo` and omits both otherwise, so the queue's name is what selects the
    # semantics. Two deductions for one customer applied out of order leave the
    # wrong balance.
    #
    # `contentBasedDeduplication = false` because Autumn always supplies an
    # explicit dedup id — derived from a freshly generated job id, so it is
    # unique per call and never suppresses a real message.
    queues {
      "autumn-v2.fifo" {
        fifo = true
        contentBasedDeduplication = false
        defaultVisibilityTimeout = 30 seconds
        receiveMessageWait = 20 seconds
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-elasticmq
  namespace: i10-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  # ⚠ ONE, AND NEVER BRIEFLY TWO. The queue lives in this process's memory, so a
  # second replica is a second, empty queue that answers half the receives —
  # workers would poll one copy while the server sends to the other.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-elasticmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-elasticmq
    spec:
      containers:
        - name: elasticmq
          # ⚠ THE NATIVE (GraalVM) BUILD, NOT THE JVM ONE — tens of megabytes
          # against a JVM's hundreds, on a box with about 1.5 GB free.
          #
          # ⚠ AND IT MEANS THE QUEUE IS IN MEMORY ONLY. ElasticMQ's durable
          # `messages-storage` is H2 over JDBC, which is reflection-heavy and
          # undocumented for the native image — precisely what GraalVM breaks.
          # The trade is deliberate: a restart drops in-flight jobs, which are
          # seconds old, and a dropped usage event UNDERCOUNTS. It can never
          # overcharge, and no entitlement state is lost — plans and balances
          # live in Postgres, and cron resets them from there.
          image: softwaremill/elasticmq-native:1.7.1
          ports:
            - containerPort: 9324
              name: sqs
          volumeMounts:
            - name: config
              mountPath: /opt/elasticmq.conf
              subPath: elasticmq.conf
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: 9324 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9324 }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: i10-elasticmq
---
apiVersion: v1
kind: Service
metadata:
  name: i10-elasticmq
  namespace: i10-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: i10-elasticmq
  ports:
    - name: sqs
      port: 9324
      targetPort: 9324
