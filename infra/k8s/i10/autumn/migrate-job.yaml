# Autumn's schema, as an Argo Sync hook in wave 1.
#
# ⚠ THE SAME REASONING AS i10-api-migrate, AND MORE NECESSARY HERE. Autumn runs
# three Deployments off one image; migrating on boot would have server, workers
# and cron race for the same schema lock on every rollout, and two of the three
# would crash-loop until the winner finished. PreSync runs once per sync, before
# any new pod starts.
#
# ⚠ `--bootstrap` IS FOR A FRESH DATABASE AND MUST BE REMOVED AFTER THE FIRST
# SYNC. Their migrate command reads it as "skip the index-DDL safety check",
# which exists to stop a migration taking a blocking lock on a populated table.
# Correct exactly once — on an empty database — and a loaded gun on every sync
# after that.
apiVersion: batch/v1
kind: Job
metadata:
  name: i10-autumn-migrate
  namespace: i10-prod
  annotations:
    # ⚠ `Sync` IN WAVE 1, NOT `PreSync`, AND THE DIFFERENCE IS THE DATABASE
    # ITSELF. PreSync hooks run before every normal resource in the
    # Application — including database.yaml, the CNPG `Database` that creates
    # the `autumn` database this Job connects to. As a PreSync hook it
    # therefore ran first, failed to connect to a database that did not exist
    # yet, and blocked the sync that would have created it. A deadlock that
    # looks like a migration bug.
    #
    # Wave 0 is the Database; this is wave 1; the Deployments are wave 2.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # ⚠ RETRIES ARE LOAD-BEARING HERE, NOT DEFENSIVE. Argo treats a CNPG
  # `Database` as healthy the moment it is applied — it does not wait for the
  # operator to actually CREATE the database — so this Job can start a second
  # or two too early. Each retry is a fresh connection attempt, which is
  # exactly what is needed while the operator catches up.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-autumn-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/i10-tech/autumn:latest
          imagePullPolicy: Always
          # ⚠ FROM THE REPO ROOT, NOT /app/server. `bun db` is a root-level
          # script (scripts/db/index.ts) and the Drizzle config it loads reads
          # `../server/.env` relative to `shared/` — the working directory is
          # part of the contract.
          workingDir: /app
          # ⚠ THE WAIT LOOP IS NOT DEFENSIVE PADDING — IT IS FOR A RACE THAT
          # FAILED THIS JOB FIVE TIMES IN A ROW. A short-lived pod that opens a
          # connection within a second of starting can beat the CNI's
          # programming of NetworkPolicy rules for its brand-new pod IP; this
          # cluster has `default-deny-ingress`, and its enforcement REJECTS
          # rather than drops, so the migration died instantly with
          # `connect ECONNREFUSED` against a database that was up the whole
          # time. An identical pod, exec'd into a minute later, connected fine.
          #
          # Retrying the Job does not help: every replacement pod is new and
          # loses the same race. Waiting inside ONE pod does, because by the
          # second attempt the rules exist.
          #
          # ⚠ AND IT DELIBERATELY DOES NOT RETRY THE MIGRATION ITSELF. Only
          # reachability is retried; a migration that fails for a real reason
          # must fail once, loudly, rather than ten times with the true error
          # scrolled off the top.
          #
          # `--env=prod` is cosmetic once AUTUMN_DB_DIRECT is set — it selects
          # which Infisical environment to wrap in, and we are not wrapping. It
          # is here because without it the job logs `env=dev` while migrating
          # production, which is a line someone will one day read at 3am.
          command:
            - bash
            - -c
            - |
              host=i10-platform-rw.i10-prod.svc.cluster.local
              for i in $(seq 1 30); do
                if (echo > /dev/tcp/$host/5432) 2>/dev/null; then
                  echo "postgres reachable after ${i} attempt(s)"
                  exec bun db migrate --bootstrap --env=prod
                fi
                sleep 2
              done
              echo "postgres unreachable at ${host}:5432 after 60s" >&2
              exit 1
          envFrom:
            - secretRef: { name: i10-autumn }
          env:
            # ⚠ WITHOUT THIS THE MIGRATION RE-EXECS ITSELF UNDER `infisical run`
            # AND DIES. Autumn's `bun db` wraps every invocation in Infisical —
            # their own secret manager — to inject DATABASE_URL from the right
            # environment. The binary is not in the image, so the failure is
            # `failed to spawn infisical: Executable not found in $PATH`, which
            # reads like a broken image rather than a secrets-tooling
            # assumption.
            #
            # `AUTUMN_DB_DIRECT=1` is their own supported bypass, not a hack —
            # scripts/db/helpers/env.ts checks it before wrapping, and its error
            # path says plainly that the caller must inject the URL instead. We
            # do, from Doppler, three lines down.
            - name: AUTUMN_DB_DIRECT
              value: "1"
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: i10-autumn-db-role, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: i10-autumn-db-role, key: password }
            # ⚠ THE PRIMARY, NOT THE POOLER. Migrations take advisory locks and
            # run DDL in a transaction; PgBouncer in transaction pooling mode
            # can hand consecutive statements to different backends and breaks
            # both. Same rule as apps/api's own migrate Job.
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-rw.i10-prod.svc.cluster.local:5432/autumn
            - name: CRITICAL_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-rw.i10-prod.svc.cluster.local:5432/autumn
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
