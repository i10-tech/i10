# i10's Redis. The send and webhook queues live here.
#
# ⚠ A SEPARATE INSTANCE, NOT PSL'S WITH A PREFIX. Queues are product data. A
# shared Redis is the kind of coupling that survives every review because it
# works - right up to extraction, when it turns a migration into a rewrite.
#
# RDB + AOF with appendfsync everysec, plus idempotent handlers on our side.
# That pairing is the decision: neither persistence mode alone bounds loss the
# way the two together do, and neither removes the need for handlers that can
# run twice.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: i10-redis-config
  namespace: i10-prod
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    # groupmq holds job state in Redis - the job hash, the per-group sorted
    # sets, the ready and delayed sets and the `:unique:` keys that make an
    # enqueue idempotent. Evicting any of them to make room silently loses a
    # job, so the instance must refuse writes instead of choosing a victim:
    # `noeviction` turns a data-loss bug into a visible error.
    #
    # ⚠ AND A LOST JOB IS NOT A LOST MESSAGE, WHICH IS THE OTHER HALF OF THIS.
    # The row in `core.messages` is the record; the message-sweep CronJob finds
    # rows no job points at and enqueues them again. Redis refusing writes is
    # still the right failure, because it is loud - but it is survivable rather
    # than terminal.
    maxmemory-policy noeviction
    maxmemory 384mb
---
apiVersion: v1
kind: Service
metadata:
  name: i10-redis
  namespace: i10-prod
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: i10-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: i10-redis
  namespace: i10-prod
spec:
  serviceName: i10-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:8.10-alpine
          # ⚠ TWO LAYERS IN FRONT OF THE QUEUES. `redis-clients`
          # (workloads/networkpolicy.yaml) admits only the API group to 6379,
          # and this password is the second layer, for the day a policy is
          # widened by mistake.
          #
          # It comes from Doppler `prod_api` (REDIS_PASSWORD), the same value
          # that REDIS_URL carries for the API, the worker and the CronJobs.
          # `$(REDIS_PASSWORD)` is expanded by the kubelet from the env below.
          #
          # ⚠ A NEW PASSWORD NEEDS A RESTART OF THIS POD AND OF EVERY CLIENT.
          # Doppler updates the Secrets, but nothing reloads a running pod.
          args: ["/etc/redis/redis.conf", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: i10-redis-auth, key: REDIS_PASSWORD }
            # redis-cli reads this, so the probes below authenticate.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: { name: i10-redis-auth, key: REDIS_PASSWORD }
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: data
              mountPath: /data
          # ⚠ `grep PONG`, NOT THE EXIT CODE. redis-cli exits 0 when the server
          # answers with an error, so a bare `redis-cli ping` passes on NOAUTH
          # and would hide a probe that lost its password.
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli ping | grep -q PONG"] }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli ping | grep -q PONG"] }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: i10-redis-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # psl-zfs, not psl-zfs-db: the 16k recordsize on the db class is tuned
        # for Postgres pages. AOF is an append stream and wants the 128k default.
        #
        # ⚠ The StorageClasses are named psl-* because they are PLATFORM
        # objects, cluster-scoped and owned by the platform Argo project - not
        # because they belong to PSL. Renaming them is a psl-repo change and is
        # worth doing before i10 leaves the box, so nothing reads as borrowed.
        storageClassName: psl-zfs
        resources:
          requests:
            storage: 1Gi
