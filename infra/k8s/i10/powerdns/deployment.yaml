# The authoritative nameserver for delegated customer subdomains.
#
# ⚠ WITHOUT THIS, DELEGATION IS A FEATURE THAT CANNOT WORK. The API has written
# zones into `pdns.domains` and `pdns.records` since migration 0023 and the
# console has been telling customers to point NS records at `ns1.i10.tech` -
# with nothing anywhere serving those zones. `ns1`/`ns2` resolved to
# Cloudflare's HTTP proxy addresses and answered nothing on port 53, so every
# delegated domain sat `pending` for ever while the console said propagation can
# take 72 hours. This is the missing half.
#
# ⚠ IT READS THE ZONES; IT DOES NOT OWN THEM. The API writes a domain row and
# its zone in one transaction - that atomicity is the entire reason the `pdns`
# schema lives inside the `i10` database rather than beside it. PowerDNS here is
# a renderer of rows somebody else wrote, which is why it needs no persistence,
# no leader election and no state of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-powerdns
  namespace: i10-prod
  labels:
    app.kubernetes.io/name: i10-powerdns
spec:
  # ⚠ ONE REPLICA, AND THE `hostPort` BELOW IS WHY IT CANNOT SIMPLY BE TWO. Two
  # pods on one node cannot both claim :53, so a second replica would sit
  # Pending for ever and read as a broken rollout rather than a port conflict.
  # Real redundancy here means a second NODE, which is a cluster change; see the
  # note on `MAIL_NAMESERVERS` in apps/api/src/env.ts, which has said since it
  # was written that two names pointing at one machine buys the appearance of
  # redundancy and not the fact of it.
  replicas: 1
  strategy:
    # ⚠ Recreate, NOT RollingUpdate. A rolling update would start the new pod
    # before the old one released :53, and the new one would fail to bind - so
    # every deploy would stall with the old pod already terminating. A few
    # seconds of downtime on a zone whose records have a 300-second TTL is not
    # something a resolver notices; a wedged rollout is.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-powerdns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-powerdns
    spec:
      # ⚠ `ClusterFirst`, AND THE `Default` THAT WAS HERE CRASHLOOPED THE POD.
      # The comment that used to sit here argued the pod must not resolve
      # through CoreDNS, on the reasoning that a nameserver resolving through
      # something that may forward BACK to it is a loop - and that it only ever
      # needs Postgres, "which it does by ClusterIP through the env below".
      #
      # That last clause was simply untrue. `PDNS_GPGSQL_HOST` below is the
      # service NAME `i10-platform-pooler`, not an address, so with the node's
      # resolver the pod got:
      #
      #   could not translate host name "i10-platform-pooler" to address:
      #   Name or service not known
      #
      # …and died before serving a single query. It could never have worked.
      #
      # ⚠ AND THE LOOP IT WORRIED ABOUT CANNOT HAPPEN FOR THIS LOOKUP. CoreDNS
      # answers `*.svc.cluster.local` from its own zone and forwards only what
      # it cannot answer; a cluster service name is answered locally and never
      # leaves the node. The loop would need PowerDNS to resolve a PUBLIC name,
      # which it has no reason to do - it is authoritative, not recursive.
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        runAsUser: 953
        runAsGroup: 953
        fsGroup: 953
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Builds the tailnet view into a fresh LMDB file from the ConfigMap, so
        # the view is whatever the commit says and nothing else. See
        # infra/k8s/argo-ui.md for what it is for and why it is shaped this way.
        #
        # ⚠ IT STARTS FROM AN EMPTY DIRECTORY EVERY TIME. `zone load` into a
        # file that already holds the zone would merge rather than replace, and
        # an emptyDir survives a container restart within the pod.
        - name: views
          image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-euc"]
          args:
            - |
              rm -rf /var/lib/powerdns/views/*
              u() { pdnsutil --config-dir=/etc/pdns-views "$@"; }
              u zone load argo.i10.tech..tailnet /etc/pdns-views/argo.i10.tech.zone
              u network set 100.64.0.0/10 tailnet
              u network set fd7a:115c:a1e0::/48 tailnet
              u view add-zone tailnet argo.i10.tech..tailnet
              u network list
              u view list tailnet
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/pdns-views/pdns.conf
              subPath: views.conf
              readOnly: true
            - name: config
              mountPath: /etc/pdns-views/argo.i10.tech.zone
              subPath: argo.i10.tech.zone
              readOnly: true
            - { name: views, mountPath: /var/lib/powerdns/views }
            - { name: run, mountPath: /var/run/pdns }
      containers:
        - name: pdns
          # ⚠ PINNED BY DIGEST, LIKE EVERY OTHER IMAGE HERE. A floating tag on
          # the process that answers for customers' mail DNS means a restart can
          # change behaviour with no commit to point at.
          #
          # ⚠ 5.1.4, NOT THE 4.9 BRANCH, AND THE REASON IS A SECURITY ADVISORY.
          # This was first written against `pdns-auth-49:4.9.9`, which starts up
          # and prints "PowerDNS Security Update Mandatory". Advisory 2026-11 is
          # High severity - a crafted DNS packet drives memory and CPU - and is
          # fixed in 4.9.17, 5.0.7 and 5.1.4. The `pdns-auth-49` image repository
          # publishes nothing past 4.9.9, so the 4.9 branch cannot be patched by
          # image at all. 5.1.4 reports "no known issues" at startup and was
          # verified against our 4.x gpgsql schema locally - it serves the zones
          # `powerdns.ts` writes without a schema change.
          #
          # ⚠ NOW 5.1.5, FOR THE NEXT ADVISORY. 5.1.4 started printing
          # "Security Update Mandatory" once advisory 2026-13 landed (High, a
          # crafted packet's compression pointers drive CPU; CVE-2026-73206).
          # 5.1.5 is the first fixed 5.1 release and the newest stable branch;
          # 5.2 is alpha only. KEEP THE INIT CONTAINER BELOW ON THE SAME DIGEST:
          # it writes the LMDB file this process reads.
          #
          # ⚠ AND `runAsUser: 953` BELOW MATCHES THIS IMAGE'S `pdns` ACCOUNT.
          # The image declares `User: pdns` by NAME, and `runAsNonRoot` cannot
          # verify a name - the kubelet refuses the pod with "has non-numeric
          # user (pdns), cannot verify user is non-root". 953 is that account's
          # uid, read out of the image's own /etc/passwd.
          image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # ⚠ THE ONE CAPABILITY IT GENUINELY NEEDS, and only because 53 is
              # a privileged port. Everything else is dropped; the process runs
              # as an unprivileged uid and cannot escalate.
              add: ["NET_BIND_SERVICE"]
          # ⚠ NO `args` BEYOND THE PASSWORD. Everything else lives in the
          # ConfigMap mounted below, which REPLACES the image's own pdns.conf -
          # see that file for why a config full of command-line flags could not
          # work at all.
          args:
            # ⚠ THE ONE SETTING THAT CANNOT BE IN THE CONFIGMAP. A ConfigMap is
            # readable by anything with `get` on this namespace; a command-line
            # setting overrides the file, so the password arrives from the
            # Secret through the environment and nowhere else.
            - "--gpgsql-password=$(PDNS_DB_PASSWORD)"
          env:
            # ⚠ THE POOLER, NOT THE PRIMARY. Everything else in this namespace
            # goes through `i10-platform-pooler`, and a nameserver holding direct
            # backend connections would compete with the API for the same pool
            # that the rest of the product depends on.
            - name: PDNS_DB_HOST
              value: i10-platform-pooler
            - name: PDNS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: i10-pdns-db-role
                  key: username
            - name: PDNS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: i10-pdns-db-role
                  key: password
          ports:
            # ⚠ hostPort, FOR THE SAME REASON STALWART USES IT. k3s serves
            # `type: LoadBalancer` with klipper-lb, whose path DNATs twice and
            # re-enters the host on a NodePort - and MASQUERADEs, so the server
            # would see the node as the source of every query. hostPort is one
            # hop through the CNI portmap plugin.
            #
            # ⚠ AND BOTH PROTOCOLS ARE REQUIRED, NOT JUST UDP. A response larger
            # than 512 bytes sets TC and the resolver retries over TCP; a zone
            # with two NS records and an SOA will exceed that as soon as DNSSEC
            # or a longer DKIM answer is involved. A UDP-only nameserver fails
            # intermittently and only for the larger answers, which is the
            # hardest shape of DNS bug to see.
            #
            # ⚠ EVERY hostPort NAMES ITS hostIP. Without one, the CNI portmap
            # plugin DNATs :53 on EVERY local address - including 127.0.0.53,
            # systemd-resolved's stub - so the node's own lookups landed here and
            # got REFUSED, and while this pod was down the node had no DNS and
            # could not pull images. Pinned, the stub is resolved's again (see
            # "The node's own DNS" in README.md). Four addresses answer: ns1/ns2
            # on both families (README section 2) and the tailnet address on
            # both families, for the argo.i10.tech view (infra/k8s/argo-ui.md).
            #
            # ⚠ ONE ADDRESS PER CONTAINER, AND ONLY THIS ONE IS HERE. The other
            # three are declared by the `ports-*` containers below. Server-side
            # apply keys a container's ports by containerPort + protocol, so two
            # `53/UDP` entries in one list are rejected ("duplicate entries for
            # key"), and Argo's diff silently merges them and reports Synced
            # while applying nothing. That is exactly what #417 did. The key is
            # per container, the pod has one network namespace, and portmap
            # sends every pinned address to the pod IP's :53, which is this
            # process. A NEW NODE ADDRESS IS A NEW `ports-*` CONTAINER.
            - name: dns-udp-pub4
              containerPort: 53
              hostPort: 53
              hostIP: "178.105.164.132"
              protocol: UDP
            - name: dns-tcp-pub4
              containerPort: 53
              hostPort: 53
              hostIP: "178.105.164.132"
              protocol: TCP
            - { name: http, containerPort: 8081, protocol: TCP }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            # ⚠ MOUNTED AS A SINGLE FILE OVER THE IMAGE'S OWN, not as a
            # directory. Mounting the directory would hide everything else in
            # /etc/powerdns - including `pdns.d`, which the image's entrypoint
            # writes into when an API key is set, and which it would then fail
            # to create on a read-only mount.
            #
            # ⚠ A `subPath` MOUNT DOES NOT UPDATE WHEN THE ConfigMap CHANGES.
            # That is the documented trade and it is the right one here: a
            # nameserver silently reloading its backend config under live
            # queries is worse than one that waits for a rollout. Argo restarts
            # the pod when the ConfigMap's hash changes, which is the intended
            # path for a config edit.
            - name: config
              mountPath: /etc/powerdns/pdns.conf
              subPath: pdns.conf
              readOnly: true
            # `readOnlyRootFilesystem` with a writable run directory: PowerDNS
            # wants a control socket and a pid file, and neither needs to
            # survive a restart.
            - { name: run, mountPath: /var/run/pdns }
            - { name: views, mountPath: /var/lib/powerdns/views }
        # ⚠ THESE CONTAINERS DO NOTHING BUT HOLD A PORT DECLARATION. Each one
        # pins :53 on one more node address (see the note on `pdns` ports for
        # why they cannot all live in one list). They run the pdns image, which
        # is already on the node, so they add no image to pull. The shell traps
        # TERM because a bare `sleep` as PID 1 ignores it, and with `Recreate`
        # every second spent waiting out the grace period is a second with no
        # nameserver.
        - name: ports-pub6
          image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 3600 & wait $!; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: dns-udp-pub6
              containerPort: 53
              hostPort: 53
              hostIP: "2a01:4f8:1c18:45fb::1"
              protocol: UDP
            - name: dns-tcp-pub6
              containerPort: 53
              hostPort: 53
              hostIP: "2a01:4f8:1c18:45fb::1"
              protocol: TCP
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 16Mi }
        - name: ports-ts4
          image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 3600 & wait $!; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: dns-udp-ts4
              containerPort: 53
              hostPort: 53
              hostIP: "100.127.102.63"
              protocol: UDP
            - name: dns-tcp-ts4
              containerPort: 53
              hostPort: 53
              hostIP: "100.127.102.63"
              protocol: TCP
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 16Mi }
        - name: ports-ts6
          image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 3600 & wait $!; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: dns-udp-ts6
              containerPort: 53
              hostPort: 53
              hostIP: "fd7a:115c:a1e0::9932:663f"
              protocol: UDP
            - name: dns-tcp-ts6
              containerPort: 53
              hostPort: 53
              hostIP: "fd7a:115c:a1e0::9932:663f"
              protocol: TCP
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 16Mi }
      volumes:
        - name: config
          configMap:
            name: i10-powerdns
        - name: run
          emptyDir: {}
        - name: views
          emptyDir: {}
