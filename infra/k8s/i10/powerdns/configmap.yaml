# The nameserver's configuration, replacing the image's own.
#
# ⚠ THE IMAGE'S DEFAULT pdns.conf IS WHY THIS EXISTS, AND THE FAILURE IT CAUSES
# NAMES THE WRONG THING. It ships:
#
#     launch=gsqlite3
#     gsqlite3-dnssec
#     gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
#
# Overriding `launch` on the command line means the sqlite backend is never
# loaded - and the two settings below it are then settings for a backend that
# does not exist, which PowerDNS treats as fatal:
#
#     Fatal error: Trying to set unknown setting 'gsqlite3-dnssec'
#
# It names a backend nobody asked for, mentions neither the config file nor the
# flag, and no arrangement of arguments fixes it. The file has to be replaced.
# Found by running the local stack in compose.dev.yaml; this manifest carried
# command-line flags and would have crashlooped on the first sync.
#
# ⚠ KEEP THIS IN STEP WITH dev/powerdns/pdns.conf. They are the same file minus
# the password, and a setting added to one and not the other is a difference
# that only appears under real traffic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: i10-powerdns
  namespace: i10-prod
  labels:
    app.kubernetes.io/name: i10-powerdns
data:
  pdns.conf: |
    # ⚠ gpgsql FIRST. Customer zones are rows the API writes; `lmdb` carries
    # only the tailnet view built at pod start (see `views.conf` below and
    # infra/k8s/argo-ui.md). Order matters for writes, and nothing writes here.
    launch=gpgsql,lmdb

    gpgsql-host=i10-platform-pooler
    gpgsql-port=5432
    gpgsql-dbname=i10
    gpgsql-user=pdns

    # ⚠ THE PASSWORD IS NOT HERE, AND MUST NOT BE. A ConfigMap is world-readable
    # to anything with `get` on the namespace. It is supplied on the command
    # line from the Secret - see the Deployment - and a command-line setting
    # overrides the file.

    # ⚠ THE SCHEMA IS SELECTED BY `search_path`, NOT BY QUALIFYING THE QUERIES.
    # PowerDNS's gpgsql backend emits unqualified table names and offers no way
    # to prefix them, so this is the only thing that makes it find
    # `pdns.domains` rather than looking in `public` and serving nothing.
    gpgsql-extra-connection-parameters=options=-csearch_path=pdns

    # ⚠ OFF BECAUSE OUR WRITER DOES NOT MAINTAIN THE COLUMNS IT NEEDS. With
    # DNSSEC on, PowerDNS expects `ordername` and `auth` on every record, and
    # apps/api/src/domains/powerdns.ts writes neither - the result is a zone
    # that answers NXDOMAIN for names that exist.
    gpgsql-dnssec=no

    # ⚠ THE ZONE CACHE IS REFRESHED EVERY MINUTE, NOT EVERY FIVE. PowerDNS
    # caches the LIST of zones it serves and re-reads it only on this interval;
    # the default is 300 seconds, and until then a zone the API has just written
    # answers REFUSED - as though we were not authoritative for it at all.
    # Measured locally: a zone inserted while the server ran was invisible until
    # the interval elapsed.
    #
    # ⚠ THAT MATTERS BECAUSE CREATING A DOMAIN AND PUBLISHING ITS ZONE ARE ONE
    # TRANSACTION. The customer adds a domain, publishes records, presses
    # Verify - and for five minutes our own nameserver would deny knowing the
    # zone, which the delegation check reports as `nameserver_silent`: our
    # fault, correctly, and clearing on its own. The worst kind of intermittent.
    #
    # ⚠ NOT ZERO. Disabling the cache puts a database query on the path of every
    # DNS question, so a Postgres hiccup becomes a DNS outage.
    zone-cache-refresh-interval=60

    # An authoritative server that recurses is an open resolver, which is an
    # amplification reflector with our address on it. There is also no secondary
    # to transfer to, and an open transfer hands anybody every customer domain.
    disable-axfr=yes

    # ⚠ BOTH FAMILIES. This was `0.0.0.0` alone, so the server never listened
    # on IPv6 at all while `ns1`/`ns2` publish AAAA records: every resolver that
    # tried the AAAA timed out. Found 2026-11-05. `::` here is PowerDNS's own
    # default, which the old line had narrowed.
    local-address=0.0.0.0, ::
    local-port=53

    # ⚠ BOUND TO THE POD, NOT THE HOST. It is the readiness probe's target and
    # has no hostPort, so it is not reachable from outside the cluster.
    webserver=yes
    webserver-address=0.0.0.0
    webserver-port=8081
    webserver-allow-from=0.0.0.0/0

    loglevel=4
    log-dns-queries=no

    # ⚠ VIEWS: ONE ZONE ANSWERED ONLY TO THE TAILNET. Read infra/k8s/argo-ui.md
    # before touching any of this. Queries from a network listed in the LMDB
    # file get that view's zone variants; everyone else gets the server as it
    # was, so a public query for `argo.i10.tech` is REFUSED exactly like any
    # name we do not host. Views need the zone cache, which is on above.
    #
    # ⚠ THESE THREE LMDB SETTINGS MUST MATCH `views.conf`. The init container
    # writes the file with those, this process opens it with these, and a
    # different shard count reads as an empty database rather than an error.
    views=yes
    lmdb-filename=/var/lib/powerdns/views/pdns.lmdb
    lmdb-shards=1
    lmdb-map-size=64

  # The init container's config: LMDB alone, so building the view needs no
  # database and cannot touch a customer zone.
  views.conf: |
    launch=lmdb
    views=yes
    lmdb-filename=/var/lib/powerdns/views/pdns.lmdb
    lmdb-shards=1
    lmdb-map-size=64

  # ⚠ THE BOX'S TAILNET ADDRESSES, NOT ITS PUBLIC ONES. Tailnet clients reach
  # Traefik over WireGuard at these, so Traefik sees their 100.x / fd7a: source
  # and the `ClientIP` rule in the argocd IngressRoute can match. They change
  # only if psl-vps is removed from the tailnet and re-added; `tailscale ip` on
  # the box prints the current pair.
  argo.i10.tech.zone: |
    $ORIGIN argo.i10.tech.
    @ 60 IN SOA ns1.i10.tech. hostmaster.i10.tech. 1 3600 600 86400 60
    @ 60 IN NS ns1.i10.tech.
    @ 60 IN A 100.127.102.63
    @ 60 IN AAAA fd7a:115c:a1e0::9932:663f
