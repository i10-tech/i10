# i10's Postgres.
#
# ⚠ ONE CNPG CLUSTER PER PRODUCT — never one Cluster holding a database for
# each. That single choice is the difference between extracting i10 being a
# `bootstrap.recovery` from its own archive (a documented operation) and being
# a dump-and-restore with a write freeze. The CNPG *operator* is shared; this
# object is not.
#
# ⚠ SIZING IS THE POOL, NOT THIS FILE. zpool `psl-data` is 9.5 G and PSL's
# cluster already claims 4+2 of it. ZFS-LocalPV thin-provisions, so these are
# ceilings rather than reservations, but 4+2 here over-commits. Grow the
# Hetzner volume (`zpool online -e`) before either database holds real data.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: i10-platform
  namespace: i10-prod
spec:
  instances: 1
  # 18.5 does not exist upstream — 18.4 and 18.6 do. Probe a tag before pinning.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm

  enableSuperuserAccess: false

  storage:
    size: 4Gi
    storageClass: psl-zfs-db
  # WAL on its own volume. A stuck archiver then fills this instead of the data
  # volume, which turns "backups broke" into a bounded problem rather than a
  # database that stops accepting writes.
  walStorage:
    size: 2Gi
    storageClass: psl-zfs-db

  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

  postgresql:
    parameters:
      # SAFE ONLY BECAUSE THIS IS ZFS. Copy-on-write makes a page write atomic,
      # so torn pages cannot happen. On ext4/xfs this risks unrecoverable
      # corruption — the setting travels with the storage class, not the cluster.
      full_page_writes: "off"

  # The fast, LOCAL copy — not a backup. It dies with the pool. What it buys is
  # instant CoW clones: prod cloned in ~23s for under 2 MB, which is the whole
  # preview-database mechanism. Barman below is the durable, offsite copy.
  backup:
    volumeSnapshot:
      className: psl-zfs-snapshot
      online: true
      snapshotOwnerReference: backup

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: i10-backups

  # Roles beyond the bootstrap `i10` owner.
  #
  # ⚠ MANAGED MEANS CNPG RECONCILES IT. Editing this role by hand in psql is
  # undone on the next reconciliation loop; change it here instead.
  managed:
    roles:
      # Owns the `stalwart` database declared in i10/stalwart/database.yaml.
      # Not a superuser and not a member of `i10`: the whole reason Stalwart has
      # its own database is that its pre-1.0 schema migrations must not be able
      # to touch the transactional product's tables.
      - name: stalwart
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-stalwart-db-role

      # Reads the Clerk projection, and nothing else.
      #
      # ⚠ SEPARATE FROM THE `i10` OWNER ON PURPOSE. authd parses
      # attacker-influenced input — login strings and passwords from any IMAP
      # client, recipient addresses from any sending MTA — and it only ever
      # needs SELECT on the `authd` schema. Connecting as the database owner
      # would mean a parser bug reaches every table in the product. The grants
      # that scope it live in apps/api/drizzle, applied with the schema.
      - name: authd
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-authd-db-role

      # What apps/api and apps/worker connect as.
      #
      # ⚠ NOT THE `i10` OWNER, AND THAT IS THE WHOLE POINT. Row level security
      # does not apply to a table's owner. Every tenant policy in the `core`
      # schema is a no-op for `i10`, silently — no error, no log line, just a
      # boundary that is not there. This role owns nothing, so the policies bind
      # to it. Migrations still run as the owner, because a backfill has to be
      # able to cross tenants.
      #
      # apps/api/src/db/client.ts refuses to start if it finds itself connected
      # as an owning, superuser or BYPASSRLS role, so a mistake here is a failed
      # rollout rather than a leak.
      - name: i10_api
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-api-db-role

      # Owns the `autumn` database declared in i10/autumn/database.yaml.
      #
      # ⚠ IT OWNS ITS TABLES, WHICH IS WHY IT NEEDS ITS OWN DATABASE. Autumn
      # generates and applies its own Drizzle migrations on every upgrade, so
      # the role it connects as must be able to CREATE, ALTER and DROP. That is
      # the exact opposite of `i10_api`, which owns nothing so that row level
      # security binds to it — the two cannot share a database without one of
      # them being wrong.
      - name: autumn
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-autumn-db-role

  bootstrap:
    initdb:
      database: i10
      owner: i10
