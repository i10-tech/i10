# i10's Postgres.
#
# ⚠ ONE CNPG CLUSTER PER PRODUCT - never one Cluster holding a database for
# each. That single choice is the difference between extracting i10 being a
# `bootstrap.recovery` from its own archive (a documented operation) and being
# a dump-and-restore with a write freeze. The CNPG *operator* is shared; this
# object is not.
#
# ⚠ SIZING IS THE POOL, NOT THIS FILE. zpool `psl-data` is 9.5 G and PSL's
# cluster already claims 4+2 of it. ZFS-LocalPV thin-provisions, so these are
# ceilings rather than reservations, but 4+2 here over-commits. Grow the
# Hetzner volume (`zpool online -e`) before either database holds real data.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: i10-platform
  namespace: i10-prod
spec:
  instances: 1
  # 18.5 does not exist upstream - 18.4 and 18.6 do. Probe a tag before pinning.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm

  enableSuperuserAccess: false

  storage:
    size: 4Gi
    storageClass: psl-zfs-db
  # WAL on its own volume. A stuck archiver then fills this instead of the data
  # volume, which turns "backups broke" into a bounded problem rather than a
  # database that stops accepting writes.
  walStorage:
    size: 2Gi
    storageClass: psl-zfs-db

  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

  postgresql:
    parameters:
      # SAFE ONLY BECAUSE THIS IS ZFS. Copy-on-write makes a page write atomic,
      # so torn pages cannot happen. On ext4/xfs this risks unrecoverable
      # corruption - the setting travels with the storage class, not the cluster.
      full_page_writes: "off"
      # These are deliberately generous because the cluster serves migrations
      # and batch jobs as well as requests. lock_timeout remains short enough
      # to fail a DDL lock wait rather than queueing behind it indefinitely.
      statement_timeout: "30min"
      lock_timeout: "30s"
      idle_in_transaction_session_timeout: "5min"

      # CNPG manages both preload libraries and installs pg_stat_statements
      # when these parameters are configured. track=all includes statements
      # run inside functions such as the SECURITY DEFINER hot paths.
      pg_stat_statements.max: "5000"
      pg_stat_statements.track: "all"

      # Capture sampled plans for statements slower than 1s. Analyze adds
      # instrumentation only to sampled statements; timing remains off to keep
      # per-node clock reads out of execution. Buffers are counters, not clock
      # reads, and they are what db-guard reviews a plan by.
      auto_explain.log_min_duration: "1s"
      auto_explain.log_analyze: "on"
      auto_explain.log_buffers: "on"
      auto_explain.log_timing: "off"
      auto_explain.log_nested_statements: "on"
      auto_explain.sample_rate: "0.1"

  # The fast, LOCAL copy - not a backup. It dies with the pool. What it buys is
  # instant CoW clones: prod cloned in ~23s for under 2 MB, which is the whole
  # preview-database mechanism. Barman below is the durable, offsite copy.
  backup:
    volumeSnapshot:
      className: psl-zfs-snapshot
      online: true
      snapshotOwnerReference: backup

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: i10-backups

  # Roles beyond the bootstrap `i10` owner.
  #
  # ⚠ MANAGED MEANS CNPG RECONCILES IT. Editing this role by hand in psql is
  # undone on the next reconciliation loop; change it here instead.
  managed:
    roles:
      # Owns the `stalwart` database declared in i10/stalwart/database.yaml.
      # Not a superuser and not a member of `i10`: the whole reason Stalwart has
      # its own database is that its pre-1.0 schema migrations must not be able
      # to touch the transactional product's tables.
      - name: stalwart
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-stalwart-db-role

      # Reads the Clerk projection, and nothing else.
      #
      # ⚠ SEPARATE FROM THE `i10` OWNER ON PURPOSE. authd parses
      # attacker-influenced input - login strings and passwords from any IMAP
      # client, recipient addresses from any sending MTA - and it only ever
      # needs SELECT on the `authd` schema. Connecting as the database owner
      # would mean a parser bug reaches every table in the product. The grants
      # that scope it live in apps/api/drizzle, applied with the schema.
      - name: authd
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-authd-db-role

      # The mail front's role (services/authd/README.md, "Mail front"): what
      # authd's bind reads and nothing else, read-only.
      #
      # ⚠ NOT THE `authd` ROLE, EVEN THOUGH IT READS THE SAME ROWS. `authd` may
      # INSERT and UPDATE `authd.bind_failure_budget`, and the front parses
      # bytes from anyone on the internet before they sign in. Sharing the role
      # would let a bug in it reset or exhaust anyone's failure budget. The
      # grants live in apps/api/drizzle/*_mailfront_role_grants, and they FAIL
      # if this role does not exist yet: this must be reconciled first.
      - name: mailfront
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-mailfront-db-role

      # What apps/api and apps/worker connect as.
      #
      # ⚠ NOT THE `i10` OWNER, AND THAT IS THE WHOLE POINT. Row level security
      # does not apply to a table's owner. Every tenant policy in the `core`
      # schema is a no-op for `i10`, silently - no error, no log line, just a
      # boundary that is not there. This role owns nothing, so the policies bind
      # to it. Migrations still run as the owner, because a backfill has to be
      # able to cross tenants.
      #
      # apps/api/src/db/client.ts refuses to start if it finds itself connected
      # as an owning, superuser or BYPASSRLS role, so a mistake here is a failed
      # rollout rather than a leak.
      - name: i10_api
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-api-db-role

      # What the authoritative nameserver connects as.
      #
      # ⚠ IT IS THE ONE PROCESS HERE ANSWERING THE WHOLE INTERNET WITHOUT
      # AUTHENTICATION, so it gets the narrowest role in the cluster: grants on
      # the `pdns` schema and nothing else. No `core`, no `authd`, no mailbox,
      # no message, no API key. A parser bug in a DNS server reached over UDP
      # from anywhere must not be a route into the product's data.
      #
      # ⚠ AND IT NEEDS WRITE, NOT JUST SELECT. PowerDNS maintains
      # `domains.notified_serial` and, once DNSSEC is on, `records.ordername`
      # and `records.auth`. A read-only grant produces a server that starts,
      # answers, and then fails at whichever of those it reaches first - which
      # is a failure mode that looks like a corrupt zone. The grants themselves
      # live in apps/api/drizzle/*_pdns_role_grants/migration.sql; migration 0023
      # wrote them out in a comment and deferred them to this moment.
      - name: pdns
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: i10-pdns-db-role

      # ⚠ THE `autumn` ROLE AND ITS DATABASE ARE GONE FROM HERE BUT STILL EXIST,
      # AND THAT IS DELIBERATE. Autumn was retired; its 13 MB database is the
      # only surviving record of what it counted before the swap, and dropping
      # it is irreversible while keeping it costs a rounding error of disk. The
      # ~1.3 GiB retirement reclaimed was five pods, not this.
      #
      # ⚠ REMOVED FROM `managed.roles` RATHER THAN SET `ensure: absent`, WHICH
      # WOULD HAVE FAILED. The role OWNS the database, so Postgres refuses to
      # drop it while that database exists. Un-managing it also detaches it from
      # `i10-autumn-db-role`, a Secret that no longer syncs - CNPG reconciling a
      # managed role against a missing passwordSecret is an error loop.
      #
      # To finish the job once the data is certainly not wanted:
      #
      #   DROP DATABASE autumn;
      #   DROP ROLE autumn;

  bootstrap:
    initdb:
      database: i10
      owner: i10
