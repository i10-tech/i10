# Stalwart, with i10-authd as a sidecar.
#
# ⚠ THE SIDECAR IS THE POINT, AND IT MUST STAY A SIDECAR. authd answers
# Stalwart's LDAP binds by asking Clerk whether a password is correct. It speaks
# plaintext LDAP and will verify any password handed to it, so it binds to
# loopback only and the two containers share a network namespace precisely so
# that connection never crosses a pod boundary. There is deliberately no Service
# selecting it and no port published for it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: i10-stalwart
  namespace: i10-prod
spec:
  serviceName: i10-stalwart
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-stalwart
    spec:
      # ⚠ UID 2000, NOT 65534. The Stalwart image creates a `stalwart` user at
      # UID 2000 and owns its directories to it. Running as nobody leaves the
      # server unable to write its own data directory.
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.19-alpine
          # ⚠ THE FLAG IS NOT OPTIONAL. Without --config the server looks
          # elsewhere, finds nothing, and enters bootstrap mode — serving a setup
          # wizard instead of mail.
          args: ["--config", "/etc/stalwart/config.json"]

          # ⚠ NET_BIND_SERVICE IS REQUIRED WHILE ANY LISTENER IS BELOW 1024.
          # The image runs `setcap cap_net_bind_service=+ep` on the binary. When
          # the kernel execs a file with effective capabilities, they must also be
          # in the caller's bounding set — `drop: [ALL]` empties it and the exec
          # fails outright with "operation not permitted", before any log line.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]

          # ⚠ hostPort ON THE MAIL PORTS, DELIBERATELY BYPASSING THE SERVICE.
          #
          # A `type: LoadBalancer` Service on k3s is served by klipper-lb, and
          # its path is two DNAT hops: the host DNATs :993 into the svclb pod,
          # which DNATs again to nodeIP:<NodePort> and re-enters the host on a
          # port in the 30000-32767 range. A firewall rule naming 993 is never
          # consulted for that second leg, so the connection dies somewhere with
          # no log line on either side — the mail server never sees a packet.
          # Opening the NodePort range to the internet to fix it would be worse
          # than the problem.
          #
          # hostPort is one hop: the CNI portmap plugin DNATs :993 straight to
          # this container, port unchanged, so a `ufw route allow ... port 993`
          # matches and the packet arrives.
          #
          # ⚠ AND IT IS WHAT MAKES THE CLIENT IP REAL. klipper-lb MASQUERADEs —
          # every connection would reach Stalwart looking like it came from the
          # node. For a mail server that is not cosmetic: inbound SPF is
          # evaluated against the connecting address, and greylisting and rate
          # limits key on it. portmap only rewrites the destination.
          #
          # The cost is that these ports are claimed on whichever node runs this
          # pod, and a second replica could not schedule beside it. Stalwart is a
          # single-writer StatefulSet on a single-node cluster, so that is a
          # constraint we already have rather than one this adds.
          ports:
            - { name: smtp, containerPort: 25, hostPort: 25 }
            - { name: submissions, containerPort: 465, hostPort: 465 }
            # No hostPort: nothing is listening on 587 yet, and claiming the
            # port would answer connections with a hang instead of a refusal.
            - { name: submission, containerPort: 587 }
            - { name: imaps, containerPort: 993, hostPort: 993 }
            # Deliberately NOT exposed on the host. The management API reaches
            # the internet through Traefik, which is where its TLS and its
            # per-host gating live.
            - { name: http, containerPort: 8080 }

          envFrom:
            - secretRef: { name: i10-shared }
            - secretRef: { name: i10-stalwart }

          # The wildcard cert-manager already issues for *.i10.tech, handed to
          # Stalwart as text so a Certificate object can reference it by
          # variable name rather than carrying PEM in git.
          #
          # ⚠ ENV VARS DO NOT UPDATE IN A RUNNING POD. cert-manager rewrites this
          # Secret when it renews (2026-10-31 for the current one), and this
          # container will keep serving the old certificate until it restarts.
          # A mounted file would refresh in place, but Stalwart wants the PEM as
          # a value, not a path. So renewal REQUIRES a pod restart — today that
          # is manual, and a watcher that rolls the StatefulSet when the Secret
          # changes is the thing to add before the first renewal, not after the
          # certificate has silently expired.
          env:
            - name: STALWART_TLS_CERT
              valueFrom:
                secretKeyRef: { name: i10-tech-tls, key: tls.crt }
            - name: STALWART_TLS_KEY
              valueFrom:
                secretKeyRef: { name: i10-tech-tls, key: tls.key }

            # ⚠ READ FROM CNPG'S SECRET, NOT FROM DOPPLER. CNPG owns the
            # `stalwart` role and reconciles its password from
            # i10-stalwart-db-role. Copying that value into Doppler would give
            # one credential two sources of truth, and a rotation on either side
            # would silently break the other. config.json names this variable in
            # its authSecret.
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: i10-stalwart-db-role, key: password }

          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }

          volumeMounts:
            - { name: config, mountPath: /etc/stalwart, readOnly: true }
            - { name: data, mountPath: /var/lib/stalwart }
            # readOnlyRootFilesystem means anything written outside those two
            # paths needs a writable volume of its own.
            - { name: tmp, mountPath: /tmp }

          # ⚠ HTTP, NOT tcpSocket. A TCP probe against the mail ports reports
          # healthy for a server that is accepting connections and failing every
          # request — which is exactly what a Stalwart with an unreachable
          # DataStore looks like. These endpoints answer for the server's own
          # view of itself.
          startupProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 30

        # ── the identity bridge ──────────────────────────────────────────────
        - name: authd
          # Built from services/authd by .github/workflows/build.yml. `prod-latest`
          # matches every other i10 workload: the Build job tags prod-<sha> and
          # prod-latest only on main, so staging can never publish over it.
          image: ghcr.io/i10-tech/i10-authd:prod-597975df2d253e19f1327050211a5ce6bbac08b8@sha256:f3f7296c7dcb9997cf94714884a5783cbfbb064d30af57013d4f005aeaa31cdc

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]

          env:
            # Loopback only. authd's own config validation refuses to start on
            # anything else, so this is belt and braces rather than the guard.
            - { name: AUTHD_LISTEN, value: "127.0.0.1:3893" }
            - { name: AUTHD_BASE_DN, value: "dc=i10,dc=tech" }
            - {
                name: AUTHD_SERVICE_BIND_DN,
                value: "cn=stalwart,ou=services,dc=i10,dc=tech",
              }
            # ⚠ THE SAME VALUE STALWART READS AS STALWART_LDAP_BIND_SECRET.
            # One secret, two names, because each side names it for its own role.
            # They come from the same Doppler config so they cannot drift.
            - name: AUTHD_SERVICE_BIND_SECRET
              valueFrom:
                secretKeyRef: { name: i10-stalwart, key: STALWART_LDAP_BIND_SECRET }
            # Same single source of truth as Stalwart's own password. Kubernetes
            # expands $(VAR) from env vars declared earlier in this list, so the
            # DSN is assembled here rather than stored anywhere.
            #
            # ⚠ THE PASSWORD MUST BE URL-SAFE. It lands inside a DSN, so a `@`,
            # `/` or `:` in it silently truncates the connection string into
            # something that parses but points elsewhere. Generate it
            # alphanumeric.
            #
            # Read-only role: authd never writes. See the cluster manifest.
            - name: AUTHD_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: i10-authd-db-role, key: password }
            # ⚠ THE `i10` DATABASE, NOT `stalwart`. The projection is i10's
            # data — written by apps/api, read here — so it belongs with the
            # product, not inside the mail server's database. Stalwart is
            # pre-1.0 and migrates its own schema on upgrade; putting our tables
            # in there is the same mistake as putting its tables in ours, just
            # pointed the other way.
            - name: AUTHD_DATABASE_URL
              value: postgres://authd:$(AUTHD_DB_PASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/i10
            - name: AUTHD_CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: i10-shared, key: CLERK_SECRET_KEY }
            # Protects the shared Clerk budget (1000 req/10s across all of i10)
            # from one mail client stuck in a retry loop. NOT lockout protection —
            # the backend verify_password endpoint does not feed Clerk's counter.
            - { name: AUTHD_BINDS_PER_MINUTE, value: "30" }
            - { name: AUTHD_LOG_LEVEL, value: "info" }

          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }

          # ⚠ NO PROBES, AND THAT IS NOT AN OVERSIGHT. authd binds 127.0.0.1
          # only — the security property this whole sidecar arrangement exists
          # for. The kubelet runs probes against the POD IP, so a tcpSocket
          # probe on 3893 can never connect, and Kubernetes kills a perfectly
          # healthy process every liveness period. That is exactly what
          # happened on the first deploy: exitCode 0, reason Completed, three
          # restarts in five minutes, with "listening" in every log.
          #
          # Setting `host: 127.0.0.1` on the probe does not fix it either: the
          # kubelet resolves that against the NODE's loopback, not the pod's.
          #
          # Losing the probes costs little. authd is a sidecar with exactly one
          # consumer in the same network namespace and no Service selecting it,
          # so readiness gates nothing. If it dies the container exits and the
          # kubelet restarts it; while it is down Stalwart's binds answer
          # `unavailable` (52), which is the designed behaviour and is visible
          # in Stalwart's own logs.
          #
          # Real health checking needs authd to serve a second, health-only
          # listener on the pod IP. That is a deliberate addition, not a probe
          # stanza — see services/authd/README.md.

      volumes:
        - name: config
          configMap:
            name: i10-stalwart-config
        - name: tmp
          emptyDir: {}

  # Metadata lives in Postgres and blobs in R2, so this volume holds only what
  # the server keeps locally. It is small on purpose; growing it is not the
  # answer to a full mail store.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: psl-zfs
        resources:
          requests:
            storage: 2Gi
