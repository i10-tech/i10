# ⚠ A FIXED CLUSTER IP, BECAUSE STALWART TAKES AN ADDRESS, NOT A NAME.
# `DnsResolver` (Custom) lists servers by `ipAddress`; a resolver that needed
# DNS to find would be circular. 10.43.53.53 is inside k3s's service range, and
# is named again in plan.ndjson.
apiVersion: v1
kind: Service
metadata:
  name: i10-stalwart-unbound
  namespace: i10-prod
spec:
  clusterIP: 10.43.53.53
  selector:
    app.kubernetes.io/name: i10-stalwart-unbound
  ports:
    - { name: dns-udp, protocol: UDP, port: 53, targetPort: 5353 }
    - { name: dns-tcp, protocol: TCP, port: 53, targetPort: 5353 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-stalwart-unbound
  namespace: i10-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-stalwart-unbound
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-stalwart-unbound
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # The DNSSEC root anchor must be writable (RFC 5011 rollover), so it is
      # fetched into an emptyDir first.
      #
      # ⚠ THE IMAGE SHIPS NO root.key. Its own entrypoint creates one at start,
      # and we bypass that entrypoint, so the anchor is fetched here with
      # unbound-anchor. It exits 1 when it wrote a new file, which is the normal
      # first-run case, so the check is that the file exists, not the exit code.
      initContainers:
        - name: anchor
          image: mvance/unbound:1.22.0
          command:
            - sh
            - -c
            - /opt/unbound/sbin/unbound-anchor -a /var/lib/unbound/root.key; test -s /var/lib/unbound/root.key
          volumeMounts:
            - { name: var, mountPath: /var/lib/unbound }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: unbound
          image: mvance/unbound:1.22.0
          # The image's own entrypoint writes a config that FORWARDS to
          # Cloudflare over TLS, which is exactly what must not happen here.
          command:
            ["/opt/unbound/sbin/unbound", "-d", "-c", "/etc/unbound/unbound.conf"]
          ports:
            - { name: dns-udp, containerPort: 5353, protocol: UDP }
            - { name: dns-tcp, containerPort: 5353, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket: { port: 5353 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5353 }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/unbound, readOnly: true }
            - { name: var, mountPath: /var/lib/unbound }
      volumes:
        - name: config
          configMap: { name: i10-stalwart-unbound }
        - name: var
          emptyDir: {}
