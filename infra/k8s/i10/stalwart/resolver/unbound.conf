# Stalwart's recursive resolver. Recursion from the root, never forwarding to a
# public resolver (blocklists refuse those, see kustomization.yaml).
#
# ⚠ cluster.local AND 10.in-addr.arpa GO TO CoreDNS. Nothing in Stalwart's MTA
# path needs a cluster name today, but a route or hook pointed at a Service
# would otherwise get NXDOMAIN from the root. They are marked insecure because
# CoreDNS does not sign them.
#
# IPv6 is off: the node has no working IPv6 egress for DNS.
server:
  interface: 0.0.0.0
  port: 5353
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  access-control: 0.0.0.0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: 10.42.0.0/16 allow
  username: ""
  chroot: ""
  directory: "/opt/unbound/etc/unbound"
  pidfile: ""
  use-syslog: no
  logfile: ""
  verbosity: 1
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  module-config: "validator iterator"
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
  prefetch: yes
  msg-cache-size: 16m
  rrset-cache-size: 32m
  num-threads: 1
  so-reuseport: yes
  domain-insecure: "cluster.local"
  domain-insecure: "10.in-addr.arpa"
  private-domain: "cluster.local"
  local-zone: "10.in-addr.arpa." nodefault
forward-zone:
  name: "cluster.local"
  forward-addr: 10.43.0.10
forward-zone:
  name: "10.in-addr.arpa"
  forward-addr: 10.43.0.10
