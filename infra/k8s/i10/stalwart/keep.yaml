# Stalwart Keep: the in-memory store and the cluster coordinator of the two
# Stalwart nodes (#358), and the only one they have; it replaced
# i10-stalwart-redis on 2026-11-15 (#452). Keep is Stalwart's own server for
# locks, counters and cluster events: https://stalw.art/docs/cluster/keep/.
#
# ⚠ ONE SERVER, ON PURPOSE. psl-vps is a single Kubernetes node, so a three-member
# cluster would lose every member together and buy nothing for it, while costing
# a fixed member list of IP literals (hostNetwork and pinned pods), a peer port
# that Kubernetes cannot firewall, and a second secret. A single server is a
# supported deployment, and it is why keep.toml has no `members`.
#
# ⚠ EVERY RESTART OF THIS POD COSTS ABOUT TEN MINUTES OF LOCKS. A server started
# in the default `rejoin` mode refuses NEW locks for the lock quarantine, 604 s
# for a single server, because a client may still hold a lock the empty server
# has forgotten. Outbound delivery, scheduled tasks and search indexing all take
# locks, so they stall for that long. Nothing is lost: mail is still received,
# JMAP and IMAP still answer, and queued mail is delivered when the quarantine
# ends. Locks held at the moment of the restart do NOT keep working: a restarted
# server comes back empty, so a renewal or release of a lost lock is answered
# `NotFound` and its holder learns that at its next renewal; the quarantine is
# what stops a second holder taking it meanwhile. `Ready` below means
# "listening", not "locks available", so a green pod does not end the stall.
#
# The things that restart it, and so must not be done casually: a new image, an
# edit to config/keep.toml (the ConfigMap name carries a hash, so this rolls the
# pod), a changed resource request or limit, and the node rebooting.
#
# ⚠ `--start bootstrap` MUST NEVER BE ADDED TO THIS TEMPLATE. It skips the
# quarantine, which is correct only when no client can hold a lock: the first
# start ever, or a restart together with every Stalwart node. In a template it
# would fire on every restart, including a Keep-only crash while Stalwart keeps
# running, and two nodes could then be granted the same queue lock and deliver
# one message twice. The first start therefore waits out the quarantine, which is
# harmless because nothing holds a lock yet (config/README.md, "Keep").
#
# ⚠ NOT i10-redis, AND NOT A REDIS. i10-redis holds the send and webhook queues
# with `noeviction`; Keep evicts counters under its memory cap, which is right
# for rate limits and wrong for a queue. Keep also speaks its own protocol, not
# RESP, so nothing here is reachable by a Redis client. The repo rule is still
# one instance per eviction policy (see ../redis/redis.yaml).
#
# ⚠ ONE CPU, AND THE LIMIT IS WHAT SETS THE SHARD COUNT. Keep runs one shard per
# CPU of its budget, the smaller of the cpuset and the cgroup `cpu.max` quota,
# never the node's four. More shards than quota are throttled every period
# (measured by the authors at p99 above 70 ms). A limit of "1" gives one shard,
# checked by running the image under `--cpus 1`. Changing it changes the shard
# count, and in a single server that is just a restart (see above).
#
# ⚠ THE MEMORY CAP IS BELOW THE LIMIT. keep.toml caps Keep at 128 MiB inside a
# 256 MiB container. The cap counts values and the key table but not connection
# buffers, and RSS reaches 1.29 times the footprint with tiny values, so half the
# limit is the margin. At the cap Keep evicts counters (a rate limit restarts from
# zero) and never a lock; past the limit the kernel kills it and every key goes.
#
# ⚠ config/keep.toml HAS NO COMMENTS, BECAUSE THE GENERATED CONFIGMAP NAME CARRIES
# A HASH OF THE FILE: a typo fixed in a comment would roll this pod and cost the
# ten minutes above. Its notes live here. It is a single server, so it has no
# `members`, `node`, `peer-secret-file` or `tls-servers` (Keep refuses the
# settings a mode does not use), and `max-lock-ttl` and `max-value` keep their
# defaults, which are the minimums Stalwart needs (600 s, 512 KiB plus a header).
# `stats-interval` prints one line a minute on stderr, the only way to see Keep
# from outside, because it has no metrics endpoint.
#
# ⚠ RECREATE, NOT ROLLING. Two servers side by side would be two lock tables, and
# each Stalwart node pins to the one it connected to when it opened the store.
#
# ⚠ SYNC WAVE -1, SO KEEP IS HEALTHY BEFORE ANY STALWART POD ROLLS. The Stalwart
# pods reference the Secret i10-stalwart-keep, which the Doppler operator makes
# from a DopplerSecret in another Argo app (i10-doppler-secrets). A StatefulSet
# rolls by deleting the old pod first, so a missing Secret would take mail down.
# Keep mounts the same Secret and is not Ready without it, so waiting for Keep
# waits for the Secret, and a missing Doppler value or a key Keep cannot parse
# stops the sync here, with the old Stalwart pods still running. The ConfigMap is
# in the wave too, or Keep could never start. That is the safety net, not the
# plan: the Doppler values are created before the merge.
#
# ⚠ THE KEYS COME FROM DOPPLER, AND KEEP TAKES THREE OF THE FIVE. The Secret is
# `i10-stalwart-keep` (Doppler config prod_stalwart_keep, see
# doppler/dopplersecrets.yaml), projected as files. Keep gets the cluster secret,
# its own private key and the list of node public keys; the node's private key is
# not projected into this pod. It takes no `envFrom` either: Keep reads any
# variable named KEEP_<flag>, and the Doppler key names begin with KEEP_.
#
# ⚠ NOT `part-of: i10-stalwart`, AND NOT `name: i10-stalwart`. The first is what
# the i10-stalwart Service selects and what bootstrap.sh restarts; the second is
# what allow-public-mail admits from the internet. This pod is neither a node
# nor reachable from outside.
---
apiVersion: v1
kind: Service
metadata:
  name: i10-stalwart-keep
  namespace: i10-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: i10-stalwart-keep
  # ⚠ ONE FAMILY, SO THE NAME RESOLVES TO THE ADDRESS KEEP LISTENS ON. keep.toml
  # binds 0.0.0.0, and the Stalwart nodes dial this name, which they resolve once
  # when the store opens. The ClusterIP is stable for the life of the Service, so
  # a Keep restart needs no node restart; deleting and recreating the Service
  # would, because the nodes keep the old address.
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  ports:
    - name: keep
      port: 7000
      targetPort: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-stalwart-keep
  namespace: i10-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-stalwart-keep
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-stalwart-keep
    spec:
      # ⚠ AT LEAST 16, OR THE HANDOFF IS CUT SHORT. On SIGTERM Keep freezes its
      # shards for up to 1 s and then hands its keys over for up to 11 s. A single
      # server has nobody to hand them to and stops in about a second (checked),
      # so this is margin, kept because Keep's own manifest requires 16.
      terminationGracePeriodSeconds: 20
      enableServiceLinks: false
      automountServiceAccountToken: false
      # ⚠ UID 2000 IS THE KEEP IMAGE'S OWN `keep` USER, which owns /run/keep.
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keep
          # ⚠ THE INDEX DIGEST, BECAUSE A TAG IS A MOVING TARGET. Keep 1.0.1 is
          # the version the Stalwart 1.1.0 docs were written against.
          image: stalwartlabs/keep:v1.0.1@sha256:380c3c548635d1c18fb0107d969e2e40c25a23112764b08493fc14b1471f29c6
          # ⚠ THE READY-FILE OUTLIVES THE PROCESS. Keep creates it when it listens
          # and never removes it, and an emptyDir survives a container restart
          # inside the same pod, so a restarted Keep would be Ready before it
          # listened. Deleting it first makes the probe mean what it says.
          command:
            - /bin/sh
            - -c
            - rm -f /run/keep/settled && exec keep --config /etc/keep/keep.toml
          ports:
            - { name: keep, containerPort: 7000 }
          # Checked by running the image with exactly these constraints (non-root
          # user, read-only root, no capabilities, no new privileges, one CPU):
          # it listens and creates the ready-file. Port 7000 needs no
          # NET_BIND_SERVICE, unlike Stalwart's.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # ⚠ REQUESTS EQUAL LIMITS, SO THIS POD IS THE LAST TO BE KILLED. Keep is
          # the pod whose death costs the most (every kill is the ten minute lock
          # stall above), and the Keep docs recommend Guaranteed QoS. A Guaranteed
          # container gets an oom_score_adj of -997, so the kernel's OOM killer
          # picks it last, and under node pressure the kubelet evicts a pod using
          # less than it requests only after every pod that uses more. A
          # Burstable pod with a small request scores near 1000 and goes first.
          #
          # The cost is a whole CPU reserved for scheduling though Keep idles at
          # about 10m. The node had about 1.8 of its 4 CPUs requested, so it fits.
          # The limits are unchanged on purpose (the CPU limit sets the shard
          # count, and the 128 MiB cap against 256 MiB is the margin above).
          # Changing the requests restarts this pod, so merging this costs one
          # lock quarantine.
          resources:
            requests: { cpu: "1", memory: 256Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/keep, readOnly: true }
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: run, mountPath: /run/keep }
          readinessProbe:
            exec: { command: ["test", "-e", "/run/keep/settled"] }
            periodSeconds: 5
          # ⚠ LENIENT, BECAUSE A RESTART IS NOT FREE. A liveness kill costs the ten
          # minute quarantine above, so this waits a full minute of refused
          # connections before it acts. It is a bare connect with no handshake,
          # which Keep closes on its own after ten seconds.
          livenessProbe:
            tcpSocket: { port: keep }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: i10-stalwart-keep-config
        - name: secrets
          secret:
            secretName: i10-stalwart-keep
            defaultMode: 0440
            items:
              - { key: KEEP_CLUSTER_SECRET, path: cluster.secret }
              - { key: KEEP_MEMBER_KEY, path: keep.key }
              - { key: KEEP_CLIENTS_PEM, path: clients.pem }
        - name: run
          emptyDir: { medium: Memory }
