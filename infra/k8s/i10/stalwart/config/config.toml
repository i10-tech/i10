# Stalwart — i10's mail engine.
#
# ⚠ THIS FILE IS A STARTING POINT, NOT A FINISHED CONFIGURATION. Stalwart is
# pre-1.0 (v0.16.x) and its maintainers describe the schema as still being
# finalized. Every key below must be checked against the reference for THE
# PINNED VERSION before first boot, and every upgrade needs its migration note
# read rather than skimmed. For irreplaceable data that is live risk, which is
# also why the deployment pins a version one release behind latest.
#
# Reference: https://stalw.art/docs/
#
# THE DECISIONS THIS FILE HAS TO ENCODE, in the order they matter:
#
#   1. RELAY THROUGH SES, do not deliver to the internet directly. Stalwart is
#      a complete MTA and could — but what SES sells is IP reputation that
#      already exists, which is the one asset a new sender cannot build cold.
#      Hetzner also blocks outbound port 25 by default. Revisit at BYOIP scale.
#
#   2. SIGN DKIM BEFORE RELAYING. SES Easy DKIM hands customers three CNAMEs
#      pointing at dkim.amazonses.com. Signing here means the customer's record
#      is a plain TXT public key we rotate on our own schedule. This is the one
#      place Resend white-labels too, it costs nothing, and it is what makes
#      the DKIM-only quick start possible at all.
#
#   3. THE REGION IS eu-central-1, CHOSEN ONCE. The bounce MX every customer
#      publishes points at feedback-smtp.<region>.amazonses.com. SES
#      re-verifies it continuously and RFC 2181 forbids an MX target that is a
#      CNAME, so it cannot hide behind an i10 hostname. Changing region means
#      every customer edits DNS.
#
#   4. LOCAL DELIVERY NEVER LEAVES. Mail between two i10 mailboxes is routed on
#      local domains and never touches the network — no SMTP hop, no SES, no
#      cost. A message with mixed recipients splits, so "messages sent" and
#      "SES messages billed" are different counters and must be counted
#      separately from the start.
#
#   5. TRANSACTIONAL MAIL DOES NOT COME THROUGH HERE. The only ways in are SMTP
#      submission and JMAP, both message-shaped rather than API-shaped: no
#      synchronous message id, no per-send tenant or configuration-set
#      parameters, and a password reset coupled to the mail store's uptime. The
#      queues want opposite behaviour too — an MTA retries for days, a reset
#      should fail in seconds. apps/api owns that path.

[server]
hostname = "mx.i10.tech"

# Ports. 25 is inbound MTA-to-MTA; 465/587 are submission; 993 is IMAPS; 8080
# carries JMAP and the web admin behind Traefik.
[server.listener.smtp]
bind = ["[::]:25"]
protocol = "smtp"

[server.listener.submission]
bind = ["[::]:587"]
protocol = "smtp"

[server.listener.submissions]
bind = ["[::]:465"]
protocol = "smtp"
tls.implicit = true

[server.listener.imaptls]
bind = ["[::]:993"]
protocol = "imap"
tls.implicit = true

[server.listener.http]
bind = ["[::]:8080"]
protocol = "http"

# ⚠ BIND ON [::] AND NOT 0.0.0.0. The k3s cluster was rebuilt dual-stack on
# 2026-08-31 specifically so this host can publish an AAAA record: mail systems
# increasingly prefer IPv6 and score its reputation separately from IPv4. A
# v4-only bind behind an AAAA record resolves and then times out for
# v6-preferring senders only, which is the worst possible failure shape.

# ── The rest is deliberately unwritten ──────────────────────────────────────
#
# store.*        Postgres (i10-platform-pooler) for metadata, R2 for blobs.
#                Credentials come from the `i10-stalwart` Doppler config, never
#                from this file.
# queue.outbound The SES smarthost relay, with credentials from the same place.
# signature.*    BYODKIM keys, one selector per sending domain, ours to rotate.
# directory.*    Where mailboxes and tenants come from.
#
# These are left empty rather than guessed. A plausible-looking config for the
# wrong schema version boots into a mail server that accepts messages and
# quietly does the wrong thing with them, which is far worse than one that
# refuses to start.
