# Two Services, because the traffic has two shapes.
#
# HTTP (JMAP + web admin) goes through Traefik like everything else. SMTP and
# IMAP do not: Cloudflare's proxy carries only HTTP/HTTPS, so nothing on
# 25/465/587/993 can pass through it.
#
# ⚠ THIS NEEDS A CHANGE IN THE PSL REPO BEFORE IT WORKS. Traefik must gain TCP
# entrypoints for these ports, and the Traefik chart nests the Service spec
# under `service.spec` — keys placed directly on `service` are accepted and
# then SILENTLY IGNORED. That is how a dual-stack rebuild left the Service
# IPv4-only while every value looked correct. Set `ipFamilyPolicy` under
# `service.spec` and verify with `kubectl get svc -o yaml`, not by reading values.
#
# ⚠ AND A DNS CONSEQUENCE. mx.i10.tech must be a GREY-CLOUD (DNS-only) A *and*
# AAAA record pointing straight at the box, with the MX pointing at that name.
# Grey-clouding publishes the origin IP — unavoidable for mail, and worth
# knowing: the box stops being hidden the day i10's MX goes live.
---
apiVersion: v1
kind: Service
metadata:
  name: i10-stalwart
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-stalwart
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: i10-stalwart-mail
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-stalwart
  # ⚠ A LoadBalancer, NOT AN IngressRouteTCP THROUGH TRAEFIK. Two reasons, and
  # the second is the one that matters.
  #
  # Traefik on this cluster has exactly two entrypoints, `web:80` and
  # `websecure:443`. Mail ports would need new ones, which means editing
  # Traefik's args, container ports and its own LoadBalancer Service — and
  # Traefik is an Argo Application owned by the platform, outside the `i10-*`
  # destinations this repo's AppProject may write to. Every mail port would be a
  # commit to the PSL repository.
  #
  # And mail is not HTTP. Putting an HTTP-first reverse proxy in front of SMTP
  # and IMAP buys no routing — there is nothing to route, one backend answers
  # every connection — while costing TLS passthrough config and Proxy Protocol
  # v2 purely to recover the client IP that the proxy discarded. Exposing the
  # Service directly removes the proxy and the problem together.
  type: LoadBalancer

  # ⚠ `Local`, AND IT IS NOT A PERFORMANCE SETTING. With the default `Cluster`,
  # kube-proxy SNATs the source address and every connection appears to arrive
  # from a node. For a mail server that is not a metrics inconvenience, it is
  # broken behaviour: inbound SPF is evaluated against the connecting IP,
  # greylisting and rate limits key on it, and every sender would look like one
  # client. `Local` keeps the real address.
  #
  # ⚠ VERIFY THIS RATHER THAN TRUST IT. k3s ServiceLB reaches the Service
  # through a klipper-lb pod, and whether the client address survives that hop
  # depends on the DNAT path. Check an inbound connection's logged remote
  # address before believing SPF works.
  externalTrafficPolicy: Local

  # Both families. The cluster was rebuilt dual-stack on 2026-08-31 precisely
  # so mail can answer on IPv6 — receivers increasingly prefer it and score its
  # reputation separately from IPv4.
  ipFamilyPolicy: PreferDualStack
  ports:
    - { name: smtp, port: 25, targetPort: smtp }
    - { name: submissions, port: 465, targetPort: submissions }
    - { name: submission, port: 587, targetPort: submission }
    - { name: imaps, port: 993, targetPort: imaps }
