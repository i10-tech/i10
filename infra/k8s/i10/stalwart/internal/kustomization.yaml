apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The second Stalwart node (#358): the same pod as ../node, serving JMAP and the
# web endpoints on 8080 and nothing else.
#
# ⚠ NO hostPorts, BECAUSE psl-vps IS ONE NODE. 25, 465 and 993 are claimed on
# the host by the edge pod, and a second claim on the same node leaves this pod
# Pending forever. So this node takes the load that does not need a public port:
# our API's and the webmail's JMAP, through the `i10-stalwart` Service.
#
# ⚠ AND THE ROLE IS WHAT KEEPS IT FROM DOING EVERYTHING. A node with no
# STALWART_ROLE opens every listener and runs every task, including the
# scheduler and spam training, which must run on one node only. The `internal`
# ClusterRole (plan.ndjson) enables the http listener, outbound delivery and
# push notifications. A role named here that does not exist yet makes the node
# log `Cluster role "internal" not found` and run everything - hence replicas.
resources:
  - ../node

nameSuffix: -internal

patches:
  - target:
      kind: StatefulSet
      name: i10-stalwart
    patch: |-
      # ⚠ ONE, AND ONLY AFTER THE PLAN HAS RUN. Started before bootstrap.sh has
      # applied the shared in-memory store, the coordinator and the `internal`
      # role, this node would share the data store with the edge node and no
      # coordinator, and would run every task. It shipped at 0 (#363) and was
      # raised once the plan was live (2026-11-06). On a rebuild, start at 0
      # again.
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: i10-stalwart-internal
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: i10-stalwart-internal
      # The whole list, not the hostPorts alone: only `http` is served here, and
      # the probes name it.
      - op: replace
        path: /spec/template/spec/containers/0/ports
        value:
          - { name: http, containerPort: 8080 }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: STALWART_ROLE, value: internal }
      # ⚠ NO MAIL FRONT HERE. This node serves no 993 or 465 (its role enables
      # the http listener only), so a front would have nothing to front and no
      # hostPort to bind. The test below makes the patch fail, rather than
      # remove another container, if the order in ../node ever changes.
      - op: test
        path: /spec/template/spec/containers/2/name
        value: mailfront
      - op: remove
        path: /spec/template/spec/containers/2
      # ⚠ AND NO DEVICE CA TRUST BUNDLE (#383 PR 3). Only the front reads it,
      # so the node without a front has no reason to mount it. The test fails
      # the patch, rather than remove another volume, if ../node's order changes.
      - op: test
        path: /spec/template/spec/volumes/4/name
        value: device-ca-trust
      - op: remove
        path: /spec/template/spec/volumes/4
