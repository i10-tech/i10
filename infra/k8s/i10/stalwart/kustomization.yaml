apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: i10-prod

resources:
  - database.yaml
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
  - cert-reload.yaml
  - ingressroute.yaml

# The generated name carries a content hash, so editing either file rolls the
# pods. A plain ConfigMap would update in place and leave Stalwart running the
# old configuration until something happened to restart it — the class of bug
# where the fix is deployed and the symptom persists.
#
# ⚠ ROLLING THE POD IS NOT THE SAME AS APPLYING THE PLAN. config.json takes
# effect on restart; plan.ndjson does nothing until `stalwart-cli apply` runs
# against the server, and the objects in it need `Action/ReloadSettings` after
# that. The ConfigMap carries the plan into the pod so it can be applied there;
# it does not apply it. See config/README.md.
configMapGenerator:
  - name: i10-stalwart-config
    files:
      - config/config.json
      - config/plan.ndjson
