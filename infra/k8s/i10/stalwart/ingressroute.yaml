# Mail-client provisioning over HTTPS.
#
# Nobody should type a port number into a mail client. Between them these
# routes mean a user enters an address and a password and nothing else:
#
#   autoconfig.i10.tech     Thunderbird-style XML, generated by Stalwart
#   autodiscover.i10.tech   Outlook's POST endpoint, generated by Stalwart
#   i10.tech/.well-known    the same XML, for clients that probe the apex first
#   autoconfig/apple.…      an Apple configuration profile, generated by the API
#   mta-sts.i10.tech        the MTA-STS policy senders fetch before delivering
#
# ⚠ EVERY ROUTE IS PATH-SCOPED, AND THAT IS THE POINT. Stalwart serves its
# administration interface, JMAP and DAV out of the same listener as these
# endpoints, so `Host(...)` alone would publish the admin login on four new
# hostnames. It would also publish JMAP and DAV, which is worse than it sounds:
# a service reachable but unannounced is one nobody is monitoring.
#
# ⚠ AND THE PORT IS 8080, NOT 443. Stalwart listens on both, but 443 on this
# host belongs to Traefik. Traefik terminates TLS with the wildcard and speaks
# plain HTTP to the pod, which is why these routes need no certificate of their
# own and are unaffected by the certificate-reload dance in cert-reload.yaml.
---
# Serves the profile at `https://autoconfig.i10.tech/apple.mobileconfig` while
# the API keeps it mounted under `/autoconfig`, where it sits beside the rest of
# that app's non-public surface. Rewriting here rather than moving the route
# there keeps the API's own paths grouped by what they are.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-mobileconfig-prefix
  namespace: i10-prod
spec:
  addPrefix:
    prefix: /autoconfig
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-mail-provisioning
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    # ⚠ EXPLICIT PRIORITIES, because the default is the LENGTH of the rule
    # string. Route 3 below has to beat `Host(`i10.tech`) || Host(`www.i10.tech`)`
    # in web.yaml, and "our rule happens to be longer" is not a property anyone
    # will preserve while editing an unrelated file.

    # 1 — the Apple configuration profile, from the API.
    - match: Host(`autoconfig.i10.tech`) && Path(`/apple.mobileconfig`)
      kind: Rule
      priority: 100
      middlewares:
        - name: i10-mobileconfig-prefix
      services:
        - name: i10-api
          port: 80

    # 2 — everything Stalwart generates itself.
    #
    # PathRegexp with `(?i)` for autodiscover is not defensive programming:
    # Outlook probes `/autodiscover/`, `/Autodiscover/` and `/AutoDiscover/`,
    # and Traefik's PathPrefix is case-sensitive. Stalwart answers all three
    # (verified against the running server), so the only thing that would drop
    # them is this rule.
    - match: >-
        (Host(`autoconfig.i10.tech`) || Host(`autodiscover.i10.tech`) || Host(`mail.i10.tech`))
        && (PathPrefix(`/mail/config-v1.1.xml`) || PathPrefix(`/.well-known/autoconfig`)
        || PathRegexp(`^(?i)/autodiscover/`))
      kind: Rule
      priority: 90
      services:
        - name: i10-stalwart
          port: 8080

    # 3 — the apex fallback. Thunderbird and several others try
    # `https://<domain>/.well-known/autoconfig/...` before, or instead of, the
    # autoconfig subdomain. i10.tech is the marketing site; this carves out one
    # prefix from it.
    - match: Host(`i10.tech`) && PathPrefix(`/.well-known/autoconfig`)
      kind: Rule
      priority: 100
      services:
        - name: i10-stalwart
          port: 8080

    # 4 — MTA-STS. A sending server fetches this over HTTPS and will not trust
    # it any other way: the policy's whole security value is that it arrived
    # under a certificate for `mta-sts.<domain>`.
    #
    # Stalwart currently publishes `mode: testing`, which reports failures and
    # delivers anyway. Nothing here changes that, and nothing enforces until the
    # `_mta-sts` TXT record exists in DNS.
    - match: Host(`mta-sts.i10.tech`) && Path(`/.well-known/mta-sts.txt`)
      kind: Rule
      services:
        - name: i10-stalwart
          port: 8080

  tls:
    secretName: i10-tech-tls
