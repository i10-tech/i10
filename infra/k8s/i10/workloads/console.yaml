---
apiVersion: v1
kind: Service
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-console
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-console
    spec:
      containers:
        - name: console
          # ⚠ THE TAG IS UPDATED BY A COMMIT, NOT BY A DEPLOY COMMAND. That is
          # what GitOps means here: the Build workflow publishes an image and
          # writes its digest into this file, so `git log infra/` is the
          # deployment history and a rollback is a revert.
          #
          # ⚠ THE `prod-latest` BELOW IS A BOOTSTRAP VALUE AND SHOULD NOT
          # SURVIVE. The Build workflow's deploy job rewrites this line to
          # `:prod-<sha>@sha256:<digest>` for every app it actually rebuilt. An
          # app still reading `prod-latest` long after its first build means
          # either it has never changed since this line was written, or its
          # path filter in build.yml does not match where its sources live.
          image: ghcr.io/i10-tech/i10-console:prod-18f42d584c46b55c0fd0a1734a696bf2985e869e@sha256:24076339132b998809a19f222186707cec5d70357779638d76a8df9fdc97c6f4
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          # ⚠ PIN THE BIND ADDRESS. KUBERNETES SETS `HOSTNAME` TO THE POD NAME,
          # AND NEXT'S STANDALONE server.js USES IT AS THE ADDRESS TO LISTEN ON.
          #
          # Left alone, the server resolves that pod name and binds to whatever
          # comes back. Under Node that was the pod's IPv4; under bun it is the
          # IPv6 address, so the container listened on tcp6 ONLY — `/proc/net/tcp`
          # was empty — while kubelet dialled the pod's IPv4 and got
          # `connection refused`. The pod logs "Ready in 0ms" and looks perfectly
          # healthy, the readiness probe never passes, liveness then restarts it,
          # and the Deployment sits Degraded forever with the previous ReplicaSet
          # still serving. Nothing in the application log says a word about it.
          #
          # `0.0.0.0` makes the bind explicit and runtime-independent. It must be
          # set HERE rather than in the Dockerfile: the kubelet injects HOSTNAME
          # at container start, which overrides any `ENV` baked into the image,
          # and only an explicit `env:` entry wins against it.
          #
          # ⚠ DO NOT COPY THIS TO worker.yaml. There HOSTNAME is read for the
          # claim identity (see turbo.json's passThrough list), and pinning it
          # would give every replica the same name.
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            # ⚠ WITHOUT THIS THE CONSOLE RENDERS AN ERROR PAGE ON EVERY ROUTE,
            # and it did. `lib/api.ts` falls back to `http://localhost:3001`
            # when it is unset — correct for a developer running the API beside
            # the console, and in a pod it means "talk to myself on a port
            # nothing listens on". Every server component then fails with bun's
            # `Unable to connect. Is the computer able to access the url?`,
            # which surfaces in the browser as a minified React error and the
            # console's own "could not load" boundary. Nothing about that names
            # the missing variable.
            #
            # ⚠ IT IS HERE RATHER THAN IN DOPPLER BECAUSE IT IS NOT A SECRET. It
            # is the in-cluster address of a Service defined a few files away,
            # and a value in git next to the thing it names is one somebody can
            # review. The code comment used to claim Doppler supplied it; it
            # never did, which is exactly how this reached production.
            #
            # ⚠ AND IT IS THE CLUSTER ADDRESS, NOT `https://api.i10.tech`. The
            # public name resolves out through the ingress and back in, so every
            # server-side render would leave the cluster, pay TLS, and depend on
            # public DNS being healthy to draw a page for somebody already
            # inside it.
            - name: API_BASE_URL
              value: "http://i10-api.i10-prod.svc.cluster.local"
            # ⚠ THE SAME TARGET UNDER THE SDK'S NAME, FOR ONE ROUTE.
            # `app/api/checkout-status/[checkoutId]/route.ts` proxies the
            # post-checkout poll and reads `I10_BASE_URL` — the variable
            # `@i10/next` publishes for customers pointing the SDK elsewhere. It
            # defaults to `https://api.i10.tech`, so unset it WORKS, which is
            # why this was not the outage; it just sends an internal request out
            # to the internet and back on the one page somebody lands on after
            # paying.
            - name: I10_BASE_URL
              value: "http://i10-api.i10-prod.svc.cluster.local"
          envFrom:
            - secretRef: { name: i10-shared }
            - secretRef: { name: i10-console }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric, matching the Dockerfile's USER — see api.yaml.
            runAsUser: 1001
            runAsGroup: 1001
            capabilities: { drop: ["ALL"] }
          # ⚠ `/healthz`, NOT `/`. Every console page now requires a Clerk
          # session, so `/` answers a 307 to accounts.i10.tech for a signed-out
          # caller — which kubelet scores as healthy, making the probe pass for
          # a reason unrelated to the pod. Worse, if Clerk is unreachable and
          # the middleware raises rather than redirecting, `/` turns 5xx and
          # liveness restarts every replica during somebody else's outage. See
          # apps/console/app/healthz/route.ts.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`dash.i10.tech`)
      kind: Rule
      services:
        - name: i10-console
          port: 80
  tls:
    secretName: i10-tech-tls
