---
apiVersion: v1
kind: Service
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-console
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-console
    spec:
      containers:
        - name: console
          # ⚠ THE TAG IS UPDATED BY A COMMIT, NOT BY A DEPLOY COMMAND. That is
          # what GitOps means here: the Build workflow publishes an image and
          # writes its digest into this file, so `git log infra/` is the
          # deployment history and a rollback is a revert.
          #
          # ⚠ THE `prod-latest` BELOW IS A BOOTSTRAP VALUE AND SHOULD NOT
          # SURVIVE. The Build workflow's deploy job rewrites this line to
          # `:prod-<sha>@sha256:<digest>` for every app it actually rebuilt. An
          # app still reading `prod-latest` long after its first build means
          # either it has never changed since this line was written, or its
          # path filter in build.yml does not match where its sources live.
          image: ghcr.io/i10-tech/i10-console:prod-e8a8fdcf0a89865140f9879e0cf1c715c4499f97@sha256:5850d237f77b3de5f5010ce53024cac72607ff68aa44e32fc20d535f9baa986b
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - secretRef: { name: i10-shared }
            - secretRef: { name: i10-console }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric, matching the Dockerfile's USER — see api.yaml.
            runAsUser: 1001
            runAsGroup: 1001
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`dash.i10.tech`)
      kind: Rule
      services:
        - name: i10-console
          port: 80
  tls:
    secretName: i10-tech-tls
