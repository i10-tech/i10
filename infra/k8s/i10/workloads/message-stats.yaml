# Refreshes the console overview's daily rollup, `core.message_daily_stats`
# (#507).
#
# ⚠ THE SAME IMAGE AND ANOTHER COMMAND. `bun dist/message-stats.js` calls
# `core.refresh_message_daily_stats()` once and exits. Why the rollup exists and
# why a rerun is harmless: the header of apps/api/src/message-stats.ts.
#
# ⚠ A STOPPED JOB SLOWS THE OVERVIEW, IT DOES NOT BREAK IT. Every day since the
# last refresh is counted from the events instead.
#
# ⚠ THE FIRST RUNS AFTER THE MERGE FAIL, AND THAT IS EXPECTED. This manifest
# lands pinned to the previous image, which has no dist/message-stats.js, until
# the post-merge pin commit rewrites it (.github/scripts/pin-image.py). That is
# one or two failed runs and no data lost: the next run on the new image
# catches up on everything since.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: i10-message-stats
  namespace: i10-prod
spec:
  # Every fifteen minutes: an event that arrives late for an earlier day shows
  # in the chart within about that. Today is always counted live.
  #
  # ⚠ THIS STRING IS ALSO IN apps/api/src/message-stats.ts, AND THEY MUST AGREE.
  schedule: "*/15 * * * *"
  # Two at once would only wait on each other (the function takes an advisory
  # lock), but there is no reason to start a second.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      # Under the interval, so `Forbid` cannot turn one hung pod into a refresh
      # that never runs again.
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: i10-api
        spec:
          restartPolicy: Never
          containers:
            - name: message-stats
              image: ghcr.io/i10-tech/i10-api:prod-c4f21bf4c598738ae03eee04be23e26f61fac6db@sha256:e589885a880c1864a4d21445424bd44239457cba726109607b837269607e9f86
              imagePullPolicy: Always
              command: ["bun", "dist/message-stats.js"]
              envFrom:
                - secretRef: { name: i10-shared }
                - secretRef: { name: i10-api }
              env:
                # Opens the wrapped keys in i10-api (apps/api/src/crypto/unlock.ts). A
                # hand-made Secret, never in Doppler; optional, so plain keys still start.
                - name: KEY_WRAP_KEYS
                  valueFrom:
                    secretKeyRef:
                      name: i10-key-wrap
                      key: KEY_WRAP_KEYS
                      optional: true
                # ⚠ `i10_api`, NOT THE OWNER, like every other job. The refresh is
                # a SECURITY DEFINER function granted to `i10_api` and nothing else.
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: i10-api-db-role, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: i10-api-db-role, key: password }
                - name: DATABASE_URL
                  value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/i10
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 320Mi }
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                capabilities: { drop: ["ALL"] }
