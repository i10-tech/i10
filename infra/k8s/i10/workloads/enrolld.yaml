# enrolld: Apple's over-the-air enrollment for mail device codes (#383 PR 4,
# services/authd/README.md, "Enrollment service", and
# docs/research/mail-device-binding.md section 12).
#
# ⚠ ITS OWN POD, NEVER INSIDE authd OR THE API. It parses untrusted CMS and XML
# from the internet, so it holds nothing worth taking:
#
#   - no database credential and no device-code key: the API mints, builds and
#     seals the profile, and enrolld only relays the sealed bytes;
#   - one secret, its bearer token for the API's `/enrolld/*`, from one named
#     key (the API holds only the token's SHA-256, ENROLLD_TOKEN_HASHES);
#   - public certificates only otherwise: the hooks transport CA and the device
#     CA trust bundle;
#   - egress to the API's 3443 and cluster DNS, and nowhere else;
#   - no service account token.
#
# ⚠ THE i10-authd IMAGE, ON authd's PIN. pin-image.py rewrites every i10-authd
# reference under infra/k8s on each authd build, this one included.
---
apiVersion: v1
kind: Service
metadata:
  name: i10-enrolld
  namespace: i10-prod
  labels:
    app.kubernetes.io/name: i10-enrolld
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: i10-enrolld
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-enrolld
  namespace: i10-prod
  labels:
    app.kubernetes.io/name: i10-enrolld
spec:
  # Stateless: every enrollment's state is in the API's database, so two
  # replicas and a rolling update keep enrollment up through a rollout.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-enrolld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-enrolld
        app.kubernetes.io/part-of: i10-device-ca
    spec:
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # The distroless image's `nonroot`.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrolld
          image: ghcr.io/i10-tech/i10-authd:prod-4eb1ccf4537c3a953664c530f25d7230aeba31df@sha256:c9e4b89b95f6a37e9fcdedf40ecf412e865c98801c8bb8ab58fbb5a08fae40e1
          command: ["/usr/local/bin/enrolld"]
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          # services/authd/README.md, "Configuration (enrolld)". Every variable is
          # set, defaults included, so this file says what runs.
          env:
            - { name: ENROLLD_LISTEN, value: ":8080" }
            # The API's hooks listener (workloads/api.yaml), verified against the
            # hooks transport CA only, never the system roots.
            - {
                name: ENROLLD_API_URL,
                value: "https://i10-api-ca-hooks.i10-prod.svc:3443",
              }
            - { name: ENROLLD_API_CA_FILE, value: /etc/enrolld/hooks-ca/ca.crt }
            # ⚠ ONE NAMED KEY, NEVER `envFrom`: a key added to the config later
            # must not reach a pod that parses internet input.
            - name: ENROLLD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: i10-enrolld
                  key: ENROLLD_API_TOKEN
            - {
                name: ENROLLD_DEVICE_CA_BUNDLE,
                value: /etc/enrolld/device-ca/bundle.pem,
              }
            - {
                name: ENROLLD_PROFILE_URL,
                value: "https://ca.i10.tech/enroll/apple/profile",
              }
            - { name: ENROLLD_SCEP_URL, value: "https://ca.i10.tech/scep/apple-scep" }
            # Above the API's own 4-second deadline per call, so the API, not
            # enrolld, decides when a call has taken too long.
            - { name: ENROLLD_API_TIMEOUT, value: "10s" }
            - { name: ENROLLD_MAX_CONCURRENT, value: "16" }
            - { name: ENROLLD_LOG_LEVEL, value: "info" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          # /healthz answers 200 without taking an enrollment slot and without
          # calling the API, so a slow API never restarts enrolld.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - { name: hooks-ca, mountPath: /etc/enrolld/hooks-ca, readOnly: true }
            - { name: device-ca, mountPath: /etc/enrolld/device-ca, readOnly: true }
      volumes:
        # The hooks transport CA's certificate only, from the relay's certificate
        # Secret (device-ca/hooks-tls.yaml): never its `tls.key`.
        - name: hooks-ca
          secret:
            secretName: i10-cahookrelay-tls
            defaultMode: 0440
            items:
              - { key: ca.crt, path: ca.crt }
        # The device root and intermediate, for phase 4 (device-ca/trust.yaml).
        # enrolld re-reads it every 30 seconds.
        - name: device-ca
          configMap:
            name: i10-device-ca-trust
            items:
              - { key: bundle.pem, path: bundle.pem }
---
# ⚠ THE EGRESS HALF IS WHAT MATTERS: the API's hooks listener and DNS, nothing
# else. No internet, no Postgres, no Kubernetes API, no Stalwart. Ingress is
# Traefik's only; the psl repo's namespace-wide allow-traefik already admits it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: i10-enrolld
  namespace: i10-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: i10-enrolld
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: i10-api
      ports:
        - { protocol: TCP, port: 3443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# A device's enrollment is three requests (the phase 1 GET, then two POSTs), so
# 20 a minute per address with a burst of 10 never meets a real device.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-enrolld-ratelimit-client
  namespace: i10-prod
spec:
  rateLimit:
    average: 20
    period: 1m
    burst: 10
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64
---
# Two at once from one address is already unusual: a device sends one request
# after another.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-enrolld-inflight-client
  namespace: i10-prod
spec:
  inFlightReq:
    amount: 2
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64
---
# ⚠ BUFFERED, SO A SLOW BODY STALLS TRAEFIK, NOT enrolld. A phase 2 or phase 4
# request is a few kilobytes; enrolld refuses anything over 64 KiB anyway.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-enrolld-body-limit
  namespace: i10-prod
spec:
  buffering:
    maxRequestBodyBytes: 65536
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-enrolld
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ca.i10.tech`) && PathPrefix(`/enroll/apple/`)
      kind: Rule
      priority: 100
      # ⚠ NO ACCESS LOG. The phase 1 URL is `/enroll/apple/<token>`, and the
      # token is what lets a device start the person's enrollment. Traefik
      # logs every request's path in JSON otherwise (psl repo, traefik.yaml).
      observability:
        accessLogs: false
      middlewares:
        - name: i10-enrolld-inflight-client
        - name: i10-enrolld-ratelimit-client
        - name: i10-enrolld-body-limit
      services:
        - name: i10-enrolld
          port: 80
  # The existing wildcard, which covers ca.i10.tech (one label).
  tls:
    secretName: i10-tech-tls
