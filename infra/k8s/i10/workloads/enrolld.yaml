# enrolld: Apple's over-the-air enrollment edge parser (I10-62,
# services/authd/README.md, "Enrollment service", and
# docs/research/enrollment-at-scale.md).
#
# ITS OWN POD, NEVER INSIDE authd OR enrollctl. It parses untrusted CMS and XML
# from the internet, so it holds only:
#   - ENROLL_EDGE_HMAC_KEY (to drop forged/expired links locally with 0 upstream calls)
#   - ENROLLD_API_TOKEN (its bearer token for enrollctl /enrolld/{peek,attest,finish})
#   - public CA certificates (hooks transport CA + device CA trust bundle)
#
# It holds no database credential, no Redis credential, no device-code keys, no
# profile-signing key, and zero profile rendering or encryption code: enrollctl
# builds and signs every profile and enrolld relays the signed bytes verbatim.
---
apiVersion: v1
kind: Service
metadata:
  name: i10-enrolld
  namespace: i10-prod
  labels:
    app.kubernetes.io/name: i10-enrolld
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: i10-enrolld
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-enrolld
  namespace: i10-prod
  labels:
    app.kubernetes.io/name: i10-enrolld
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-enrolld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-enrolld
        app.kubernetes.io/part-of: i10-enroll
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrolld
          image: ghcr.io/i10-tech/i10-authd:prod-1ddb76e42470202eaabe4e172b3fa4168a4b890c@sha256:15d41c0d58bf43a9bf9238fdba30ea88d9c5ccd5c02855d56b11bcc031404896
          command: ["/usr/local/bin/enrolld"]
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - { name: ENROLLD_LISTEN, value: ":8080" }
            - {
                name: ENROLLD_API_URL,
                value: "https://i10-enrollctl.i10-prod.svc:3443",
              }
            - { name: ENROLLD_API_CA_FILE, value: /etc/enrolld/hooks-ca/ca.crt }
            # Named secretKeyRef ONLY, never envFrom.
            - name: ENROLLD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: i10-enrolld
                  key: ENROLLD_API_TOKEN
            - name: ENROLL_EDGE_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: i10-enrolld
                  key: ENROLL_EDGE_HMAC_KEY
            - {
                name: ENROLLD_DEVICE_CA_BUNDLE,
                value: /etc/enrolld/device-ca/bundle.pem,
              }
            - { name: ENROLLD_API_TIMEOUT, value: "15s" }
            - { name: ENROLLD_MAX_CONCURRENT, value: "64" }
            - { name: ENROLLD_LOG_LEVEL, value: "info" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - { name: hooks-ca, mountPath: /etc/enrolld/hooks-ca, readOnly: true }
            - { name: device-ca, mountPath: /etc/enrolld/device-ca, readOnly: true }
      volumes:
        - name: hooks-ca
          secret:
            secretName: i10-cahookrelay-tls
            defaultMode: 0440
            items:
              - { key: ca.crt, path: ca.crt }
        - name: device-ca
          configMap:
            name: i10-device-ca-trust
            items:
              - { key: bundle.pem, path: bundle.pem }
---
# Egress to enrollctl:3443 and DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: i10-enrolld
  namespace: i10-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: i10-enrolld
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: i10-enrollctl
      ports:
        - { protocol: TCP, port: 3443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Per-address rate/in-flight limits and body buffer only. Host-wide caps were
# removed now that forged links are dropped locally with HMAC verification and
# valid enrollments micro-batch in enrollctl.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-enrolld-ratelimit-client
  namespace: i10-prod
spec:
  rateLimit:
    average: 20
    period: 1m
    burst: 10
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-enrolld-inflight-client
  namespace: i10-prod
spec:
  inFlightReq:
    amount: 4
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-enrolld-body-limit
  namespace: i10-prod
spec:
  buffering:
    maxRequestBodyBytes: 65536
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-enrolld
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ca.i10.tech`) && PathPrefix(`/enroll/apple/`)
      kind: Rule
      priority: 100
      # NO ACCESS LOG: the phase 1 URL carries the signed link token.
      observability:
        accessLogs: false
      middlewares:
        - name: i10-enrolld-inflight-client
        - name: i10-enrolld-ratelimit-client
        - name: i10-enrolld-body-limit
      services:
        - name: i10-enrolld
          port: 80
  tls:
    secretName: i10-tech-tls
