# Asks SES about the domains that are still waiting on it, on a schedule.
#
# ⚠ THE SAME IMAGE AND A SIXTH COMMAND, like the worker, the sweep, the
# reconciler, the re-check and the migration Job. `bun dist/domain-catchup.js`
# runs one pass and exits.
#
# ⚠ WHY THIS EXISTS, AND IT IS NOT THE SAME BUG AS domain-recheck.yaml. That job
# re-proves domains that are ALREADY verified; its selector,
# `core.domains_due_recheck`, reads `WHERE status = 'verified'`. A domain that
# has not got there yet appears in NO background job at all — so it was read
# exactly once, by whoever pressed Verify, and then never again. SES verifies a
# DKIM identity on its own schedule and announces it to nobody.
#
# ⚠ THE VISIBLE SHAPE OF THAT BUG WAS A CUSTOMER SENDING REAL MAIL FROM A DOMAIN
# THE DASHBOARD CALLED PENDING. SES had verified it, so SES accepted the send and
# delivered it; our row still said `pending` and would have said so for ever. The
# mail working was never the problem — being unable to say so was, and it becomes
# a great deal worse once anything REFUSES a send on the strength of that column.
# `send/accept.ts` now does exactly that, which makes this job a precondition for
# it rather than a nicety.
#
# ⚠ EVERY MINUTE, BECAUSE THE READER IS A PERSON WAITING. The re-check runs daily
# because it asks a question about domains that are fine. This one is answering
# "has it gone green yet" for somebody who set a domain up ten minutes ago, and
# the console's own poll gives up after about a minute — so beyond that, this
# schedule IS how long they wait.
#
# ⚠ AND THE SCHEDULE IS NOT WHAT LIMITS SES. `staleMs` inside the sweep decides
# how often any ONE domain may be asked about; the schedule only decides how
# soon a newly-stale row is noticed. Tightening this from five minutes to one
# therefore cut the wait by five without changing the per-domain call rate at
# all. What it does cost is pod churn: 1,440 runs a day instead of 288, each of
# which usually does one indexed read and exits.
#
# ⚠ AND IT COSTS ALMOST NOTHING WHEN THERE IS NOTHING TO DO. The selector is
# bounded by a staleness window AND a seven-day horizon — SES abandons DKIM
# verification after 72 hours — so a deployment with no domains mid-setup does
# one indexed read and exits.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: i10-domain-catchup
  namespace: i10-prod
spec:
  # ⚠ THIS STRING IS ALSO IN apps/api/src/domain-catchup.ts, AND THEY MUST AGREE.
  # Sentry decides a run is MISSING by comparing the clock against the schedule
  # the job declares in its check-in, so changing it here alone leaves the job
  # working and the alerting wrong.
  schedule: "*/1 * * * *"
  # ⚠ NEVER TWO AT ONCE. Two passes would ask SES about the same domains in the
  # same window — harmless, because each write is idempotent, and pointless.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Failed runs kept longer than successful ones: the check-in says a run failed,
  # the pod is where the reason is.
  failedJobsHistoryLimit: 5
  # ⚠ SHORTER THAN THE INTERVAL, WHICH ON A MINUTE CADENCE MEANS SECONDS. A pass
  # that could not be placed within half a slot should be abandoned rather than
  # run late into the next one's window.
  startingDeadlineSeconds: 30
  jobTemplate:
    spec:
      # One attempt per slot. Every write this job makes is idempotent and the
      # next slot is a minute away, so an immediate retry only compresses the
      # same failure — a throttled SES, most likely — into a tighter loop.
      backoffLimit: 0
      # ⚠ UNDER THE ONE-MINUTE INTERVAL, AND THAT BOUND IS WHY THE BATCH IS 100.
      # A pass that hangs must be killed before the next one is due, or `Forbid`
      # turns one stuck pod into a catch-up that never runs again — and a killed
      # run sends no check-in, so Sentry reports it as missed rather than as
      # nothing at all. A backlog is not lost either way: the selector orders
      # oldest-first, so the next minute resumes where this one stopped.
      activeDeadlineSeconds: 50
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: catchup
              image: ghcr.io/i10-tech/i10-api:prod-7007e858b6a5dedd365ccdacd5070bf895af39cf@sha256:e0705950c50eecf358c62121e7ae4d7de08a7958e91de59fc6091383422c298c
              imagePullPolicy: Always
              command: ["bun", "dist/domain-catchup.js"]
              envFrom:
                - secretRef: { name: i10-shared }
                - secretRef: { name: i10-api }
              env:
                # ⚠ `i10_api`, NOT THE OWNER — the same rule as everywhere else.
                # This pass reaches across every tenant, and it does it through
                # one narrow SECURITY DEFINER function
                # (`core.domains_awaiting_provider`) rather than by holding a
                # role that can see everything. Every write underneath still goes
                # through `withTenant`, so the policies apply as on a request.
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: i10-api-db-role, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: i10-api-db-role, key: password }
                - name: DATABASE_URL
                  value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/i10
              resources:
                # Almost entirely waiting on SES, so the CPU request is small and
                # the memory ceiling only has to hold one batch of rows.
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 320Mi }
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                capabilities: { drop: ["ALL"] }
