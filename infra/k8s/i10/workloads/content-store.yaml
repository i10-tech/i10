# Everything done to stored mail after the send, on a schedule (#136, #168,
# #171, #188): fingerprints and the farm tripwire (risk on), attachments to R2
# (content store configured), template compaction (always), and full bodies
# sealed into packs in R2 (content store and CONTENT_KEYS set).
#
# ⚠ THE SAME IMAGE AND ANOTHER COMMAND, like the sweep and the reconciler.
# `bun dist/content-store.js` runs one pass and exits.
#
# ⚠ ACCEPT WRITES THE RAW MESSAGE AND RETURNS; this is the "process later" half:
# nothing touches object storage, fingerprints or templates before the 202.
# Without the CONTENT_STORE_* keys (Doppler, prod_api) attachments stay inline;
# without CONTENT_KEYS bodies stay in Postgres; without RISK_ENABLED nothing is fingerprinted; compaction runs either way.
# It reads REDIS_URL and CLERK_SECRET_KEY from i10-shared/i10-api for the
# tripwire's re-score. See docs/decisions/storage.md.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: i10-content-store
  namespace: i10-prod
spec:
  # ⚠ THIS STRING IS ALSO IN apps/api/src/content-store.ts, AND THEY MUST
  # AGREE, or Sentry reports runs as missed while they work.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      # Under the five-minute interval, so a hung upload cannot hold `Forbid`.
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: content-store
              image: ghcr.io/i10-tech/i10-api:prod-b476a5f7d139da7c21462e0a371274f4acc056fa@sha256:b8d28605c03c79ff71f27b908cbfc1fc0e886330065524d43b9366a6bd58c4c0
              imagePullPolicy: Always
              command: ["bun", "dist/content-store.js"]
              envFrom:
                - secretRef: { name: i10-shared }
                - secretRef: { name: i10-api }
              env:
                # ⚠ `i10_api`, NOT THE OWNER. The pass finds its workspaces
                # through SECURITY DEFINER functions that return ids only (0076)
                # and does the work per tenant, under RLS.
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: i10-api-db-role, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: i10-api-db-role, key: password }
                - name: DATABASE_URL
                  value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/i10
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                capabilities: { drop: ["ALL"] }
