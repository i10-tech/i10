# Only Cloudflare may reach the web surfaces: api, dash, auth (#345).
#
# ⚠ DEFENCE IN DEPTH, AND NOT YET ATTACHED. The application already refuses to
# believe `cf-connecting-ip` without the `x-i10-edge` proof (apps/api/src/
# identity/edge.ts), so a direct-to-origin caller cannot forge an address. This
# stops them connecting at all. It is NOT referenced by any IngressRoute,
# because Traefik does not see Cloudflare's address here:
#
#   - Traefik's Service is `type: LoadBalancer` served by k3s servicelb
#     (klipper-lb), per the psl repo's infra/k8s/argocd/apps/traefik.yaml.
#   - It sets no `externalTrafficPolicy`, so it is `Cluster`, and klipper-lb
#     MASQUERADEs (see the note in stalwart/statefulset.yaml, which is why the
#     mail ports use hostPort). Every connection reaches Traefik from a
#     node/pod address, never from Cloudflare's range.
#
# Attached as it stands, this would answer 403 to EVERY request, Cloudflare's
# included. The infra change it needs lives in the PSL repo (the Traefik chart
# values, under `service.spec`, NOT directly under `service` - see the note in
# that file):
#
#     service:
#       spec:
#         externalTrafficPolicy: Local
#
# and a check that it took effect: `kubectl -n traefik get svc traefik -o yaml`
# shows it, and a request's `ClientAddr` in Traefik's JSON access log is the
# caller's address, not a 10.x one. Only then add, to the IngressRoutes of
# api.yaml, console.yaml and auth.yaml (NOT the mail provisioning, mta-sts or
# docs/web routes), under each route:
#
#     middlewares:
#       - name: i10-cloudflare-only
#
# ⚠ SAME NAMESPACE AS THE ROUTES, because Traefik runs with
# `allowCrossNamespace: false`.
#
# ⚠ THE LISTS ARE A SNAPSHOT. Source: https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6, fetched 2026-10-28. Cloudflare adds ranges
# rarely and announces them; a range missing here is a Cloudflare edge that
# gets a 403 once this is attached, so re-fetch before attaching and after any
# Cloudflare announcement.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-cloudflare-only
  namespace: i10-prod
spec:
  ipAllowList:
    sourceRange:
      # IPv4
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      # IPv6
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
