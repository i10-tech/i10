# The send worker.
#
# ⚠ THE SAME IMAGE AS THE API, WITH A DIFFERENT COMMAND. There is no
# `i10-worker` image and no extra entry in build.yml's matrix — this runs
# `node dist/worker.js` out of `i10-api`, exactly as the migration Job above it
# runs `node dist/migrate.js`. One artifact means the worker cannot drift from
# the API's schema, contracts or environment validation, and it means the deploy
# job's digest pin applies to both without a second path filter to keep in step.
#
# ⚠ THIS FILE IS WHY build.yml NO LONGER MAPS ONE MANIFEST PER IMAGE. The deploy
# job used to rewrite a single named file per built image; a second file
# referencing `i10-api` would have been left on a stale digest, silently, with
# nothing to notice it. The pin step now rewrites every reference under
# `infra/k8s/` instead — so adding another manifest for an existing image needs
# no change anywhere else, which is the property that was missing.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-worker
  namespace: i10-prod
spec:
  # ⚠ NO `replicas` HERE, BECAUSE KEDA OWNS IT — see worker-autoscale.yaml. A
  # number in this file would be re-applied by Argo's selfHeal within about 35
  # seconds of every scaling decision, and the two would fight indefinitely.
  #
  # The ceiling still belongs to SES rather than to load: what SES sees is
  # `maxReplicaCount × WORKER_CONCURRENCY` messages in flight, so raising either
  # without raising the account's send rate converts throughput into a wall of
  # 429s, which the transport correctly defers — a scaling change that makes the
  # queue drain slower and looks like SES being slow.
  # Never two versions of the worker at once during a rollout: the old one may
  # hold claims the new one would have to wait out. Cheap here because sending
  # is asynchronous — nobody is watching an HTTP request.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-worker
    spec:
      # ⚠ LONGER THAN A SEND TAKES, SHORTER THAN THE STALE CLAIM. On SIGTERM the
      # worker stops taking jobs and lets what is in flight finish. Killed
      # sooner, its rows sit in `sending` until WORKER_CLAIM_STALE_AFTER expires
      # — mail late by minutes, and a duplicate for anything SES had already
      # accepted. This makes an ordinary deploy produce neither.
      #
      # ⚠ AND IT ONLY MEANS ANYTHING BECAUSE worker.ts NOW PASSES ITS OWN CLOSE
      # TIMEOUT. groupmq's `close()` defaults to abandoning in-flight jobs after
      # 30 seconds, so for as long as the worker called it with no argument this
      # ninety was never reached: a batch still running at the thirty-second
      # mark produced exactly the stranded `sending` rows described above, on
      # every deploy. CLOSE_TIMEOUT_MS is 60s, leaving thirty here for the pool,
      # the Redis quit and the Sentry flush.
      terminationGracePeriodSeconds: 90
      containers:
        - name: worker
          image: ghcr.io/i10-tech/i10-api:prod-e32b46863000dccb02a026453558fabf723b1e94@sha256:c2eee3f95ea3219a2abc68c2cb900261537bf6acbf317ecbf5bac01084bfdf65
          imagePullPolicy: Always
          command: ["node", "dist/worker.js"]
          envFrom:
            - secretRef: { name: i10-shared }
            - secretRef: { name: i10-api }
          env:
            # ⚠ `i10_api`, NOT THE `i10` OWNER. Row level security does not
            # apply to a table's owner, and the worker reads and writes message
            # bodies for every tenant it serves — so it is the one process where
            # losing the boundary would be worst and least visible.
            # assertRlsSubject() refuses to start on the wrong role.
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: i10-api-db-role, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: i10-api-db-role, key: password }
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/i10
            # Used to build the claim identity written to `claimed_by`. It must
            # differ per replica, which the pod name guarantees.
            - name: HOSTNAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric, matching the Dockerfile's USER — see api.yaml.
            runAsUser: 1001
            runAsGroup: 1001
            capabilities: { drop: ["ALL"] }
          # ⚠ NO HTTP PROBES, BECAUSE THERE IS NO LISTENER. The worker serves
          # nothing; a readiness probe would need a port opened purely to answer
          # it. Liveness is the process being alive, which the kubelet already
          # knows — and a worker that is merely idle because the queue is empty
          # must not be restarted for it.
          #
          # What failure looks like here is queue depth rising with no
          # `batch complete` lines, which is a monitoring question rather than a
          # probe. That monitoring does not exist yet.
