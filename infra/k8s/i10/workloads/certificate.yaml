# TLS for every i10 web surface.
#
# BOTH NAMES. A `*.i10.tech` wildcard covers exactly ONE label, so it matches
# app.i10.tech and does NOT match the apex i10.tech - nor a two-label name like
# pr-42.preview.i10.tech. DNS wildcards match one or more labels (RFC 4592) and
# TLS wildcards match exactly one; that asymmetry is the trap.
#
# Issued by DNS-01 through Cloudflare, using i10's OWN zone-scoped API token -
# a separate credential from PSL's, so a leak of one cannot take the other's
# DNS. The token needs Zone:DNS:Edit AND Zone:Zone:Read; DNS:Edit alone fails
# because the zone id is resolved first.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: i10-tech-wildcard
  namespace: i10-prod
spec:
  secretName: i10-tech-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - i10.tech
    - "*.i10.tech"
---
# enrollctl's internal server certificate (I10-62), for the name enrolld and
# acmed dial (`i10-enrollctl.i10-prod.svc`, Service in enrollctl.yaml).
#
# Issued by the namespace hooks transport CA (`i10-hooks-tls` in
# device-ca/hooks-tls.yaml). enrollctl hot-reloads tls.crt and tls.key every
# 30 seconds via mailfront.CertFiles, so the 90-day leaf renews with no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: i10-enrollctl-tls
  namespace: i10-prod
spec:
  secretName: i10-enrollctl-tls
  commonName: i10-enrollctl.i10-prod.svc
  dnsNames:
    - i10-enrollctl.i10-prod.svc
  usages: [server auth]
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: i10-hooks-tls
    kind: Issuer
---
# Apple .mobileconfig CMS profile-signing certificate (docs/research/enrollment-at-scale.md
# section 3.1 & 3.4, verified on iOS 27.2 and macOS 27.3).
#
# No DNS A/AAAA record and no IngressRoute exist for `profiles.i10.tech`;
# Cloudflare DNS-01 issues the certificate and enrollctl alone mounts it
# read-only (0440) with 30-second atomic.Pointer hot reload.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: i10-profile-signing
  namespace: i10-prod
spec:
  secretName: i10-profile-signing-tls
  dnsNames:
    - profiles.i10.tech
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBefore: 720h
  usages:
    - digital signature
    - server auth
