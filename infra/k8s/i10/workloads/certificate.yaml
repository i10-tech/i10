# TLS for every i10 web surface.
#
# ⚠ BOTH NAMES. A `*.i10.tech` wildcard covers exactly ONE label, so it matches
# app.i10.tech and does NOT match the apex i10.tech - nor a two-label name like
# pr-42.preview.i10.tech. DNS wildcards match one or more labels (RFC 4592) and
# TLS wildcards match exactly one; that asymmetry is the trap.
#
# Issued by DNS-01 through Cloudflare, using i10's OWN zone-scoped API token -
# a separate credential from PSL's, so a leak of one cannot take the other's
# DNS. The token needs Zone:DNS:Edit AND Zone:Zone:Read; DNS:Edit alone fails
# because the zone id is resolved first.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: i10-tech-wildcard
  namespace: i10-prod
spec:
  secretName: i10-tech-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - i10.tech
    - "*.i10.tech"
---
# The device CA hooks listener's server certificate (#383 PR 3), for the name
# the relay dials (`i10-api-ca-hooks.i10-prod.svc`, the Service in api.yaml).
#
# ⚠ FROM THE HOOKS TRANSPORT CA, NOT LET'S ENCRYPT AND NOT THE DEVICE CA. The
# Issuer is defined in device-ca/hooks-tls.yaml, beside the relay certificate it
# also signs; the relay trusts that CA and nothing else for this hop. Until the
# Issuer exists this Certificate waits, the Secret is absent, and the API's
# optional mount leaves the listener off.
#
# ⚠ TEN YEARS, BECAUSE `Bun.serve` CANNOT RELOAD `tls`. The API reads these
# files once at start. A short leaf would expire inside a long-running pod, and
# every renewal would need a restart anyway. cert-manager reissues at two
# thirds of the life (about year 7); restart the API then.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: i10-api-ca-hooks-tls
  namespace: i10-prod
spec:
  secretName: i10-api-ca-hooks-tls
  commonName: i10-api-ca-hooks.i10-prod.svc
  dnsNames:
    - i10-api-ca-hooks.i10-prod.svc
  usages: [server auth]
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: i10-hooks-tls
    kind: Issuer
