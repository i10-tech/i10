# Schema migrations, as an Argo PreSync hook.
#
# ⚠ A HOOK, NOT A STARTUP STEP. Migrating inside the API's own boot is simpler
# until there are two replicas, at which point both race for the same schema
# lock and one crash-loops. PreSync runs exactly once per sync and completes
# before any new pod starts, which is the ordering a schema change needs.
#
# ⚠ IT USES THE PRIMARY, NOT THE POOLER. Migrations run DDL in a transaction and
# take advisory locks; PgBouncer in transaction pooling mode can hand
# consecutive statements to different backends, which breaks both. `uri` on the
# CNPG-generated secret already points at i10-platform-rw.
#
# HookSucceeded deletes the Job once it passes, so a failed migration leaves its
# pod behind with the logs still readable — which is when you actually want them.
apiVersion: batch/v1
kind: Job
metadata:
  name: i10-api-migrate
  namespace: i10-prod
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  # Bounded so a migration that hangs on a lock fails the sync rather than
  # holding it open indefinitely.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-api-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/i10-tech/i10-api:prod-latest
          # ⚠ ALWAYS, BECAUSE THE TAG FLOATS. `prod-latest` is not the
          # literal `:latest`, so Kubernetes defaults it to IfNotPresent: a node
          # that has pulled the tag once keeps serving that layer forever while
          # CI republishes underneath it. The symptom is a deploy that reports
          # success and changes nothing. Harmless to keep once the Build
          # workflow starts writing digests into these files.
          imagePullPolicy: Always
          command: ["node", "dist/migrate.js"]
          env:
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: i10-platform-app, key: uri }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # ⚠ NUMERIC, AND IT MUST MATCH THE Dockerfile'S `USER`. kubelet
            # cannot check a named user against runAsNonRoot — it will not read
            # the image's /etc/passwd — so a name gets the container rejected
            # with "image has non-numeric user" before it ever runs. Setting it
            # here as well as in the image means the guarantee survives a base
            # image that quietly renumbers its users.
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-api
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-api
    spec:
      containers:
        - name: api
          # ⚠ THE TAG IS UPDATED BY A COMMIT, NOT BY A DEPLOY COMMAND. That is
          # what GitOps means here: the Build workflow publishes an image and
          # writes its digest into this file, so `git log infra/` is the
          # deployment history and a rollback is a revert.
          #
          # Inert until the first Build run — the i10-workloads Application is
          # deliberately not on automated sync for exactly this reason.
          image: ghcr.io/i10-tech/i10-api:prod-latest
          # ⚠ ALWAYS, BECAUSE THE TAG FLOATS. `prod-latest` is not the
          # literal `:latest`, so Kubernetes defaults it to IfNotPresent: a node
          # that has pulled the tag once keeps serving that layer forever while
          # CI republishes underneath it. The symptom is a deploy that reports
          # success and changes nothing. Harmless to keep once the Build
          # workflow starts writing digests into these files.
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - secretRef: { name: i10-shared }
            - secretRef: { name: i10-api }
          env:
            # ⚠ COMPOSED, NOT STORED. CNPG generates i10-platform-app with the
            # owner's credentials, so that secret is the single source of truth;
            # copying the password into Doppler would give it two, and a CNPG
            # rotation would break the copy silently.
            #
            # It points at the POOLER, not the primary. The application holds
            # many short connections and that is what PgBouncer is for — see the
            # transaction-pooling warning in apps/api/src/env.ts. The migration
            # Job below deliberately does the opposite.
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: i10-platform-app, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: i10-platform-app, key: password }
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@i10-platform-pooler.i10-prod.svc.cluster.local:5432/i10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric, matching the Dockerfile's USER — see api.yaml.
            runAsUser: 1001
            runAsGroup: 1001
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`api.i10.tech`)
      kind: Rule
      services:
        - name: i10-api
          port: 80
  tls:
    secretName: i10-tech-tls
