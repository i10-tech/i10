---
apiVersion: v1
kind: Service
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-api
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-api
    spec:
      containers:
        - name: api
          # ⚠ THE TAG IS UPDATED BY A COMMIT, NOT BY A DEPLOY COMMAND. That is
          # what GitOps means here: the Build workflow publishes an image and
          # writes its digest into this file, so `git log infra/` is the
          # deployment history and a rollback is a revert.
          #
          # Inert until the first Build run — the i10-workloads Application is
          # deliberately not on automated sync for exactly this reason.
          image: ghcr.io/i10-tech/i10-api:prod-latest
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - secretRef: { name: i10-shared }
            - secretRef: { name: i10-api }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`api.i10.tech`)
      kind: Rule
      services:
        - name: i10-api
          port: 80
  tls:
    secretName: i10-tech-tls
