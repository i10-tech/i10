---
apiVersion: v1
kind: Service
metadata:
  name: i10-docs
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-docs
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-docs
  namespace: i10-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-docs
    spec:
      containers:
        - name: docs
          # ⚠ THE TAG IS UPDATED BY A COMMIT, NOT BY A DEPLOY COMMAND. That is
          # what GitOps means here: the Build workflow publishes an image and
          # writes its digest into this file, so `git log infra/` is the
          # deployment history and a rollback is a revert.
          #
          # Inert until the first Build run — the i10-workloads Application is
          # deliberately not on automated sync for exactly this reason.
          image: ghcr.io/i10-tech/i10-docs:prod-latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          # Only the shared root config. This surface has no secrets of
          # its own yet, and naming a Secret that does not exist stops the pod
          # from starting rather than degrading gracefully.
          envFrom:
            - secretRef: { name: i10-shared }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric — 101 is the UID nginx-unprivileged runs as. See api.yaml.
            runAsUser: 101
            runAsGroup: 101
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-docs
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`docs.i10.tech`)
      kind: Rule
      services:
        - name: i10-docs
          port: 80
  tls:
    secretName: i10-tech-tls
