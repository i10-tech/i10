---
apiVersion: v1
kind: Service
metadata:
  name: i10-docs
  namespace: i10-prod
spec:
  selector:
    app.kubernetes.io/name: i10-docs
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i10-docs
  namespace: i10-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: i10-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: i10-docs
    spec:
      containers:
        - name: docs
          # ⚠ THE TAG IS UPDATED BY A COMMIT, NOT BY A DEPLOY COMMAND. That is
          # what GitOps means here: the Build workflow publishes an image and
          # writes its digest into this file, so `git log infra/` is the
          # deployment history and a rollback is a revert.
          #
          # ⚠ THE `prod-latest` BELOW IS A BOOTSTRAP VALUE AND SHOULD NOT
          # SURVIVE. The Build workflow's deploy job rewrites this line to
          # `:prod-<sha>@sha256:<digest>` for every app it actually rebuilt. An
          # app still reading `prod-latest` long after its first build means
          # either it has never changed since this line was written, or its
          # path filter in build.yml does not match where its sources live.
          image: ghcr.io/i10-tech/i10-docs:prod-96ee36e8d772be306398a754c1c35350f3c333e5@sha256:630aa8143d3199e5b9165ac34d543e7e4f13e8f3f5817ed39f512404d1f7f12b
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          # Only the shared root config. This surface has no secrets of
          # its own yet, and naming a Secret that does not exist stops the pod
          # from starting rather than degrading gracefully.
          envFrom:
            - secretRef: { name: i10-shared }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric - matches the USER pinned in apps/docs/Dockerfile. See
            # api.yaml for why a named user is not enough.
            runAsUser: 1001
            runAsGroup: 1001
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-docs
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`docs.i10.tech`)
      kind: Rule
      services:
        - name: i10-docs
          port: 80
  tls:
    secretName: i10-tech-tls
