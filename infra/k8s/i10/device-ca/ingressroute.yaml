# ca.i10.tech SCEP route for step-ca, and nothing else (I10-62).
#
# ACME (`PathPrefix(/acme/apple/)`) moved to `workloads/acmed.yaml`.
#
# EXACTLY ONE PATH RULE, AND THE LIST OF WHAT IS LEFT OUT IS THE POINT.
# step-ca serves far more than SCEP on the same port: `/provisioners`,
# `/roots`, `/root/*`, `/1.0/*`, `/sign`, `/renew`, `/rekey`, `/revoke`,
# `/health`, `/version`, `/crl`. None of them is routed. A request for any of
# them matches no router and gets Traefik's plain 404.
#
#   Path(`/scep/apple-scep`) || PathPrefix(`/scep/apple-scep/`)  SCEP, `apple-scep` only
#
# DNS-ONLY (GREY CLOUD), NOT PROXIED. The record is in infra/tofu/stacks/dns.
---
# Per client address. Host-wide caps were removed now that ACME moved to acmed
# (no unauthenticated badgerv2 growth) and SCEP hooks run locally against Redis.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-device-ca-ratelimit-client
  namespace: i10-prod
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 30
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-device-ca-inflight-client
  namespace: i10-prod
spec:
  inFlightReq:
    amount: 4
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64
---
# SCEP bodies are a few kilobytes (a CSR wrapped in a PKCS#7 envelope).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: i10-device-ca-body-limit
  namespace: i10-prod
spec:
  buffering:
    maxRequestBodyBytes: 1048576
---
# How Traefik reaches step-ca: HTTPS, verified.
#
# NEVER insecureSkipVerify. step-ca's TLS certificate is cut from the device
# intermediate for its service name, so Traefik checks it against the device
# ROOT (`ca.crt` in trust.yaml) for `serverName` below. The intermediate's name
# constraint is what makes that check mean "this is step-ca": no other name can
# carry a certificate from it.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: i10-device-ca
  namespace: i10-prod
spec:
  serverName: i10-device-ca.i10-prod.svc
  rootCAs:
    - configMap: i10-device-ca-trust
  forwardingTimeouts:
    dialTimeout: 5s
    responseHeaderTimeout: 30s
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: i10-device-ca
  namespace: i10-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: >-
        Host(`ca.i10.tech`) && (Path(`/scep/apple-scep`)
        || PathPrefix(`/scep/apple-scep/`))
      kind: Rule
      priority: 100
      middlewares:
        - name: i10-device-ca-inflight-client
        - name: i10-device-ca-ratelimit-client
        - name: i10-device-ca-body-limit
      services:
        - name: i10-device-ca
          port: 443
          scheme: https
          serversTransport: i10-device-ca
  # The existing wildcard, which covers ca.i10.tech (one label).
  tls:
    secretName: i10-tech-tls
