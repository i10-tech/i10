# The hooks transport CA: TLS for internal enrollment hops, and nothing else
# (I10-62, README.md, "The hooks transport CA").
#
#   step-ca          --https-->  cahookrelay 127.0.0.1:9443         (`localhost`, IP:127.0.0.1)
#   enrolld / acmed  --https-->  enrollctl i10-enrollctl:3443       (`i10-enrollctl.i10-prod.svc`)
#
# THIS IS NOT THE DEVICE CA, AND THE NAMES SAY SO. The device CA (step-ca's
# and enrollctl's intermediate, from Doppler) signs Mac/SCEP certificates and
# is trusted by the mail front, Traefik, enrolld, and enrollctl. This CA is
# managed by cert-manager in this namespace, signs the two internal server
# certificates (`i10-cahookrelay-tls` here and `i10-enrollctl-tls` in
# `workloads/certificate.yaml`), and is trusted only by step-ca (SSL_CERT_FILE),
# enrolld (`ENROLLD_API_CA_FILE`), and acmed (`ACMED_ENROLLCTL_CA_FILE`).
# Neither CA can stand in for the other: the device intermediate is
# name-constrained to step-ca's own service name with every IP excluded.
#
# ANY Certificate IN i10-prod CAN NAME THE Issuer BELOW. Whoever can create
# one could mint a `localhost` or `i10-enrollctl` certificate; anyone with that
# RBAC can already read every Secret in i10-prod. Even so, no other Certificate
# may ever use it.
---
# Bootstrap only: signs the CA certificate below, once.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: i10-hooks-tls-bootstrap
  namespace: i10-prod
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: i10-hooks-tls-root
  namespace: i10-prod
spec:
  isCA: true
  commonName: i10 CA hooks transport root
  secretName: i10-hooks-tls-root
  # 20 YEARS, AND ITS KEY NEVER ROTATES. Trusting processes (step-ca, enrolld,
  # acmed) read `ca.crt` once at start, while both server leaves (cahookrelay
  # and enrollctl) are 90-day certs hot-reloaded every 30 seconds.
  duration: 175200h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: i10-hooks-tls-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: i10-hooks-tls
  namespace: i10-prod
spec:
  ca:
    secretName: i10-hooks-tls-root
---
# The relay's server certificate. step-ca dials https://127.0.0.1:9443, so the
# IP SAN is the one that verifies; `localhost` is there for anything that dials
# the name. The relay re-reads these files every 30 seconds, so the 90-day life
# renews with no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: i10-cahookrelay-tls
  namespace: i10-prod
spec:
  secretName: i10-cahookrelay-tls
  commonName: localhost
  dnsNames: [localhost]
  ipAddresses: ["127.0.0.1"]
  usages: [server auth]
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: i10-hooks-tls
    kind: Issuer
