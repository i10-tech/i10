# The device CA's PUBLIC certificates, for the two processes that trust it
# (#383 PR 3, README.md, "Who trusts the device CA"). No key is here, and no
# device is ever told to trust these: they are trust anchors only inside i10.
#
#   ca.crt      the device root alone. Traefik's ServersTransport
#               (ingressroute.yaml) verifies step-ca's TLS certificate with it.
#   bundle.pem  the root AND the intermediate, for the mail front's 993
#               (MAILFRONT_DEVICE_CA_BUNDLE, stalwart/node/statefulset.yaml).
#
# ⚠ THE FRONT'S BUNDLE CARRIES THE INTERMEDIATE ON PURPOSE. 993's certificate
# request lists the bundle's subjects as the acceptable CAs, and a Mac picks an
# identity whose issuer is in that list: the leaf's issuer is the intermediate.
# It also lets a client that sends its leaf without the chain verify. Both a
# root-only and a root-plus-intermediate bundle were proved to verify a Mac leaf
# (2026-11-26).
#
# ⚠ PEM AND NOTHING ELSE INSIDE EACH VALUE. The front refuses a bundle with any
# non-certificate bytes and keeps 993 inert (ParseCertPool, tlsconf.go), so a
# comment typed into the value turns client certificates off.
#
# Fingerprints (SHA-256 of the DER), from the made-CA note of 2026-11-26:
#   root          26:4D:11:DA:...:B0:E2:37:B2  O=i10, CN=i10 Device Root CA 2026, until 2046-11-26
#   intermediate  55:9B:89:6F:...:52:66:03:CE  O=i10, CN=i10 Device Intermediate CA 2026, until 2036-11-26
#
# ⚠ A PLAIN ConfigMap, NOT A HASHED ONE, because two other Applications' pods
# name it: a generated name would change under them. Nothing restarts on an
# edit, and nothing needs to: the front re-reads its bundle every 30 seconds,
# and Traefik watches ConfigMaps. At the year-7 rotation, ADD the new root to
# ca.crt and the new root and intermediate to bundle.pem, beside the old ones,
# before step-ca cuts over; see README.md, "Rotation".
apiVersion: v1
kind: ConfigMap
metadata:
  name: i10-device-ca-trust
  namespace: i10-prod
  labels:
    app.kubernetes.io/name: i10-device-ca
