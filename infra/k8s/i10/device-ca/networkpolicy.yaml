# What may reach the device CA pod, and what it may reach (I10-62).
#
# POLICIES ONLY ADD, SO THE INGRESS HALF HERE NARROWS NOTHING. The psl repo
# gives i10-prod `allow-traefik` and `allow-cnpg-operator`: every pod in the
# `traefik` and `cnpg-system` namespaces may reach every port of every pod here,
# this one included. What keeps the CA safe is not this file: the public route
# is path-scoped to SCEP (`ingressroute.yaml`), step-ca holds no admin surface
# (`enableAdmin` off, no JWK or admin provisioner), the sidecar listens on
# loopback only, and every SCEP issuance validates an active challenge/permit
# in i10-enroll-redis under the least-privilege `cahookrelay` ACL.
#
# THE EGRESS HALF IS REAL. With `Egress` in policyTypes, this pod may open
# connections ONLY to i10-enroll-redis (6379) and cluster DNS (53), and nowhere
# else: no internet, no Postgres, no API, no enrollctl, no Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: i10-device-ca
  namespace: i10-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: i10-device-ca
  policyTypes: [Ingress, Egress]
  ingress:
    # Traefik, for ca.i10.tech/scep/apple-scep. The container port: the
    # Service's 443 is rewritten to 9000 before the policy sees the packet.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 9000 }
  egress:
    # cahookrelay coordinates SCEP challenges and permits in i10-enroll-redis.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: i10-enroll-redis
      ports:
        - { protocol: TCP, port: 6379 }
    # cahookrelay resolves `i10-enroll-redis.i10-prod.svc` through CoreDNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
