# i10's secrets, pulled from its OWN Doppler project.
#
# ⚠ A PROJECT, NOT A CONFIG OF PSL'S. The project is the separation boundary:
# a leaked PSL service token must not reach i10's credentials, and at
# extraction i10's secrets are already where they belong so nothing moves.
#
# ⚠ TWO SECRETS PER WORKLOAD, ALWAYS. Doppler has no folders, so the layout is
# a root config plus branch configs — and the inherited copies of root's keys
# were deliberately DELETED from every branch to give each one a folder-like
# scope. The consequence is that root's shared base never reaches a consumer on
# its own. A Deployment mounting only its own config starts with no
# SENTRY_ENVIRONMENT and no OTEL_* vars, and NOTHING ERRORS — tracing simply
# reports nothing, forever.
#
#   envFrom:
#     - secretRef: {name: i10-shared}   # prod root
#     - secretRef: {name: i10-api}      # prod_api
#
# Later entries win on conflict, so a component can override a shared value.
#
# ⚠ THE KEY NAME IS THE ENV VAR NAME. Under envFrom, a Doppler key name becomes
# the container's variable name verbatim. Name each key exactly what the
# consuming process reads. The config name replaces a prefix; it does not add one.
#
# ⚠ A DopplerSecret NAMING KEYS THAT DO NOT EXIST DOES NOT ERROR. It produces a
# Secret carrying only Doppler's three metadata keys and reports healthy.
# Check the managed Secret's key list, never the condition.
#
# ⚠ EVERYTHING HERE LIVES IN i10-prod, AND THAT IS FORCED, NOT PREFERRED.
#
# A DopplerSecret's `tokenSecret` must be in the SAME namespace as the
# DopplerSecret itself. PSL keeps all of its in `doppler-operator-system`, so
# every service token on the cluster sits in one namespace to lock down — a
# good argument, and one i10 cannot follow: the `i10` AppProject is restricted
# to `i10-*` destinations, so Argo could not create an object there from this
# repo even if we wanted it to. Following PSL's convention would mean a commit
# to the PSL repo for every new i10 workload.
#
# So the tokens are duplicated per namespace rather than shared. That is the
# cost of the boundary, and it is the right way round: the boundary is what
# makes extraction cheap, and a service token is a thing you can mint again.
#
# BOOTSTRAP: the token Secrets below are created by hand, once, and are the one
# thing in this directory that is not in git:
#
#   kubectl -n i10-prod create secret generic doppler-token-i10-root \
#     --from-literal=serviceToken='dp.st.prod.…'
#
# One per config: root, api, console, auth, stalwart, bulwark, platform.
#
# ⚠ CHECK EACH TOKEN'S PREFIX. It encodes the config it was minted from —
# `dp.st.prod_api.…` versus `dp.st.prod.…` — and a token from the wrong config
# syncs the wrong key set with no error at all.
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-shared
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-root
  managedSecret:
    name: i10-shared
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-api
  managedSecret:
    name: i10-api
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-console
  managedSecret:
    name: i10-console
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-auth
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-auth
  managedSecret:
    name: i10-auth
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-stalwart
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-stalwart
  managedSecret:
    name: i10-stalwart
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-bulwark
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-bulwark
  managedSecret:
    name: i10-bulwark
    namespace: i10-prod
---
# The Postgres role Stalwart connects as, for CNPG's managed-role reconciliation.
#
# ⚠ SEPARATE FROM `i10-stalwart` BECAUSE OF THE SECRET TYPE. CNPG reads a role
# password from a `kubernetes.io/basic-auth` secret, and Kubernetes requires
# that type to carry exactly the keys `username` and `password` — lowercase.
# Doppler secret names are uppercase, so the two cannot line up by themselves.
#
# `processors` is what bridges them, and it does a second useful thing: its
# contract is that for a non-Opaque secret, a Doppler value with NO processor is
# not copied at all. So this managed secret contains these two keys and nothing
# else — the root config's inherited values do not leak into it, which they
# would in an Opaque secret.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-stalwart-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-stalwart-db
  managedSecret:
    name: i10-stalwart-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    # ⚠ WITHOUT THIS LABEL CNPG CANNOT SEE THE SECRET. The operator reads
    # referenced secrets through an informer cache restricted to objects
    # labelled `cnpg.io/reload=true`. An unlabelled secret is not merely stale
    # to it — the cached client returns NotFound, and the Cluster reports
    # `failed to get password secret ...: secrets "..." not found` for a secret
    # that plainly exists. The managed role then sits in
    # `pending-reconciliation` indefinitely, with nothing in the operator log.
    #
    # Every other secret CNPG reads here carries it; ours has to as well.
    labels:
      cnpg.io/reload: "true"
  processors:
    STALWART_DB_USERNAME:
      asName: username
    STALWART_DB_PASSWORD:
      asName: password
---
# The read-only Postgres role authd connects as.
#
# Same shape as i10-stalwart-db-role: basic-auth for CNPG, the cnpg.io/reload
# label so the operator's restricted cache can see it, and processors mapping
# Doppler's uppercase names onto the lowercase keys the type requires.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-authd-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-authd-db
  managedSecret:
    name: i10-authd-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  processors:
    AUTHD_DB_USERNAME:
      asName: username
    AUTHD_DB_PASSWORD:
      asName: password
---
# The Postgres role apps/api and apps/worker connect as.
#
# Same shape again: basic-auth for CNPG, the cnpg.io/reload label so the
# operator's restricted informer cache can see it, and processors bridging
# Doppler's uppercase names to the lowercase keys the secret type demands.
#
# ⚠ DELIBERATELY NOT THE SAME CREDENTIAL AS `i10-platform-app`. That secret
# holds the database OWNER, which row level security does not apply to. The two
# must stay distinct in Doppler as well as in Postgres, because the whole tenant
# boundary rests on the application never picking up the wrong one.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-api-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-api-db
  managedSecret:
    name: i10-api-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  processors:
    API_DB_USERNAME:
      asName: username
    API_DB_PASSWORD:
      asName: password
---
# R2 credentials for the CNPG Barman archive, from the `prod_platform` config.
#
# ⚠ `doppler-token-i10-platform` ALSO EXISTS IN doppler-operator-system, where
# it feeds cert-manager's Cloudflare credential from the PSL repo. This is a
# SECOND Secret with the same name in a different namespace, holding a token
# minted from the same config. Not a mistake — see the namespace note at the
# top — but do not assume editing one affects the other.
#
# Keys are NOT renamed. cert-manager demands `api-token` because its issuer
# spec says so; the ObjectStore lets us name the keys, so they keep their
# Doppler names and the manifest reads the same as the Doppler config.
#
# `secrets:` deliberately narrows the sync — the Cloudflare DNS credential
# sitting in the same prod_platform config has no business in a database
# namespace.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-r2-backups
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-platform
  managedSecret:
    name: r2-backups
    namespace: i10-prod
  secrets:
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
---
# Autumn's own config, and the Postgres role that owns its database.
#
# ⚠ A SEPARATE DOPPLER CONFIG (`prod_autumn`) AND A SEPARATE TOKEN. Autumn is
# upstream software we do not control: it reads whatever is in its environment,
# and a token minted from `prod_api` would hand it every i10 secret — Clerk,
# SES, the webhook signing key — for no reason. Its own config is the boundary.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-autumn
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-autumn
  managedSecret:
    name: i10-autumn
    namespace: i10-prod
---
# The Postgres role that OWNS the `autumn` database.
#
# ⚠ AN OWNER, UNLIKE EVERY OTHER ROLE HERE. Autumn applies its own schema
# migrations, so it must be able to CREATE, ALTER and DROP — which is exactly
# why those tables live in their own database rather than beside `core`.
#
# Same shape as the others: basic-auth for CNPG, the cnpg.io/reload label so the
# operator's restricted cache can see it, processors bridging Doppler's
# uppercase names to the lowercase keys the type demands.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-autumn-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-autumn-db
  managedSecret:
    name: i10-autumn-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  processors:
    AUTUMN_DB_USERNAME:
      asName: username
    AUTUMN_DB_PASSWORD:
      asName: password
