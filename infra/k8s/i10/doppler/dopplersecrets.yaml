# i10's secrets, pulled from its OWN Doppler project.
#
# ⚠ A PROJECT, NOT A CONFIG OF PSL'S. The project is the separation boundary:
# a leaked PSL service token must not reach i10's credentials, and at
# extraction i10's secrets are already where they belong so nothing moves.
#
# ⚠ TWO SECRETS PER WORKLOAD, ALWAYS. Doppler has no folders, so the layout is
# a root config plus branch configs - and the inherited copies of root's keys
# were deliberately DELETED from every branch to give each one a folder-like
# scope. The consequence is that root's shared base never reaches a consumer on
# its own. A Deployment mounting only its own config starts with no
# SENTRY_DSN and no SENTRY_ENVIRONMENT, and NOTHING ERRORS - errors are logged
# to stdout and reported nowhere, forever.
#
# ⚠ THERE ARE NO OTEL_* VARS. An earlier version of this comment named some;
# nothing in the code has ever read one. The two above are the whole of it.
#
#   envFrom:
#     - secretRef: {name: i10-shared}   # prod root
#     - secretRef: {name: i10-api}      # prod_api
#
# Later entries win on conflict, so a component can override a shared value.
#
# ⚠ THE KEY NAME IS THE ENV VAR NAME. Under envFrom, a Doppler key name becomes
# the container's variable name verbatim. Name each key exactly what the
# consuming process reads. The config name replaces a prefix; it does not add one.
#
# ⚠ A DopplerSecret NAMING KEYS THAT DO NOT EXIST DOES NOT ERROR. It produces a
# Secret carrying only Doppler's three metadata keys and reports healthy.
# Check the managed Secret's key list, never the condition.
#
# ⚠ EVERYTHING HERE LIVES IN i10-prod, AND THAT IS FORCED, NOT PREFERRED.
#
# A DopplerSecret's `tokenSecret` must be in the SAME namespace as the
# DopplerSecret itself. PSL keeps all of its in `doppler-operator-system`, so
# every service token on the cluster sits in one namespace to lock down - a
# good argument, and one i10 cannot follow: the `i10` AppProject is restricted
# to `i10-*` destinations, so Argo could not create an object there from this
# repo even if we wanted it to. Following PSL's convention would mean a commit
# to the PSL repo for every new i10 workload.
#
# So the tokens are duplicated per namespace rather than shared. That is the
# cost of the boundary, and it is the right way round: the boundary is what
# makes extraction cheap, and a service token is a thing you can mint again.
#
# BOOTSTRAP: the token Secrets below are created by hand, once, and are the one
# thing in this directory that is not in git:
#
#   kubectl -n i10-prod create secret generic doppler-token-i10-root \
#     --from-literal=serviceToken='dp.st.prod.…'
#
# One per config: root, api, console, auth, stalwart, stalwart-keep, bulwark,
# platform, enrolld.
#
# ⚠ CHECK EACH TOKEN'S PREFIX. It encodes the config it was minted from -
# `dp.st.prod_api.…` versus `dp.st.prod.…` - and a token from the wrong config
# syncs the wrong key set with no error at all.
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-shared
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-root
  managedSecret:
    name: i10-shared
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-api
  managedSecret:
    name: i10-api
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-console
  managedSecret:
    name: i10-console
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-auth
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-auth
  managedSecret:
    name: i10-auth
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-stalwart
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-stalwart
  managedSecret:
    name: i10-stalwart
    namespace: i10-prod
---
# The keys and secret of Stalwart Keep (stalwart/keep.yaml), from the
# `prod_stalwart_keep` config. Five values; config/README.md, "Keep", gives the
# commands that make them.
#
# ⚠ A CONFIG OF ITS OWN, NOT KEYS ADDED TO `prod_stalwart`. The `i10-stalwart`
# Secret above is taken whole (`envFrom`) by both Stalwart pods and by the apply
# Job, so anything added to it becomes an environment variable in all three. The
# member's private key would be one of them, and the member key is the one Keep
# proves itself with.
#
# ⚠ `secrets:` NARROWS THE SYNC, AS FOR r2-backups BELOW. A new branch config
# inherits its root's keys, and none of them belong in a Secret that a mail
# server mounts. Name the five keys here; one that is missing from Doppler is
# not an error - the Secret just lacks it - so check the managed Secret's key
# list, not this object's condition.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-stalwart-keep
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-stalwart-keep
  managedSecret:
    name: i10-stalwart-keep
    namespace: i10-prod
  secrets:
    - KEEP_CLUSTER_SECRET
    - KEEP_MEMBER_KEY
    - KEEP_CLIENTS_PEM
    - KEEP_NODE_KEY
    - KEEP_SERVERS_PEM
---
# The mail front's bind token keys (services/authd/README.md, "Mail front",
# "The bind token"), and the mail device code keys, from the
# `prod_mail_bind_token` config. Three values:
#
#   MAILFRONT_BIND_TOKEN_KEY  the one key the front signs with, "<id>:<base64>"
#   AUTHD_BIND_TOKEN_KEYS     every key authd accepts, comma separated
#   MAIL_DEVICE_CODE_KEYS     every key a device code may be hashed under
#                             ("Mail device codes"). authd only, never the
#                             front; the API reads the same value from
#                             `prod_api`, and the two must stay equal.
#
# ⚠ A CONFIG OF ITS OWN, NOT KEYS IN `prod_stalwart`. `i10-stalwart` is taken
# whole (`envFrom`) by Stalwart, and Stalwart must never hold a key that mints
# the proof a sign-in came through the front. Only the `authd` and `mailfront`
# containers read these, by `secretKeyRef`: `authd` its bind token keys and the
# device code keys, `mailfront` only `MAILFRONT_BIND_TOKEN_KEY`.
#
# ⚠ `secrets:` NARROWS THE SYNC, as for `i10-stalwart-keep` above.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-mail-bind-token
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-mail-bind-token
  managedSecret:
    name: i10-mail-bind-token
    namespace: i10-prod
  secrets:
    - MAILFRONT_BIND_TOKEN_KEY
    - AUTHD_BIND_TOKEN_KEYS
    - MAIL_DEVICE_CODE_KEYS
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-bulwark
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-bulwark
  managedSecret:
    name: i10-bulwark
    namespace: i10-prod
---
# The device CA's keys (#383 PR 3, infra/k8s/i10/device-ca/README.md), from the
# `prod_device_ca` config:
#
#   DEVICE_CA_ROOT_CRT              the device root's certificate (its key was
#                                   destroyed after signing)
#   DEVICE_CA_INTERMEDIATE_CRT      step-ca's signing certificate
#   DEVICE_CA_INTERMEDIATE_KEY      its key, PKCS#8, unencrypted
#   DEVICE_CA_SCEP_DECRYPTER_CRT    the SCEP decrypter's certificate (public;
#                                   step-ca reads it from ca.json, not here)
#   DEVICE_CA_SCEP_DECRYPTER_KEY    the SCEP decrypter's RSA key
#
# ⚠ A CONFIG OF ITS OWN, READ ONLY BY step-ca. The Secret is mounted into the
# step-ca container alone, by named `items` (device-ca/deployment.yaml): not
# the API, authd, the front, Stalwart or the relay.
#
# ⚠ `secrets:` NARROWS THE SYNC TO THESE FIVE. Branch configs inherit the root
# `prod` config's keys; this one shadows the five it inherits today with empty
# values, but a key added to root `prod` later would inherit again. With the
# list, such a key never reaches this Secret.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-device-ca
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-device-ca
  managedSecret:
    name: i10-device-ca
    namespace: i10-prod
  secrets:
    - DEVICE_CA_ROOT_CRT
    - DEVICE_CA_INTERMEDIATE_CRT
    - DEVICE_CA_INTERMEDIATE_KEY
    - DEVICE_CA_SCEP_DECRYPTER_CRT
    - DEVICE_CA_SCEP_DECRYPTER_KEY
---
# The CA webhook relay's bearer token (services/authd/README.md, "CA webhook
# relay"), from the `prod_device_ca_hooks` config. One value, CA_HOOK_TOKEN,
# mounted into the relay container only. The API holds its SHA-256
# (CA_HOOK_TOKEN_HASHES in `prod_api`), never the token.
#
# ⚠ NOT IN `prod_device_ca`. step-ca must never hold the token: it serves its
# webhook URLs to anyone at `GET /provisioners` and logs them on errors, which
# is why the token lives in a sidecar step-ca cannot read.
#
# ⚠ ROTATION is in apps/api/README.md, "Rotating the relay's token". The relay
# re-reads the file every 30 seconds, so this Secret needs no restart; the API's
# hash list does.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-device-ca-hooks
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-device-ca-hooks
  managedSecret:
    name: i10-device-ca-hooks
    namespace: i10-prod
  secrets:
    - CA_HOOK_TOKEN
---
# enrolld's bearer token for the API's `/enrolld/*` (services/authd/README.md,
# "Enrollment service"), from the `prod_enrolld` config. One value,
# ENROLLD_API_TOKEN, read by enrolld through one secretKeyRef
# (workloads/enrolld.yaml). The API holds its SHA-256 (ENROLLD_TOKEN_HASHES in
# `prod_api`), never the token, and refuses at startup a hash that is also in
# CA_HOOK_TOKEN_HASHES.
#
# ⚠ ITS OWN CONFIG, NOT `prod_device_ca_hooks`: enrolld parses internet input,
# and the relay's token must never be one Secret read away from it.
#
# ⚠ ROTATION: add the new token's hash to ENROLLD_TOKEN_HASHES and restart the
# API, change ENROLLD_API_TOKEN here and restart enrolld (it reads the variable
# once), then drop the old hash and restart the API again.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-enrolld
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-enrolld
  managedSecret:
    name: i10-enrolld
    namespace: i10-prod
  secrets:
    - ENROLLD_API_TOKEN
---
# The Postgres role Stalwart connects as, for CNPG's managed-role reconciliation.
#
# ⚠ SEPARATE FROM `i10-stalwart` BECAUSE OF THE SECRET TYPE. CNPG reads a role
# password from a `kubernetes.io/basic-auth` secret, and Kubernetes requires
# that type to carry exactly the keys `username` and `password` - lowercase.
# Doppler secret names are uppercase, so the two cannot line up by themselves.
#
# `processors` is what bridges them, and it does a second useful thing: its
# contract is that for a non-Opaque secret, a Doppler value with NO processor is
# not copied at all. So this managed secret contains these two keys and nothing
# else - the root config's inherited values do not leak into it, which they
# would in an Opaque secret.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-stalwart-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-stalwart-db
  managedSecret:
    name: i10-stalwart-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    # ⚠ WITHOUT THIS LABEL CNPG CANNOT SEE THE SECRET. The operator reads
    # referenced secrets through an informer cache restricted to objects
    # labelled `cnpg.io/reload=true`. An unlabelled secret is not merely stale
    # to it - the cached client returns NotFound, and the Cluster reports
    # `failed to get password secret ...: secrets "..." not found` for a secret
    # that plainly exists. The managed role then sits in
    # `pending-reconciliation` indefinitely, with nothing in the operator log.
    #
    # Every other secret CNPG reads here carries it; ours has to as well.
    labels:
      cnpg.io/reload: "true"
  processors:
    STALWART_DB_USERNAME:
      asName: username
    STALWART_DB_PASSWORD:
      asName: password
---
# The read-only Postgres role authd connects as.
#
# Same shape as i10-stalwart-db-role: basic-auth for CNPG, the cnpg.io/reload
# label so the operator's restricted cache can see it, and processors mapping
# Doppler's uppercase names onto the lowercase keys the type requires.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-authd-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-authd-db
  managedSecret:
    name: i10-authd-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  processors:
    AUTHD_DB_USERNAME:
      asName: username
    AUTHD_DB_PASSWORD:
      asName: password
---
# The read-only Postgres role the mail front connects as (`mailfront` in
# platform-db/cluster.yaml).
#
# Same shape as i10-authd-db-role, and a DISTINCT credential: the front must
# never hold `authd`'s, which can write the failure budget.
#
# BOOTSTRAP, before this is merged: MAILFRONT_DB_USERNAME=mailfront and an
# alphanumeric MAILFRONT_DB_PASSWORD (it lands in a DSN) in their own Doppler
# config (`prod_mailfront_db`), a read-only service token minted from that
# config, and
#
#   kubectl -n i10-prod create secret generic doppler-token-i10-mailfront-db \
#     --from-literal=serviceToken='dp.st.…'
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-mailfront-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-mailfront-db
  managedSecret:
    name: i10-mailfront-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  processors:
    MAILFRONT_DB_USERNAME:
      asName: username
    MAILFRONT_DB_PASSWORD:
      asName: password
---
# The Postgres role apps/api and apps/worker connect as.
#
# Same shape again: basic-auth for CNPG, the cnpg.io/reload label so the
# operator's restricted informer cache can see it, and processors bridging
# Doppler's uppercase names to the lowercase keys the secret type demands.
#
# ⚠ DELIBERATELY NOT THE SAME CREDENTIAL AS `i10-platform-app`. That secret
# holds the database OWNER, which row level security does not apply to. The two
# must stay distinct in Doppler as well as in Postgres, because the whole tenant
# boundary rests on the application never picking up the wrong one.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-api-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-api-db
  managedSecret:
    name: i10-api-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  processors:
    API_DB_USERNAME:
      asName: username
    API_DB_PASSWORD:
      asName: password
---
# The Postgres role the authoritative nameserver connects as.
#
# ⚠ SAME SHAPE AS THE OTHER DATABASE ROLES, AND A DISTINCT CREDENTIAL FROM ALL
# OF THEM. `pdns` holds grants on the `pdns` schema and nothing else - see
# apps/api/drizzle/*_pdns_role_grants/migration.sql. PowerDNS is the one process here
# that answers unauthenticated queries from the whole internet, so sharing a
# credential with anything that can read `core` would hand a bug in it the
# product's data.
#
# ⚠ THE `cnpg.io/reload` LABEL IS WHAT LETS CNPG SEE IT AT ALL. The operator
# runs a restricted informer cache; an unlabelled Secret is invisible to it and
# the managed role sits unreconciled with no error anywhere.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-pdns-db-role
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-pdns-db
  managedSecret:
    name: i10-pdns-db-role
    namespace: i10-prod
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  processors:
    PDNS_DB_USERNAME:
      asName: username
    PDNS_DB_PASSWORD:
      asName: password
---
# R2 credentials for the CNPG Barman archive, from the `prod_platform` config.
#
# ⚠ `doppler-token-i10-platform` ALSO EXISTS IN doppler-operator-system, where
# it feeds cert-manager's Cloudflare credential from the PSL repo. This is a
# SECOND Secret with the same name in a different namespace, holding a token
# minted from the same config. Not a mistake - see the namespace note at the
# top - but do not assume editing one affects the other.
#
# Keys are NOT renamed. cert-manager demands `api-token` because its issuer
# spec says so; the ObjectStore lets us name the keys, so they keep their
# Doppler names and the manifest reads the same as the Doppler config.
#
# `secrets:` deliberately narrows the sync - the Cloudflare DNS credential
# sitting in the same prod_platform config has no business in a database
# namespace.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-r2-backups
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-platform
  managedSecret:
    name: r2-backups
    namespace: i10-prod
  secrets:
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    # The SSE-C key the backups are encrypted with (objectstore.yaml).
    - R2_BACKUPS_SSE_KEY
---
# The Redis password, for the Redis pod itself (redis/redis.yaml).
#
# `secrets:` narrows the sync to this one key. The token is the `prod_api` one,
# and Redis has no business holding the rest of that config. The clients do not
# use this Secret: they get the same password inside REDIS_URL from `i10-api`.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-redis-auth
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-api
  managedSecret:
    name: i10-redis-auth
    namespace: i10-prod
  secrets:
    - REDIS_PASSWORD
