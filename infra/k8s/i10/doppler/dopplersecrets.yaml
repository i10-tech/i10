# i10's secrets, pulled from its OWN Doppler project.
#
# ⚠ A PROJECT, NOT A CONFIG OF PSL'S. The project is the separation boundary:
# a leaked PSL service token must not reach i10's credentials, and at
# extraction i10's secrets are already where they belong so nothing moves.
#
# ⚠ TWO SECRETS PER WORKLOAD, ALWAYS. Doppler has no folders, so the layout is
# a root config plus branch configs — and the inherited copies of root's keys
# were deliberately DELETED from every branch to give each one a folder-like
# scope. The consequence is that root's shared base never reaches a consumer on
# its own. A Deployment mounting only its own config starts with no
# SENTRY_ENVIRONMENT and no OTEL_* vars, and NOTHING ERRORS — tracing simply
# reports nothing, forever.
#
#   envFrom:
#     - secretRef: {name: i10-shared}   # prod root
#     - secretRef: {name: i10-api}      # prod_api
#
# Later entries win on conflict, so a component can override a shared value.
#
# ⚠ THE KEY NAME IS THE ENV VAR NAME. Under envFrom, a Doppler key name becomes
# the container's variable name verbatim. Name each key exactly what the
# consuming process reads. The config name replaces a prefix; it does not add one.
#
# ⚠ A DopplerSecret NAMING KEYS THAT DO NOT EXIST DOES NOT ERROR. It produces a
# Secret carrying only Doppler's three metadata keys and reports healthy.
# Check the managed Secret's key list, never the condition.
#
# BOOTSTRAP: the token Secrets below are created by hand, once, and are the one
# thing in this directory that is not in git:
#
#   kubectl -n i10-prod create secret generic doppler-token-i10-root \
#     --from-literal=serviceToken='dp.st.prod.…'
#
# Check the token's prefix — it encodes the config it was minted from, and a
# token from the wrong config syncs the wrong key set with no error.
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-shared
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-root
  managedSecret:
    name: i10-shared
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-api
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-api
  managedSecret:
    name: i10-api
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-console
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-console
  managedSecret:
    name: i10-console
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-stalwart
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-stalwart
  managedSecret:
    name: i10-stalwart
    namespace: i10-prod
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-bulwark
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-bulwark
  managedSecret:
    name: i10-bulwark
    namespace: i10-prod
---
# R2 credentials for the CNPG Barman archive.
#
# NOT renamed. cert-manager demands `api-token` because its issuer spec says
# so; the ObjectStore lets us name the keys, so they keep their Doppler names
# and the manifest reads the same as the Doppler config.
#
# `secrets:` deliberately narrows the sync — the Cloudflare DNS credential
# sitting in the same prod_platform config has no business in this namespace.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: i10-r2-backups
  namespace: i10-prod
spec:
  tokenSecret:
    name: doppler-token-i10-platform
  managedSecret:
    name: r2-backups
    namespace: i10-prod
  secrets:
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
