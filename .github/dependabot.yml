version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than per package. Twenty separate patch
      # PRs is a review queue nobody reads, which is worse for security than
      # one grouped PR that actually gets looked at.
      # ⚠ CAPPED THE SAME WAY `production` IS, AND FOR A REASON THAT ACTUALLY
      # HAPPENED. Uncapped, this group swept TypeScript 6→7, ESLint 9→10 and
      # @types/node 22→26 into ONE pull request. Every code job failed, and no
      # amount of reading told you which of the three did it — the only move
      # left was to close it. Majors still get proposed, as their own ungrouped
      # PR each, which is the form you can actually review and revert.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    # ⚠ ALL FIVE, INCLUDING apps/auth. It was missing here while every other app
    # with a Dockerfile was listed, so its base image was the one nobody was
    # told about — the failure mode of an omission in a list like this is
    # silence, not an error.
    directories:
      - "/apps/api"
      - "/apps/auth"
      - "/apps/console"
      - "/apps/web"
      - "/apps/docs"
    schedule: { interval: weekly }
    commit-message:
      prefix: "chore(deps)"
    # ⚠ THE BUN MAJOR IS A SIX-FILE CHANGE, SO IT IS NEVER ONE PR HERE. A bump
    # in one app's Dockerfile leaves that container on a runtime the others are
    # not on, built by a CI pinned to BUN_VERSION in ci.yml and typechecked
    # against whatever @types/bun says — three-way drift discovered at runtime.
    # Dependabot proposed exactly that shape for apps/console under Node and it
    # had to be closed. Moving bun means five Dockerfiles, `.bun-version`,
    # `packageManager`, ci.yml and @types/bun together, deliberately, which is
    # not a thing a bot can offer.
    #
    # ⚠ AND THERE IS A FLOOR UNDERNEATH IT: Next's standalone server.js does not
    # run on bun < 1.3.14 (oven-sh/bun#25609). A downgrade proposed here would
    # be silently accepted by every test and fail only in the three Next
    # containers at request time.
    ignore:
      - dependency-name: oven/bun
        update-types: [version-update:semver-major]
