# Lint, types, tests, build. Runs on every PR and on both long-lived branches.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than read from the repository, because the toolchain is set up
  # before the checkout is parsed. FOUR PLACES HOLD THIS VERSION - here,
  # `.bun-version`, `packageManager` in package.json, and every Dockerfile's
  # base image tag - and they move together. The toolchain action asserts the
  # version it actually got, so a drift here fails fast rather than producing a
  # run that built against something else.
  BUN_VERSION: "1.4.3"
  # services/authd is a Go module and is deliberately outside the bun
  # workspace, so Turborepo never sees it and it needs its own lane below.
  GO_VERSION: "1.26.5"

jobs:
  commits:
    name: Commit messages
    # Only on PRs: a push to main is already-merged history, and failing there
    # blocks nothing while making the branch look broken.
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun-toolchain
        with:
          bun-version: ${{ env.BUN_VERSION }}
          # commitlint is not a turbo task, so the cache server would start and
          # serve nothing.
          turbo-cache: "false"
      # ⚠ THIS GUARD IS LOAD-BEARING, not style enforcement. Release versions
      # are derived from `feat:` / `fix:` / `!` in the commit log, and
      # next-version.mjs SKIPS a non-conventional subject rather than failing
      # on it. Without this check a release silently bumps patch when it should
      # have bumped minor.
      - name: Lint commit messages in this PR
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
      # Lives here for the full history this job already fetches. See the
      # script for why an applied migration must never change.
      - name: Applied migrations are unchanged
        run: |
          .github/scripts/check-applied-migrations.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  verify:
    name: ${{ matrix.task }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # GitHub's default is 360 minutes. A job that hangs - a wedged pull, a step
    # waiting on input that never arrives - holds a runner for six hours and
    # reports nothing until it does. This is the bound at which that becomes a
    # red run instead.
    #
    # ⚠ AND IT IS DELIBERATELY TIGHTER THAN IT WAS. At 25 minutes the npm stall
    # that made these jobs take eight minutes each still passed, so nothing
    # failed and nothing said anything was wrong. The whole matrix now finishes
    # inside a minute; five is enough headroom for a cold cache and still low
    # enough that a stall shows up as a red run rather than as a slow day.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        task: [lint, check-types, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-toolchain
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run ${{ matrix.task }}
      # ⚠ THE TESTS RUN THE SOURCE; THIS RUNS WHAT SHIPS. Every API entry is
      # started from the bundle the build just made and must reach its own
      # environment check (apps/api/scripts/boot-bundles.ts). A load-order crash
      # in the bundle passed every other check on 2026-11-16 (#475).
      - name: API bundle loads
        if: matrix.task == 'build'
        working-directory: apps/api
        run: bun scripts/boot-bundles.ts

  openapi:
    name: OpenAPI document
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-toolchain
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # ⚠ THIS GUARD IS WHY INLINING THE SPEC IS SAFE. apps/api/openapi.json is a
      # committed artifact: docs.i10.tech/api inlines it at build time so the
      # reference needs no CORS header and renders even when the API is down, and
      # SDK generation reads it from the tree rather than from a running service.
      # Both of those are only sound while the file matches the Zod schemas it
      # came from. Regenerating and diffing is what keeps that true.
      #
      # A failure here means someone changed the API contract without committing
      # the regenerated document - run `bunx turbo run openapi --filter=@i10/api`.
      - name: Regenerate and check for drift
        run: |
          bunx turbo run openapi --filter=@i10/api
          git diff --exit-code -- apps/api/openapi.json

  migrations:
    name: Migrations (each alone)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # ⚠ A REAL POSTGRES, BECAUSE NOTHING ELSE IN THIS FILE RUNS A MIGRATION. The
    # unit tests never touch a database, so until this job existed the first
    # place a migration met Postgres was the production PreSync hook.
    #
    # pgvector's image rather than plain postgres: the migrations create and use
    # the `vector` extension, which production gets from the CNPG operand image.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          # ⚠ NO PASSWORD, ON PURPOSE. This server lives for one job, holds
          # nothing, and is reachable only from the runner. A literal password
          # here is a credential-shaped string that protects nothing and that
          # secret scanning then has to be taught to ignore.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-toolchain
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # ⚠ ONE MIGRATION PER SESSION, AS THE NON-SUPERUSER OWNER. Migrating an
      # empty database in a single run is the one way production never applies
      # them, and it hides two kinds of failure: a migration that only works in
      # the session of an earlier one, and one that only works as a superuser.
      # 0155 was the first kind - it needed pgvector's library already loaded,
      # passed everywhere it was tried, and failed every deploy for two days.
      # See apps/api/scripts/check-migrations.ts.
      - name: Apply every migration in its own session
        working-directory: apps/api
        env:
          CHECK_MIGRATIONS_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: bun run check-migrations
      # ⚠ authd's DATABASE TESTS RUN HERE, BECAUSE THIS IS THE ONE JOB WITH A
      # MIGRATED DATABASE. The check above leaves `i10` fully migrated, with every
      # role cluster.yaml creates. In the `authd` job these tests skip, silently:
      # the bind's gate query, the sweep's per-domain rewrite of it, the failure
      # budget and what the `mailfront` role may and may not do are only proven
      # against Postgres. Trust auth, so each role's password is irrelevant.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/authd/go.sum
      - name: authd's database tests
        working-directory: services/authd
        env:
          AUTHD_TEST_DATABASE_URL: postgres://authd@127.0.0.1:5432/i10
          AUTHD_TEST_MAILFRONT_DATABASE_URL: postgres://mailfront@127.0.0.1:5432/i10
          AUTHD_TEST_ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/i10
        # mailfront too: its access-change poll and every gate input's path
        # (paths_db_test.go) are only proven against Postgres.
        # ⚠ -p 1: ONE PACKAGE AT A TIME. All four share this one database and
        # were not written to run beside each other: mailfront's gate-path test
        # writes the shared access-change log (and truncates gate tables) while
        # projection's reads it with exact limits (#534), and locking around
        # that from a test only moved the problem into deadlocks (#533). Tests
        # inside a package already run one at a time (none calls t.Parallel);
        # a DB test that ever does brings the same races back.
        run: go test -race -count=1 -p 1 ./internal/projection/ ./internal/budgetstore/ ./internal/ldapsrv/ ./internal/mailfront/
      # ⚠ AND SO DO THE API's. Every apps/api/test/*-db.test.ts skips itself
      # when its variable is unset, so in the `test` matrix job they all skip,
      # and eleven of them sat broken on main unnoticed (#514). The script sets
      # every variable the files read and fails if any test skipped. The tests
      # import the workspace packages' built dist/, hence the build first.
      - name: Build the API's workspace packages
        run: bunx turbo run build --filter=@i10/api^...
      - name: API's database tests
        working-directory: apps/api
        env:
          DB_TESTS_DATABASE_URL: postgres://i10@127.0.0.1:5432/i10
        run: bun run test:db

  authd:
    name: authd (Go)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/authd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/authd/go.sum
      # gofmt has no --check, so this asserts the list of unformatted files is
      # empty. `go vet` catches the mistakes the compiler does not.
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # ⚠ -race IS NOT OPTIONAL HERE. authd answers every bind on its own
      # goroutine and shares a rate limiter and a connection pool across all of
      # them. It also found a real data race in the LDAP library on first run.
      - run: go test -race -count=1 ./...
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # ⚠ ITS OWN LANE, NOT PART OF THE `verify` MATRIX, BECAUSE IT IS NOT A TURBO
  # TASK - it reads Dockerfiles and manifests rather than building a package, so
  # there is nothing for turbo to cache and nothing to key a cache on. It also
  # guards a failure the matrix structurally cannot see: `lint`, `check-types`,
  # `test` and `build` all run against the real repository, where every workspace
  # is on disk. The image build is the only thing that runs against a pruned
  # checkout, and it runs on push to `main` - after the merge.
  images:
    name: Image manifests
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-toolchain
        with:
          bun-version: ${{ env.BUN_VERSION }}
          turbo-cache: "false"
      - run: bun run check-images

  format:
    name: Format
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-toolchain
        with:
          bun-version: ${{ env.BUN_VERSION }}
          # prettier --check is not a turbo task either.
          turbo-cache: "false"
      - run: bun run format:check
