# Lint, types, tests, build. Runs on every PR and on both long-lived branches.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than read from packageManager, because the toolchain is set up
  # before the checkout is parsed. Four places hold this version — here,
  # package.json, and any Dockerfile that installs it — and they move together.
  #
  # ⚠ THE PIN NO LONGER COSTS ANYTHING. It used to: `pnpm/action-setup` reacts
  # to a version that differs from the runner's preinstalled pnpm by running an
  # `npm install`, which was measured at 7m08s in six parallel jobs on a run
  # whose real work took under 40 seconds. .github/actions/node-toolchain
  # fetches the tarball directly instead, so pinning is now free and should
  # stay.
  PNPM_VERSION: "11.24.0"
  NODE_VERSION: "22.20.0"
  # services/authd is a Go module and is deliberately outside the pnpm
  # workspace, so Turborepo never sees it and it needs its own lane below.
  GO_VERSION: "1.26.5"

jobs:
  commits:
    name: Commit messages
    # Only on PRs: a push to main is already-merged history, and failing there
    # blocks nothing while making the branch look broken.
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          # commitlint is not a turbo task, so the cache server would start and
          # serve nothing.
          turbo-cache: "false"
      # ⚠ THIS GUARD IS LOAD-BEARING, not style enforcement. Release versions
      # are derived from `feat:` / `fix:` / `!` in the commit log, and
      # next-version.mjs SKIPS a non-conventional subject rather than failing
      # on it. Without this check a release silently bumps patch when it should
      # have bumped minor.
      - name: Lint commit messages in this PR
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  verify:
    name: ${{ matrix.task }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # GitHub's default is 360 minutes. A job that hangs — a wedged pull, a step
    # waiting on input that never arrives — holds a runner for six hours and
    # reports nothing until it does. This is the bound at which that becomes a
    # red run instead.
    #
    # ⚠ AND IT IS DELIBERATELY TIGHTER THAN IT WAS. At 25 minutes the npm stall
    # that made these jobs take eight minutes each still passed, so nothing
    # failed and nothing said anything was wrong. The whole matrix now finishes
    # inside a minute; five is enough headroom for a cold cache and still low
    # enough that a stall shows up as a red run rather than as a slow day.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        task: [lint, check-types, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm run ${{ matrix.task }}

  openapi:
    name: OpenAPI document
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # ⚠ THIS GUARD IS WHY INLINING THE SPEC IS SAFE. apps/api/openapi.json is a
      # committed artifact: docs.i10.tech/api inlines it at build time so the
      # reference needs no CORS header and renders even when the API is down, and
      # SDK generation reads it from the tree rather than from a running service.
      # Both of those are only sound while the file matches the Zod schemas it
      # came from. Regenerating and diffing is what keeps that true.
      #
      # A failure here means someone changed the API contract without committing
      # the regenerated document — run `pnpm turbo run openapi --filter=@i10/api`.
      - name: Regenerate and check for drift
        run: |
          pnpm turbo run openapi --filter=@i10/api
          git diff --exit-code -- apps/api/openapi.json

  authd:
    name: authd (Go)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/authd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/authd/go.sum
      # gofmt has no --check, so this asserts the list of unformatted files is
      # empty. `go vet` catches the mistakes the compiler does not.
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # ⚠ -race IS NOT OPTIONAL HERE. authd answers every bind on its own
      # goroutine and shares a rate limiter and a connection pool across all of
      # them. It also found a real data race in the LDAP library on first run.
      - run: go test -race -count=1 ./...
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  format:
    name: Format
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          # prettier --check is not a turbo task either.
          turbo-cache: "false"
      - run: pnpm run format:check
