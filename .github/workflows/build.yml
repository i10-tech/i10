# Build and publish container images to GHCR, signed.
#
# ONE IMAGE SERVES BOTH ENVIRONMENTS. Nothing environment-specific is baked in;
# a promotion re-tags the same artifact rather than rebuilding, so what reaches
# production is byte-for-byte what was tested on staging. That is why
# SENTRY_ENVIRONMENT and friends are turbo passThrough rather than build inputs
# — listing them would make staging and prod produce different images, which is
# exactly what this model avoids.
name: Build

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Keyless cosign signing needs an OIDC token.
  id-token: write

env:
  REGISTRY: ghcr.io
  # ⚠ lowercase. GHCR rejects an uppercase path segment, and the org is
  # `i10-tech`, so this is safe — but a repository_owner interpolation would
  # not be if the org were ever renamed with capitals.
  NAMESPACE: i10-tech

jobs:
  build:
    name: ${{ matrix.app.image }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: api, image: i10-api }
          - { name: console, image: i10-console }
          - { name: web, image: i10-web }
          - { name: docs, image: i10-docs }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.app.image }}
          # The branch prefix is what makes promotion a re-tag: staging builds
          # produce staging-<sha>, and only a promotion writes prod-<sha>.
          tags: |
            type=raw,value=staging-${{ github.sha }},enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=prod-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod-latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The build context is the REPO ROOT, not the app directory: every
          # Dockerfile here installs from the workspace lockfile, so a
          # per-app context would have no pnpm-lock.yaml to be frozen against.
          context: .
          file: apps/${{ matrix.app.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.app.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.image }}
          provenance: true
          sbom: true

      # Sign the DIGEST, never a tag. A tag is a mutable pointer — signing one
      # attests to whatever it points at now, which is the thing an attacker
      # would change.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.app.image }}@${DIGEST}"

      - name: Record the digest
        run: |
          {
            echo "### ${{ matrix.app.image }}"
            echo ''
            echo '```'
            echo "${{ steps.push.outputs.digest }}"
            echo '```'
            echo ''
            echo 'Pin this digest in `infra/k8s/i10/workloads/` — the deploy is that commit.'
          } >> "$GITHUB_STEP_SUMMARY"
