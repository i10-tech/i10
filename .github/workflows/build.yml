# Build and publish container images to GHCR, signed, then pin them into the
# manifests Argo reads.
#
# ONE IMAGE SERVES BOTH ENVIRONMENTS. Nothing environment-specific is baked in;
# a promotion re-tags the same artifact rather than rebuilding, so what reaches
# production is byte-for-byte what was tested on staging. That is why
# SENTRY_ENVIRONMENT and friends are turbo passThrough rather than build inputs
# — listing them would make staging and prod produce different images, which is
# exactly what this model avoids.
#
# ── ONLY WHAT CHANGED ────────────────────────────────────────────────────────
#
# `changes` runs dorny/paths-filter over the diff and emits a matrix containing
# only the apps whose own sources — or a workspace package they consume —
# actually moved. Everything else is not rebuilt AND NOT RETAGGED: the manifests
# already carry that image's digest from the commit that last changed it, so
# `infra/k8s/i10/**` at any revision is a complete description of what runs.
#
# ⚠ THAT IS A DELIBERATE DIVERGENCE FROM PSL, which retags every unchanged app
# to the new sha so its promote workflow finds a per-sha tag for all of them.
# i10 has no promote step — main publishes prod-* directly — and pins by digest
# rather than by tag, so the retag would produce an alias with no consumer and
# a NEW wrapper digest that would roll a pod whose contents did not change.
#
# ── AND THE COMMIT IS THE DEPLOY ─────────────────────────────────────────────
#
# `deploy` writes each freshly built digest into the manifest that references it
# and pushes that to main. Argo is on automated sync, so the push is the
# rollout: `git log infra/` is the deployment history and a rollback is a
# revert. Nothing here talks to the cluster.
name: Build

on:
  push:
    branches: [main, staging]
    # ⚠ THIS EXISTS BECAUSE THE DEPLOY JOB PUSHES TO THIS BRANCH. Its commit
    # touches only `infra/k8s/i10/**`, so ignoring `infra/**` here is what stops
    # a build from triggering the next build forever. The two must move
    # together: if the deploy job is ever taught to write outside infra/, this
    # list has to grow with it.
    #
    # It costs nothing else. No filter below maps an infra path to an image, so
    # an infra-only commit would produce an empty matrix and do no work anyway.
    paths-ignore:
      - "infra/**"
  workflow_dispatch:

# ⚠ NOT `cancel-in-progress`. A cancelled run can leave a signed image pushed
# with nothing having pinned it, and worse, can interrupt the deploy job between
# its commit and its push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Keyless cosign signing needs an OIDC token.
  id-token: write

env:
  REGISTRY: ghcr.io
  # ⚠ lowercase. GHCR rejects an uppercase path segment, and the org is
  # `i10-tech`, so this is safe — but a repository_owner interpolation would
  # not be if the org were ever renamed with capitals.
  NAMESPACE: i10-tech

jobs:
  # ---------------------------------------------------------------------------
  # Decide what to build.
  # ---------------------------------------------------------------------------
  changes:
    name: Decide what to build
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      # A JSON array of matrix entries — `[]` when nothing needs building.
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so paths-filter can diff against the previous push.
          fetch-depth: 0

      # ⚠ SKIPPED ON workflow_dispatch, WHERE THERE IS NO DIFF TO READ. A manual
      # run has no "before" commit, so the filter would either fail or report
      # nothing changed — and a human pressing Run Workflow means "build it".
      # The plan step turns that into every app.
      - name: Filter paths per app
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            # Each app lists its OWN sources plus every workspace package it
            # consumes, transitively. Read off the package.json files:
            #   contracts → api, node
            #   emails    → api      (clerk's auth mail, rendered by us)
            #   node      → next, console
            #   next      → console
            #   ui        → console, web, auth
            #   api       → docs   (docs generates its API reference from it)
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/emails/**'
            console:
              - 'apps/console/**'
              - 'packages/ui/**'
              - 'packages/next/**'
              - 'packages/node/**'
              - 'packages/contracts/**'
            auth:
              - 'apps/auth/**'
              - 'packages/ui/**'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
            # ⚠ docs DEPENDS ON apps/api. It is not a documentation site that
            # happens to mention the API — it builds `@i10/api` to generate the
            # OpenAPI document Scalar renders. An api-only change that did not
            # rebuild docs would leave the published reference describing the
            # previous release.
            docs:
              - 'apps/docs/**'
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/emails/**'
            # A Go module with its own go.sum, deliberately outside the bun
            # workspace. Nothing in the bun sentinel below can affect it.
            authd:
              - 'services/authd/**'
            # Anything that changes how EVERY bun app installs or builds.
            bun:
              # NO LEADING SLASH: paths-filter reports changed paths
              # repo-relative, and picomatch matches the pattern against that
              # string, so `/package.json` would match nothing. A bare
              # `package.json` has no separator, so it matches ONLY the root
              # file — each app's own is already covered above.
              - 'package.json'
              - 'bun.lock'
              # bunfig.toml replaces BOTH .npmrc and pnpm-workspace.yaml: it
              # carries the supply-chain release-age gate and the linker mode,
              # either of which changes what an install produces.
              - 'bunfig.toml'
              # turbo.json is in the same class as the lockfile: its `env` list
              # is part of every task's cache key and decides which variables
              # are visible to a build.
              - 'turbo.json'
              # Catch-all for any package NOT mapped to an app above —
              # eslint-config, typescript-config, and anything added later.
              # ONE positive extglob on purpose: paths-filter evaluates each
              # pattern independently with .some() semantics, so a separate
              # `!packages/ui/**` line would match every file outside
              # packages/ui and fire on any change at all.
              - 'packages/!(contracts|ui|next|node)/**'
            # Changes how everything is built, Go included.
            all:
              - '.github/workflows/build.yml'

      # ⚠ THE APP TABLE LIVES HERE AND NOWHERE ELSE. Every downstream step
      # iterates it rather than repeating the names, because in PSL's version
      # they were repeated and drifted: an app was built, pushed, and then
      # silently neither signed nor deployed, because one loop still listed
      # three apps out of four.
      #
      # `manifest` is the file whose image reference the deploy job rewrites.
      # `bun` marks the apps the bun sentinel applies to.
      - name: Build the plan
        id: plan
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          SENTINEL_BUN: ${{ steps.filter.outputs.bun }}
          SENTINEL_ALL: ${{ steps.filter.outputs.all }}
          CH_API: ${{ steps.filter.outputs.api }}
          CH_CONSOLE: ${{ steps.filter.outputs.console }}
          CH_AUTH: ${{ steps.filter.outputs.auth }}
          CH_WEB: ${{ steps.filter.outputs.web }}
          CH_DOCS: ${{ steps.filter.outputs.docs }}
          CH_AUTHD: ${{ steps.filter.outputs.authd }}
        run: |
          set -euo pipefail

          # ⚠ `context` IS PER-ENTRY, NOT SHARED. The bun apps build from the
          # REPO ROOT because their Dockerfiles install from the workspace
          # lockfile and a per-app context would have no bun.lock to be frozen
          # against. authd is a self-contained Go module with its own go.sum,
          # so its context is its own directory — giving it the repo root would
          # ship the entire monorepo into the build.
          table=$(jq -nc \
            --arg api "${CH_API:-false}" \
            --arg console "${CH_CONSOLE:-false}" \
            --arg auth "${CH_AUTH:-false}" \
            --arg web "${CH_WEB:-false}" \
            --arg docs "${CH_DOCS:-false}" \
            --arg authd "${CH_AUTHD:-false}" \
            '[
              {name:"api",     image:"i10-api",     context:".",              file:"apps/api/Dockerfile",       bun:true,   changed:$api},
              {name:"console", image:"i10-console", context:".",              file:"apps/console/Dockerfile",   bun:true,   changed:$console},
              {name:"auth",    image:"i10-auth",    context:".",              file:"apps/auth/Dockerfile",      bun:true,   changed:$auth},
              {name:"web",     image:"i10-web",     context:".",              file:"apps/web/Dockerfile",       bun:true,   changed:$web},
              {name:"docs",    image:"i10-docs",    context:".",              file:"apps/docs/Dockerfile",      bun:true,   changed:$docs},
              {name:"authd",   image:"i10-authd",   context:"services/authd", file:"services/authd/Dockerfile", bun:false,  changed:$authd}
            ]')

          decided=$(jq -c \
            --arg force "$FORCE_ALL" \
            --arg bun "${SENTINEL_BUN:-false}" \
            --arg all "${SENTINEL_ALL:-false}" \
            'map(. + {build: (
               ($force == "true")
               or ($all == "true")
               or (.bun and ($bun == "true"))
               or (.changed == "true")
             )})' <<<"$table")

          matrix=$(jq -c '[.[] | select(.build) | {name, image, context, file}]' <<<"$decided")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          # Publish the plan as THIS job's summary, not the build job's.
          # GitHub renders a summary when the job that wrote it finishes, and
          # this one ends in seconds — so the plan is readable on the run page
          # while the images are still building, rather than ten minutes later
          # alongside the result it was meant to predict.
          {
            echo "## Build plan"
            echo ""
            echo "| Image | Own paths changed | Decision |"
            echo "|-------|-------------------|----------|"
            jq -r '.[] | "| `\(.image)` | \(.changed) | " +
                   (if .build then "🔨 build" else "⏭️ unchanged — keeps its pinned digest" end) + " |"' <<<"$decided"
            echo ""
            # ⚠ `if`, NOT `[[ … ]] && echo`. Under `set -e` a false test at the
            # end of a group is the group's exit status, so a run where no
            # sentinel fired would fail this step for having nothing to say.
            if [[ "$FORCE_ALL" == "true" ]]; then
              echo "Manual run → everything builds."
            fi
            if [[ "${SENTINEL_ALL:-}" == "true" ]]; then
              echo "\`build.yml\` changed → everything builds."
            fi
            if [[ "${SENTINEL_BUN:-}" == "true" ]]; then
              echo "Root manifest, lockfile, bunfig.toml, turbo.json or an unmapped package changed → every bun app builds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build, push and sign — only the apps the plan named.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.app.image }}
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '[]' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.app.image }}
          # The branch prefix is what makes promotion a re-tag: staging builds
          # produce staging-<sha>, and only a promotion writes prod-<sha>.
          tags: |
            type=raw,value=staging-${{ github.sha }},enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=prod-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod-latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.app.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.image }}
          provenance: true
          sbom: true

      # Sign the DIGEST, never a tag. A tag is a mutable pointer — signing one
      # attests to whatever it points at now, which is the thing an attacker
      # would change.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.app.image }}@${DIGEST}"

      # ⚠ AN ARTIFACT, NOT A JOB OUTPUT. A matrix leg writing to `outputs` is
      # overwritten by every other leg — last one to finish wins — so four
      # parallel builds would hand the deploy job one digest and three
      # nothing. One artifact per image, merged downstream.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          printf '%s' "$DIGEST" > "/tmp/digests/${{ matrix.app.image }}"
          {
            echo "### ${{ matrix.app.image }}"
            echo ''
            echo '```'
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.app.image }}
          path: /tmp/digests/${{ matrix.app.image }}
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Pin the digests into the manifests. This is the deploy.
  # ---------------------------------------------------------------------------
  deploy:
    name: Pin digests and deploy
    needs: [changes, build]
    # main only. A staging push publishes staging-* images and stops there —
    # there is no staging cluster for them to roll into yet.
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      # The only job that writes to the repository.
      contents: write
    # Records a GitHub Deployment against the production environment, so the
    # repo's Environments page answers "what is live and since when" without
    # anyone reading workflow logs.
    environment:
      name: production
      url: https://i10.tech
    # ⚠ THE SECRETS ARE TURNED INTO BOOLEANS HERE BECAUSE A STEP-LEVEL `if:`
    # CANNOT SEE `secrets`, AND GETTING THAT WRONG DOES NOT FAIL THE STEP — IT
    # FAILS THE WHOLE WORKFLOW BEFORE ANY JOB STARTS. GitHub validates context
    # availability when it parses the file, so `if: secrets.X != ''` on a step
    # produces a run with zero jobs, no logs, and only "this run likely failed
    # because of a workflow file issue" to go on. It cost a green pipeline for
    # three pushes.
    #
    # `jobs.<id>.env` is one of the places `secrets` IS available, so the
    # presence check happens once, here, and the steps below compare strings.
    # The VALUES are never exposed this way — only whether they are set.
    env:
      HAS_TAILSCALE: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID != '' }}
      HAS_DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push below needs a token that can write; the default one can,
          # and persist-credentials leaves it configured for git.
          persist-credentials: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      # ⚠ REPLACE THE WHOLE REFERENCE, INCLUDING ANY EXISTING `@sha256:`.
      # The manifests start life pinned to `:prod-latest` and end up pinned to
      # `:prod-<sha>@sha256:<digest>`; a pattern that only matched the tag
      # would append a second digest to an already-pinned line and produce a
      # reference Kubernetes rejects at pull time, not at apply time.
      #
      # ⚠ IT SCANS EVERY MANIFEST RATHER THAN A MAPPED FILE PER IMAGE. There
      # used to be a `manifest:` column in the app table above; it broke the
      # moment one image appeared in two files — `i10-api` runs both the API and
      # the worker — and it broke SILENTLY, leaving the second file on a stale
      # digest with nothing to notice. A mapping you must remember to update is
      # a mapping that will be forgotten, so there is no mapping: every
      # reference to a built image is rewritten wherever it appears.
      - name: Pin each built image
        id: pin
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          set -euo pipefail
          pinned=()
          while read -r image; do
            digest_file="/tmp/digests/${image}"
            if [[ ! -s "$digest_file" ]]; then
              echo "::error::No digest artifact for ${image} — the build job did not record one."
              exit 1
            fi
            digest=$(cat "$digest_file")
            ref="${REGISTRY}/${NAMESPACE}/${image}:prod-${GITHUB_SHA}@${digest}"
            python3 - "${REGISTRY}/${NAMESPACE}/${image}" "$ref" <<'PY'
          import pathlib, re, sys
          repo, ref = sys.argv[1], sys.argv[2]
          # A repo name is a prefix of no other repo name here, so anchoring on
          # `<registry>/<ns>/<image>:` is unambiguous.
          pattern = re.compile(rf"{re.escape(repo)}:\S+")
          total = 0
          for path in sorted(pathlib.Path("infra/k8s").rglob("*.yaml")):
              src = path.read_text()
              out, n = pattern.subn(ref, src)
              if n:
                  path.write_text(out)
                  total += n
                  print(f"  {path}: {n} reference(s)")
          if total == 0:
              sys.exit(f"no reference to {repo} under infra/k8s — is the image still deployed?")
          print(f"  → {ref}")
          PY
            pinned+=("$image")
          done < <(jq -r '.[].image' <<<"$MATRIX")
          echo "pinned=${pinned[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: push
        env:
          PINNED: ${{ steps.pin.outputs.pinned }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- infra/k8s

          if git diff --cached --quiet; then
            echo "Manifests already reference these digests — nothing to deploy."
            # ⚠ RECORDED, BECAUSE THE VERIFY STEP MUST NOT RUN. With no new
            # commit there is nothing for Argo to move to, so waiting for one
            # would spend the whole timeout and then report a failed rollout
            # for a deploy that correctly did nothing.
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(deploy): pin ${PINNED} at ${GITHUB_SHA:0:7}"

          # ⚠ RETRY BY REBASE, NOT BY FORCE. Two merges landing close together
          # each produce a deploy commit, and the second finds main moved. The
          # change is confined to image lines in files nothing else edits, so a
          # rebase is safe; a force push would silently drop the first deploy.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          echo "::error::Could not push the deploy commit after 3 attempts."
          exit 1

      # ⚠ THE DEPLOY COMMIT'S SHA, NOT `GITHUB_SHA`. Argo syncs to whatever is at
      # the head of `main`, and the head is now the commit the step above
      # created — pinning the digests. Waiting for `GITHUB_SHA` would wait for
      # the merge commit, which Argo passed through on its way here and which
      # does NOT carry the new image references.
      - name: Record the deployed revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ⚠ "PUSHED" AND "DEPLOYED" WERE THE SAME SENTENCE HERE AND ARE NOT THE
      # SAME EVENT. Until this step existed the workflow went green the moment
      # git accepted the commit, while Argo had not polled, the image had not
      # been pulled and nothing had started — so an ImagePullBackOff, a missing
      # secret or a container that crashlooped on a config error were all
      # invisible to CI. The first anybody knew was opening the site.
      #
      # ⚠ IT IS SSH BECAUSE THE CONTROL PLANE IS NOT PUBLIC. `argocd-server` is a
      # ClusterIP with no ingress and the Kubernetes API is not exposed. The
      # alternative is publishing one of them so a runner can call it, which
      # buys a convenience with a lot of attack surface.
      #
      # ⚠ AND IT GOES OVER TAILSCALE, BECAUSE SSH IS NOT ON THE PUBLIC INTERNET
      # EITHER. `sshd` on psl-vps binds ONLY the tailnet addresses —
      # `100.127.102.63:22` and its IPv6 — so a GitHub-hosted runner has no
      # route to port 22 at all; it is not a firewall rule that could be opened,
      # there is nothing listening. Measured, after a first version of this step
      # was written assuming a public address.
      #
      # ⚠ THE RUNNER JOINS AS AN EPHEMERAL NODE, which is the point of using an
      # OAuth client rather than a reusable auth key: the node is created for
      # this job and removed when it ends, so a tailnet does not slowly fill
      # with dead CI machines that still hold an ACL grant.
      #
      # ⚠ AND THE KEY CAN DO NOTHING ELSE. `authorized_keys` on the box pins
      # `infra/scripts/verify-rollout.sh` as a forced command with `restrict`,
      # so this credential cannot open a shell, read a secret or change a
      # workload — see infra/scripts/README.md. If it were a general-purpose
      # deploy key, it would be the most valuable secret in the organisation.
      #
      # ⚠ SKIPPED RATHER THAN FAILED WHEN NO KEY IS CONFIGURED, so the pipeline
      # keeps working on a fork and on a repository that has not set this up.
      # A verification step that fails closed on a missing secret is a step
      # somebody deletes.
      # ⚠ SCOPED BY AN ACL TAG, NOT BY BEING ON THE TAILNET. Joining a tailnet is
      # not an authorisation; `tag:ci` is, and the tailnet policy should grant it
      # nothing but port 22 on the one host. Without that, a CI credential is a
      # route to every machine on the network.
      - name: Join the tailnet
        if: ${{ steps.push.outputs.pushed == 'true' && env.HAS_TAILSCALE == 'true' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify the rollout
        id: verify
        if: ${{ steps.push.outputs.pushed == 'true' && env.HAS_DEPLOY_KEY == 'true' && env.HAS_TAILSCALE == 'true' }}
        continue-on-error: true
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || 'i10-deploy' }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          PINNED: ${{ steps.pin.outputs.pinned }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          # ⚠ A PINNED HOST KEY, NEVER `StrictHostKeyChecking=no`. Turning the
          # check off means the first machine to answer on that address gets a
          # CI credential and the commands it runs — which is the entire attack
          # this file is otherwise careful about.
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          images=$(tr ' ' ',' <<<"${PINNED:-}")

          ssh -i ~/.ssh/deploy \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
              "${REVISION} ${images}"

      - name: Summarise
        env:
          PINNED: ${{ steps.pin.outputs.pinned }}
          VERIFIED: ${{ steps.verify.outcome }}
          REVISION: ${{ steps.revision.outputs.sha }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "Pinned at \`${GITHUB_SHA:0:7}\`: \`${PINNED:-nothing}\`"
            echo "Deploy commit: \`${REVISION:0:7}\`"
            echo ""
            case "${VERIFIED:-skipped}" in
              success)
                echo "✅ Argo synced to that commit and every deployment is ready."
                ;;
              failure)
                echo "❌ **The rollout did not come up.** The commit is on \`main\` and Argo"
                echo "will keep trying, so production may be part-way between two versions."
                echo ""
                echo "To put the previous images back:"
                echo ""
                echo '```bash'
                echo "git revert --no-edit ${REVISION}"
                echo "git push"
                echo '```'
                echo ""
                echo "⚠ \`kubectl rollout undo\` will NOT work: every app here has Argo"
                echo "selfHeal on, so the cluster is reverted to git within about 35 seconds."
                echo "Reverting the commit is the rollback."
                ;;
              *)
                if [ "${PUSHED:-false}" != "true" ]; then
                  echo "Nothing to deploy — the manifests already referenced these digests."
                else
                  echo "⚠ Rollout not verified — \`DEPLOY_SSH_KEY\` or"
                  echo "\`TAILSCALE_OAUTH_CLIENT_ID\` is not configured. The box's sshd"
                  echo "listens only on the tailnet, so both are required."
                  echo "See infra/scripts/README.md."
                fi
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠ THE JOB FAILS *AFTER* THE SUMMARY IS WRITTEN. `continue-on-error` above
      # is what lets the summary explain the failure and print the revert
      # command; without this step the job would then go green on a rollout that
      # never came up, which is worse than not checking at all.
      - name: Fail if the rollout did not come up
        if: ${{ steps.verify.outcome == 'failure' }}
        run: |
          echo "::error::The deploy commit is on main but the rollout is not healthy. See the job summary."
          exit 1
