# Builds the self-hosted Autumn images from a pinned upstream commit.
#
# ⚠ PINNED TO A COMMIT, NOT A TAG AND NOT `main`. Autumn ships Drizzle
# migrations, and this repo's migrate Job applies whatever the image carries. On
# `main`, an upstream merge would migrate our entitlement database on the next
# Argo sync — with nobody deciding to, and no way to know it happened until a
# balance reads wrong. The SHA below is the version we have actually run.
#
# ⚠ AND IT IS MANUAL ON PURPOSE. No schedule, no `on: push` to their repo. The
# upgrade path is: bump AUTUMN_REF, run this, read the migration diff in the new
# image, then sync. A separate step that a person performs, because it is the
# one operation here that can lose customer entitlement state.
#
# To upgrade:
#   1. Read the upstream diff, paying attention to `shared/drizzle/`.
#   2. Bump AUTUMN_REF, run this workflow.
#   3. Pin the new digest in infra/k8s/i10/autumn/, then let Argo sync.
name: autumn image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream commit to build (overrides AUTUMN_REF)"
        required: false
        type: string

env:
  # The upstream revision we build. Bump deliberately; see above.
  #
  # useautumn/autumn @ main as of 2026-09-03. Pinned rather than tracked: the
  # image carries Drizzle migrations that our PreSync Job applies to the
  # entitlement database, so `main` here would let an upstream merge migrate
  # production on the next Argo sync with nobody deciding to.
  AUTUMN_REF: e60fc94cd9c766610bca7cb62e2a601fce8c697b
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out i10 (for the dashboard Dockerfile)
        uses: actions/checkout@v5
        with:
          path: i10

      - name: Check out Autumn at the pinned revision
        uses: actions/checkout@v5
        with:
          repository: useautumn/autumn
          ref: ${{ inputs.ref || env.AUTUMN_REF }}
          path: autumn

      - name: Record the exact commit
        id: rev
        working-directory: autumn
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ⚠ THE RUNNER RUNS OUT OF DISK WITHOUT THIS, AND THE FAILURE IS
      # UNREADABLE. `ubuntu-latest` ships with ~14 GB free; Autumn is a large
      # Bun monorepo and buildx writes both the image and its exported cache to
      # the same disk. When it fills, what fails first is the runner's own
      # logger — `No space left on device` writing Worker_*.log — so the job
      # dies with NO LOGS AT ALL and only a check annotation to say why. It
      # reads like the build failed for no reason.
      #
      # These are preinstalled toolchains this build never touches, and they
      # are worth about 25 GB between them.
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠ THEIR DOCKERFILE, THEIR CONTEXT. `docker/Dockerfile` does `COPY . .`
      # from the repo root and lists every workspace manifest by hand — build it
      # from anywhere else and the install layer fails on a missing package.json.
      - name: Build and push the base server image
        uses: docker/build-push-action@v7
        with:
          context: autumn
          file: autumn/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/i10-tech/autumn-base:${{ steps.rev.outputs.sha }}
            ${{ env.REGISTRY }}/i10-tech/autumn-base:latest
          cache-from: type=gha
          # `min` rather than `max`: exporting every intermediate layer is
          # the single largest consumer of the disk that ran out above, and
          # it buys little for a build that runs by hand a few times a year.
          cache-to: type=gha,mode=min

      # ⚠ ONE LINE CHANGED, AND THE BUILD FAILS IF IT CANNOT BE. See
      # infra/autumn/server.Dockerfile: upstream hard-codes four worker
      # processes at ~470 MB each, which does not fit on this box beside
      # Postgres and a mail server. The patch is guarded, so an upstream
      # rewording breaks the build here rather than quietly restoring four
      # processes and OOM-killing something weeks later.
      - name: Build and push the patched server image
        uses: docker/build-push-action@v7
        with:
          context: i10/infra/autumn
          file: i10/infra/autumn/server.Dockerfile
          push: true
          build-args: |
            BASE=${{ env.REGISTRY }}/i10-tech/autumn-base:${{ steps.rev.outputs.sha }}
          tags: |
            ${{ env.REGISTRY }}/i10-tech/autumn:${{ steps.rev.outputs.sha }}
            ${{ env.REGISTRY }}/i10-tech/autumn:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # ⚠ THE URLS ARE BAKED IN HERE. Vite resolves `import.meta.env` at build
      # time, so these cannot be moved to the Deployment later — changing them
      # means rebuilding this image.
      - name: Build and push the dashboard image
        uses: docker/build-push-action@v7
        with:
          context: autumn
          file: i10/infra/autumn/dashboard.Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=https://autumn.i10.tech
            VITE_FRONTEND_URL=https://billing.i10.tech
          tags: |
            ${{ env.REGISTRY }}/i10-tech/autumn-dashboard:${{ steps.rev.outputs.sha }}
            ${{ env.REGISTRY }}/i10-tech/autumn-dashboard:latest
          cache-from: type=gha
          # `min` rather than `max`: exporting every intermediate layer is
          # the single largest consumer of the disk that ran out above, and
          # it buys little for a build that runs by hand a few times a year.
          cache-to: type=gha,mode=min

      - name: Say what was built
        run: |
          echo "Built useautumn/autumn @ ${{ steps.rev.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in infra/k8s/i10/autumn/ before syncing." >> "$GITHUB_STEP_SUMMARY"
