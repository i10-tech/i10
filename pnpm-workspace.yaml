packages:
  - "apps/*"
  - "packages/*"

# ⚠ OVERRIDES BELONG IN THIS FILE, NEVER IN package.json.
#
# pnpm 11 no longer reads the `pnpm` field in package.json. It prints one WARN
# and then installs anyway, so a stale `pnpm.overrides` block is invisible —
# the install succeeds and the lockfile regenerates without the pins. PSL keeps
# ~30 CVE remediations in that field, and that is precisely why its pnpm 11
# upgrade was abandoned. i10 starts here so the trap never applies. Add pins as
# a top-level `overrides:` key; `@`-prefixed names must be quoted, because YAML
# reserves the character.

# Supply-chain gate: refuse a version published less than this many minutes
# ago. A good package suddenly republished is the shape of a maintainer-account
# compromise, and the cost is one extra metadata pass at install time.
#
# 1440 = 24h.
minimumReleaseAge: 1440

# Dependency build scripts are blocked by default since pnpm 10, and each one
# is opted in here by name so that allowing it is a decision somebody made.
#
# ⚠ THE KEY IS `allowBuilds`, NOT `onlyBuiltDependencies`. pnpm 11 renamed it,
# and the old name is silently ignored — the install completes, the scripts do
# not run, and the failure surfaces much later as tsup or Astro dying at the
# point where esbuild's binary should be. `pnpm approve-builds <pkg>` writes
# this block, and it rewrites the file, so comments near an edited key can be
# lost; re-read the file after running it.
#
# esbuild's postinstall fetches its platform binary. tsup (the SDK build) and
# Astro (the docs build) both need it.
allowBuilds:
  esbuild: true
  # vue-demi's postinstall picks the Vue 2 or Vue 3 shim for the installed Vue.
  # Scalar's API-reference component is Vue-based, so the docs build needs the
  # right one selected; without it the postinstall is skipped and the shim can
  # resolve against the wrong major.
  vue-demi: true
