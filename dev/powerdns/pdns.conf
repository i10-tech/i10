# The nameserver's configuration, replacing the image's default.
#
# ⚠ THE IMAGE'S OWN pdns.conf IS WHAT MADE THIS FILE NECESSARY, AND THE FAILURE
# IS NOT OBVIOUS. It ships:
#
#     launch=gsqlite3
#     gsqlite3-dnssec
#     gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
#
# Passing `--launch=gpgsql` on the command line overrides the first line, so the
# sqlite backend is never loaded — and the two settings BELOW it are then
# settings for a backend that does not exist. PowerDNS treats that as fatal:
#
#     Fatal error: Trying to set unknown setting 'gsqlite3-dnssec'
#
# which names a backend nobody asked for and mentions neither the config file
# nor the flag that caused it. No arrangement of command-line arguments fixes
# it; the file has to go.
#
# ⚠ AND IT IS MOUNTED IN PRODUCTION TOO, from a ConfigMap, for the same reason.
# See infra/k8s/i10/powerdns/. Keep the two in step — a setting added here and
# not there is a difference that only shows up under real traffic.

launch=gpgsql

gpgsql-host=postgres
gpgsql-port=5432
gpgsql-dbname=i10
gpgsql-user=pdns
gpgsql-password=pdns

# ⚠ THE SCHEMA IS SELECTED BY `search_path`, NOT BY QUALIFYING THE QUERIES.
# PowerDNS's gpgsql backend emits unqualified table names and offers no way to
# prefix them, so this is the only thing that makes it find `pdns.domains`
# rather than looking in `public` and reporting an empty server.
gpgsql-extra-connection-parameters=options=-csearch_path=pdns

# ⚠ OFF BECAUSE OUR WRITER DOES NOT MAINTAIN THE COLUMNS IT NEEDS. With DNSSEC
# on, PowerDNS expects `ordername` and `auth` on every record, and
# apps/api/src/domains/powerdns.ts writes neither — the result is a zone that
# answers NXDOMAIN for names that exist.
gpgsql-dnssec=no

# An authoritative server that recurses is an open resolver, which is an
# amplification reflector with our address on it. There is also no secondary to
# transfer to, and an open transfer hands anybody the list of customer domains.
disable-axfr=yes

local-address=0.0.0.0
local-port=53

# ⚠ THE ZONE CACHE IS REFRESHED EVERY MINUTE, NOT EVERY FIVE. PowerDNS caches
# the LIST OF ZONES it serves and only re-reads it on this interval; the default
# is 300 seconds, and until then a zone the API has just written answers REFUSED
# — not NXDOMAIN, REFUSED, as though we were not authoritative for it at all.
# Measured here: a zone inserted while the server was running was invisible
# until it was restarted.
#
# ⚠ THAT MATTERS BECAUSE CREATING A DOMAIN AND PUBLISHING ITS ZONE ARE ONE
# TRANSACTION. The customer presses "Add domain", is shown records, publishes
# them, presses Verify — and for five minutes our own nameserver would deny
# knowing the zone, which the new delegation check would correctly report as
# `nameserver_silent`, i.e. our fault. It would be, and it would clear on its
# own, which is the worst kind of intermittent.
#
# ⚠ NOT ZERO. Disabling the cache entirely puts a database query on the path of
# every DNS question, so a Postgres hiccup becomes a DNS outage. Sixty seconds
# keeps the cache doing its job and shortens the window to something nobody
# notices while they are still copying records into another tab.
zone-cache-refresh-interval=60

loglevel=4
log-dns-queries=no
