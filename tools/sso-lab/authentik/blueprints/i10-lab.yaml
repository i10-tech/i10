# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The i10 SSO lab in authentik: the same six people and three groups as
# OpenLDAP and Keycloak, a SAML and an OIDC application for i10, and an
# outbound SCIM provider into i10. Values come from the container environment
# (!Env); apply.sh re-applies them over the API after the connection ids exist.
version: 1
metadata:
  name: i10 SSO lab
entries:
  # ---- people and groups ---------------------------------------------------
  - model: authentik_core.group
    id: g-engineering
    identifiers: { name: engineering }
  - model: authentik_core.group
    id: g-sales
    identifiers: { name: sales }
  - model: authentik_core.group
    id: g-admins
    identifiers: { name: admins }

  - model: authentik_core.user
    id: u-alice
    identifiers: { username: alice }
    attrs:
      name: Alice Admin
      email: !Format ["alice@%s", !Env LAB_DOMAIN]
      password: !Env LAB_USER_PASSWORD
      attributes: { manager: "", title: Engineering lead }
      groups: [!KeyOf g-engineering, !KeyOf g-admins]
  - model: authentik_core.user
    id: u-bob
    identifiers: { username: bob }
    attrs:
      name: Bob Builder
      email: !Format ["bob@%s", !Env LAB_DOMAIN]
      password: !Env LAB_USER_PASSWORD
      attributes: { manager: !Format ["alice@%s", !Env LAB_DOMAIN], title: Engineer }
      groups: [!KeyOf g-engineering]
  - model: authentik_core.user
    identifiers: { username: carol }
    attrs:
      name: Carol Coder
      email: !Format ["carol@%s", !Env LAB_DOMAIN]
      password: !Env LAB_USER_PASSWORD
      attributes: { title: Engineer }
      groups: [!KeyOf g-engineering]
  - model: authentik_core.user
    id: u-dave
    identifiers: { username: dave }
    attrs:
      name: Dave Deals
      email: !Format ["dave@%s", !Env LAB_DOMAIN]
      password: !Env LAB_USER_PASSWORD
      attributes: { title: Head of sales }
      groups: [!KeyOf g-sales]
  - model: authentik_core.user
    identifiers: { username: erin }
    attrs:
      name: Erin Closer
      email: !Format ["erin@%s", !Env LAB_DOMAIN]
      password: !Env LAB_USER_PASSWORD
      attributes:
        { manager: !Format ["dave@%s", !Env LAB_DOMAIN], title: Account executive }
      groups: [!KeyOf g-sales]
  - model: authentik_core.user
    identifiers: { username: frank }
    attrs:
      name: Frank Root
      email: !Format ["frank@%s", !Env LAB_DOMAIN]
      password: !Env LAB_USER_PASSWORD
      attributes: { title: IT administrator }
      groups: [!KeyOf g-admins]

  # ---- SAML ----------------------------------------------------------------
  - model: authentik_providers_saml.samlpropertymapping
    id: saml-email
    identifiers: { name: i10 lab - email }
    attrs: { saml_name: email, expression: "return request.user.email" }
  - model: authentik_providers_saml.samlpropertymapping
    id: saml-first
    identifiers: { name: i10 lab - firstName }
    attrs:
      saml_name: firstName
      expression: |
        return request.user.name.split(" ")[0]
  - model: authentik_providers_saml.samlpropertymapping
    id: saml-last
    identifiers: { name: i10 lab - lastName }
    attrs:
      saml_name: lastName
      expression: |
        return " ".join(request.user.name.split(" ")[1:])
  - model: authentik_providers_saml.samlpropertymapping
    id: saml-groups
    identifiers: { name: i10 lab - groups }
    attrs:
      saml_name: groups
      expression: |
        return [g.name for g in request.user.ak_groups.all()]
  - model: authentik_providers_saml.samlpropertymapping
    id: saml-manager
    identifiers: { name: i10 lab - manager }
    attrs:
      saml_name: manager
      expression: |
        return request.user.attributes.get("manager", "")
  - model: authentik_providers_saml.samlpropertymapping
    id: saml-nameid
    identifiers: { name: i10 lab - NameID is the email }
    attrs: { saml_name: nameid, expression: "return request.user.email" }
  - model: authentik_providers_saml.samlprovider
    id: saml-provider
    identifiers: { name: i10 lab SAML }
    attrs:
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      acs_url:
        !Format [
          "%s/sso/saml/acs/%s",
          !Env AUTH_ORIGIN,
          !Env CONNECTION_ID_AUTHENTIK_SAML,
        ]
      issuer: authentik-lab
      audience:
        !Format [
          "%s/sso/saml/metadata/%s",
          !Env AUTH_ORIGIN,
          !Env CONNECTION_ID_AUTHENTIK_SAML,
        ]
      sp_binding: post
      name_id_mapping: !KeyOf saml-nameid
      signing_kp:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      sign_assertion: true
      sign_response: false
      property_mappings:
        - !KeyOf saml-email
        - !KeyOf saml-first
        - !KeyOf saml-last
        - !KeyOf saml-groups
        - !KeyOf saml-manager
  - model: authentik_core.application
    id: saml-app
    identifiers: { slug: i10-lab-saml }
    attrs:
      name: i10 (SAML)
      provider: !KeyOf saml-provider

  # ---- OIDC ----------------------------------------------------------------
  - model: authentik_providers_oauth2.scopemapping
    id: oidc-groups
    identifiers: { name: i10 lab - groups claim }
    attrs:
      scope_name: groups
      expression: |
        return {"groups": [g.name for g in request.user.ak_groups.all()],
                "manager": request.user.attributes.get("manager", "")}
  - model: authentik_providers_oauth2.oauth2provider
    id: oidc-provider
    identifiers: { name: i10 lab OIDC }
    attrs:
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env AUTHENTIK_OIDC_CLIENT_ID
      client_secret: !Env AUTHENTIK_OIDC_CLIENT_SECRET
      issuer_mode: per_provider
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/sso/callback", !Env AUTH_ORIGIN]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !KeyOf oidc-groups
  - model: authentik_core.application
    id: oidc-app
    identifiers: { slug: i10-lab-oidc }
    attrs:
      name: i10 (OIDC)
      provider: !KeyOf oidc-provider

  # ---- outbound SCIM into i10 ------------------------------------------------
  - model: authentik_providers_scim.scimmapping
    id: scim-user-manager
    identifiers: { name: i10 lab - SCIM user with manager }
    attrs:
      expression: |
        mgr = user.attributes.get("manager", "")
        out = {
            "userName": user.email,
            "name": {"givenName": user.name.split(" ")[0],
                     "familyName": " ".join(user.name.split(" ")[1:]),
                     "formatted": user.name},
            "displayName": user.name,
            "active": user.is_active,
            "emails": [{"value": user.email, "type": "work", "primary": True}],
        }
        if mgr:
            out["urn:ietf:params:scim:schemas:extension:enterprise:2.0:User"] = {"manager": {"value": mgr}}
        return out
  - model: authentik_providers_scim.scimprovider
    id: scim-provider
    identifiers: { name: i10 lab SCIM }
    attrs:
      url: !Format ["%s/scim/v2/%s", !Env API_ORIGIN_FROM_CONTAINERS, !Env DIRECTORY_ID]
      token: !Env SCIM_TOKEN
      exclude_users_service_account: true
      property_mappings:
        - !KeyOf scim-user-manager
      property_mappings_group:
        - !Find [
            authentik_providers_scim.scimmapping,
            [managed, goauthentik.io/providers/scim/group],
          ]
  - model: authentik_core.application
    id: scim-app
    identifiers: { slug: i10-lab-scim }
    attrs:
      name: i10 (SCIM push)
      backchannel_providers: [!KeyOf scim-provider]
