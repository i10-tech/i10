# Worktrunk project config (worktrunk.dev/hook). Every worktree is made with
# `wt switch --create <branch>`; these hooks make it ready before anything runs
# in it, so an agent started with `-x` never sees a cold checkout.
#
# ⚠ COPY FIRST, THEN INSTALL. The copy clones the primary checkout's
# dependencies and build output (copy-on-write on APFS, so 2 GB of
# node_modules costs nothing), limited to what .worktreeinclude lists. The
# install then only fixes what this branch's lockfile changed.
#
# ⚠ --require-include, BECAUSE THE LIST IS READ FROM THE SOURCE CHECKOUT, not
# from the new worktree. A primary checkout on a branch older than
# .worktreeinclude has no list, and without the flag that means "copy every
# ignored file": env files, the lab's CA key, Terraform state (seen
# 2026-11-01). With it, no list means no copy, and the install does it all.
[[pre-start]]
copy = "wt step copy-ignored --require-include"

[[pre-start]]
install = "bun install --frozen-lockfile"
